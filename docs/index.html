<script>
const COURSE={units:[],warmup:{}};
// Daily mouth warm-up: exercises, tongue twisters, pen-in-mouth reading.
COURSE.warmup.exercises=[
 {name:"Jaw opener",secs:30,bn:"মুখ ধীরে ধীরে যতটা সম্ভব বড় করে খোলো, ২ সেকেন্ড ধরে রাখো, তারপর আস্তে বন্ধ করো। বারবার করো।",cue:"Open wide… hold… close."},
 {name:"Lip trill",secs:30,bn:"ঠোঁট আলগা রেখে বাতাস ছেড়ে 'ব্রররর' শব্দ করো, মোটরবাইকের মতো। ঠোঁট কাঁপবে।",cue:"Brrrrrr…"},
 {name:"Smile and pout",secs:30,bn:"বড় করে হাসো আর বলো 'ইইই', তারপর ঠোঁট গোল করে সামনে এনে বলো 'উউউ'। দ্রুত বদলাও।",cue:"Eee… ooo… eee… ooo…"},
 {name:"Tongue circles",secs:40,bn:"মুখ বন্ধ রেখে জিভ দিয়ে দাঁতের সামনের দিকে গোল গোল ঘোরাও। ২০ সেকেন্ড এক দিকে, তারপর উল্টো দিকে।",cue:"Circle… other way…"},
 {name:"Cheek push",secs:30,bn:"জিভ দিয়ে ভেতর থেকে বাম গালে চাপ দাও, তারপর ডান গালে। ২ সেকেন্ড করে ধরে রাখো।",cue:"Left… right…"},
 {name:"Tongue stretch",secs:30,bn:"জিভ যতটা সম্ভব বাইরে বের করো, উপরে নাকের দিকে, তারপর নিচে থুতনির দিকে টানো।",cue:"Out… up… down…"},
 {name:"TH position",secs:30,bn:"জিভের আগা উপরের দাঁতের নিচে হালকা ছুঁইয়ে বাতাস ছাড়ো: থ্‌থ্‌থ্‌ (think)। তারপর গলা কাঁপিয়ে দ্‌দ্‌দ্‌ (this)। বাংলার 'থ' বা 'দ' নয় — জিভ দাঁতের মাঝে।",cue:"think, thank, three… this, that, they…"},
 {name:"V and W",secs:30,bn:"V: উপরের দাঁত নিচের ঠোঁটে রেখে ভ্‌ভ্‌ভ্‌ — very, video। W: দাঁত ছোঁয় না, ঠোঁট গোল করে 'উ' থেকে শুরু — we, work, website।",cue:"very… we… video… work… van… won…"},

 {name:"Tongue clicks",secs:20,bn:"জিভ তালুতে লাগিয়ে জোরে 'টক' শব্দ করো, ঘোড়ার পায়ের আওয়াজের মতো।",cue:"Click… click… click…"}
];
COURSE.warmup.twisters=[
 {t:"Red lorry, yellow lorry.",focus:"R and L",lv:1,bn:"R: জিভ কোথাও ছোঁয় না। L: জিভের আগা দাঁতের পেছনের মাড়িতে।"},
 {t:"Very well, very well, very well.",focus:"V and W",lv:1,bn:"very = দাঁত ঠোঁটে; well = ঠোঁট গোল।"},

COURSE.warmup.passages=[
 {title:"The Power of Small Steps",text:`Many people think that learning a language needs a lot of time. They wait for a free month, a quiet holiday, or a perfect moment. But the perfect moment never comes. The truth is simple: small steps, every day, are more powerful than big steps once a month.

Think about brushing your teeth. You do not brush for two hours on Sunday. You brush for two minutes, twice a day, every day. Speaking practice works in the same way. Ten minutes every morning is better than three hours on the weekend.

When you practice every day, your mouth gets used to new sounds. Your brain finds words faster. Slowly, you stop translating in your head. One day, you will answer a question in English before you even think about it. That day will feel like magic, but it is not magic. It is the result of many small steps.`},
 {title:"A Good Client Message",text:`A good message to a client is short, clear and friendly. It starts with a greeting, like "Hi Sarah, I hope you're well." Then it gives the main information first. If the work is finished, say what you finished, using the past tense: "I finished the homepage and fixed the menu."

If there is a problem, do not hide it. Clients trust people who are honest. Say sorry, explain the reason in simple words, and give a new plan: "I'm sorry, but the site won't be ready until Saturday. I found an issue with a plugin, and I want to make sure everything works perfectly."

Always end with a clear next step. For example, "I'll send you a preview link tonight," or "Could you let me know your thoughts by Friday?" A friendly closing, like "Thank you for your patience," makes the message warm. Clear, honest and polite: that is the voice of a professional.`},
 {title:"Morning in Dhaka",text:`Early in the morning, Dhaka is a different city. The streets are quiet, and the air feels fresh. Before the traffic starts, you can hear birds singing in the trees. A man is selling hot tea at the corner, and a few people are already standing around his small stall.

Slowly, the city wakes up. Rickshaws start to move along the roads. Shopkeepers open their shutters with a loud metal sound. Children in clean uniforms walk to school with their parents, carrying heavy bags.

By nine o'clock, the city is completely awake. Cars, buses and motorbikes fill every road, and the sound of horns is everywhere. People are rushing to their offices. It is noisy and busy, but it is also full of energy. Millions of people, each with their own plans and dreams, are starting a new day together.`},
 {title:"Why We Practice Out Loud",text:`Reading silently and reading out loud are very different. When you read silently, only your eyes and your brain work. When you read out loud, your mouth, your tongue, your lips and your ears work too. Speaking is a physical skill, like riding a bicycle or swimming.

English has sounds that do not exist in Bangla, like the "th" in think, the "v" in video, and the "w" in website. Your mouth needs to learn new positions. At first, these positions feel strange. Your tongue feels slow and heavy. That is normal.

When you practice out loud every day, the muscles in your mouth become stronger and faster. The new sounds become easy. Reading with a pen between your teeth makes your mouth work even harder. When you take the pen out, your words will feel lighter and clearer. That is why we practice out loud.`},
 {title:"The Website That Changed a Bakery",text:`Sarah's bakery made the best chocolate cake in the neighborhood. But very few people knew about it. Her old website was slow and difficult to use on a phone. Customers could not find the menu, and nobody ordered online.

One day, Sarah decided to build a new website. She talked to a developer who asked many questions. Who are your customers? What do they need? What do you want to improve? Together, they made a simple plan: a fast homepage, a clear menu, and an easy order form.

Three months later, everything was different. The new site loaded in two seconds. Beautiful photos showed every cake. Families ordered birthday cakes from their phones in a few clicks. Sarah's online orders grew every week, and she hired two new bakers. A good website did not just look nice. It changed her business.`},
 {title:"Talking With Children",text:`Small children learn languages very quickly. They do not study grammar rules. They listen, they copy, and they play. That is why short, simple sentences are perfect for them. "Good morning!" "Wash your hands." "Are you hungry?" "Let's play!"

The secret is repetition. Children love to hear the same words every day, in the same situations. When you say "Let's brush your teeth" every morning, they soon understand it. After some time, they start saying it too.

Parents do not need perfect English to help. A warm voice, a smile, and a few simple sentences are enough. Use English during daily routines: waking up, eating, bathing and going to bed. Make it fun with songs and games. Never worry about mistakes. When parents and children learn together, the whole family grows more confident, one small sentence at a time.`},
 {title:"Confidence Is a Skill",text:`Many people believe that confidence is something you are born with. Some people have it, and some people do not. But this is not true. Confidence is a skill, and like every skill, you can practice it.

Confident speakers still make mistakes. The difference is that they keep talking. When they forget a word, they explain it in another way. When they do not understand, they say, "Sorry, could you repeat that?" They know that communication is more important than perfection.

You can build confidence step by step. Start with small conversations: ordering coffee, asking for directions, saying hello to a neighbor. Then try longer ones, like a short call with a client. Every conversation is practice. Every mistake is a lesson. After a few months, you will look back and be surprised. The fear will be smaller, and your voice will be stronger.`}
];

 story:{title:"A Sunny Morning",bn:"সকালে আব্বু মেয়েদের ঘুম থেকে তোলে, আম্মুর সাথে কথা বলে আর সবাই মিলে ইংরেজিতে দিন শুরু করে।",
 text:`It is seven o'clock in the morning. The sun is shining through the window. Ali opens his eyes and smiles. Today is a special day, because today the whole family will try to speak English at home.

He walks to the kitchen. His wife is already there. "Good morning, dear," he says. "Good morning," she answers. "Did the kids sleep well?" Ali asks. "Yes, they slept very well. The little one is still sleeping." Ali smiles. "Can you make some tea, please? I'll get the girls ready." "Of course," she says.

Ali goes to the girls' room. The room is quiet. His older daughter is under the blanket. Only her hair is showing. Ali sits on the bed and says softly, "Good morning, sweetie! Wake up, sleepyhead!" She does not move. Ali laughs. "Open your eyes. It's time to get up."

Slowly, she opens one eye. Then she opens the other eye. "Abbu!" she says. "Did you sleep well?" Ali asks. She nods. "Give me a big hug," he says. She jumps up and gives him a big hug.

Now the little one is waking up too. She is rubbing her eyes. "Good morning, baby," Ali says. "Come here." She walks to him slowly, holding her teddy bear. "Let's stretch," Ali says. He puts his arms up. "Arms up high!" The girls copy him. They put their arms up high and laugh. "Higher! Higher!" says the older girl.

"Okay, girls," Ali says. "Hold my hand. Let's go to the bathroom." The little one stops. "Do you need to pee?" he asks. She says, "Yes!" "Okay, let's go," he says.

In the kitchen, the tea is ready. Ali's wife looks at the girls and says, "Good morning, my darlings!" The girls run to her. Ali picks up his cup of tea and says, "You know what? Let's speak English with them today. Short sentences, every day." His wife smiles. "That's a great idea. They learn so fast."

Ali drinks his tea and looks at his family. Small sentences, every morning. That is how they will all learn together.`,
 phrases:["Good morning","Did you sleep well?","Give me a big hug","It's time to get up","Hold my hand"]}},

 story:{title:"The Toothbrush Song",bn:"আব্বু গান গেয়ে মেয়েদের দাঁত ব্রাশ করায়, হাত-মুখ ধোয়ায়, আর ছোট মেয়ে নিজে পটি করতে শেখে।",
 text:`Every morning, the girls do not want to brush their teeth. They want to play. So today, Ali has a new idea. He is going to make a song.

"Girls!" he calls. "Let's brush your teeth!" The older girl shakes her head. "No, Abbu. Later." Ali smiles and starts to sing. "Brush, brush, brush your teeth, up and down, up and down!" The girls start to laugh. They run to the bathroom.

Ali puts a little toothpaste on each toothbrush. "Open your mouth wide," he says. The little one opens her mouth very, very wide. "Wow! Like a lion!" Ali says. "Now brush up and down. Up and down." The older girl brushes very fast. "Slowly, sweetie. Brush the back teeth too." Then he says, "Don't swallow the toothpaste. Spit it out." The girls spit into the sink. "Now rinse your mouth," he says. They take some water and make funny sounds.

"Now, wash your face," Ali says. He turns on the tap. The girls put their hands in the water. "Splash, splash!" says the little one. Water goes everywhere. Ali laughs. "Not on the floor, baby!"

"Now wash your hands with soap," Ali says. He gives them the soap. "Rub, rub, rub!" The girls rub their hands together. They make lots of bubbles. "Look, Abbu! Bubbles!" says the older girl. "Beautiful bubbles," Ali says. "Now rinse them. Turn off the tap, please." The older girl turns off the tap. "Good. Now dry your hands with the towel."

Then the little one pulls Ali's shirt. She looks serious. Ali asks, "Do you need the potty?" She nods. "Okay. Tell me when you need to go, every time, okay?" She sits on the potty. After a minute, she says, "Done!" Ali claps his hands. "Good job! You did it!" She is very proud. "Flush the toilet," he says, and she pushes the button. Whoosh! "Now wash your hands." She washes her hands carefully.

Ali looks at his two daughters. Clean faces, clean teeth, clean hands. "All clean!" he says. The girls shout together, "All clean!" From the kitchen, their mother calls, "Who is singing in there?" The girls sing the toothbrush song again, louder this time. It is going to be a good day.`,
 phrases:["Open your mouth wide","Spit it out","Wash your hands with soap","Good job! You did it!","All clean!"]}},

 story:{title:"The Missing Sock",bn:"মেয়েরা জামা বাছাই করে, চুল বাঁধে, আর সবাই মিলে হারানো মোজা খোঁজে।",
 text:`Today the family is going to visit Grandma. Ali looks out of the window. The sky is grey and the wind is strong. "It's cold today," he says to his wife. "The girls need warm clothes."

"Okay, girls," Ali calls. "Let's get dressed!" The older girl runs to the cupboard. She opens it and looks inside. "Which dress do you want?" Ali asks. "The pink one or the blue one?" She thinks for a long time. "The pink one!" she says. "Good choice," says Ali.

He helps her put it on. "Arms in," he says. She puts her arms in. "Head through." Her head comes out at the top, and her hair is everywhere. They both laugh. "You look beautiful!" Ali says.

The little one does not want to get dressed. She is running around the room. "Come here, baby," Ali says. "Do you want the yellow one?" She stops and looks at the yellow dress. She likes yellow. "Yes!" she says. "Arms in. Head through. All done!"

"Now wear your sweater," Ali says. "It's cold outside." The girls put on their sweaters. Then Ali says, "Let me comb your hair." The older girl sits down. "Hold still, please," he says, because she is moving her head. "Do you want a ponytail?" "Two ponytails!" she says. Ali makes two ponytails. It is not easy, but he does it.

"Now put on your shoes," he says. The little one puts her right shoe on her left foot. "Oops," says Ali. "This is your left foot. This shoe is for the right foot." She changes it. "Good girl!"

Then there is a problem. The older girl has only one sock. "Abbu, where is my other sock?" Ali looks under the bed. No sock. He looks in the cupboard. No sock. "Where are your socks?" he asks the little one. She smiles and does not say anything. Ali knows that smile. "Let's find them together," he says.

They look in the toy box. They look behind the door. Finally, they find the sock inside the little one's teddy bear house. Everybody laughs. "Why is the sock here?" Ali asks. "Teddy was cold!" says the little one.

At last, everyone is ready. Warm clothes, two ponytails, two shoes, and two socks. "Let's go to Grandma's house," says Ali.`,
 phrases:["Which dress do you want?","Arms in, head through","Hold still, please","This is your left foot","Let's find them together"]}},

 story:{title:"The Milk Accident",bn:"নাস্তার টেবিলে মেয়েরা ডিম-রুটি খায়, দুধ পড়ে যায়, আর আব্বু শান্তভাবে একসাথে পরিষ্কার করতে শেখায়।",
 text:`The kitchen smells of fresh bread and eggs. Ali's wife puts the plates on the table. "Breakfast is ready!" she calls. Ali brings the girls to the table. "Sit down, please," he says. The girls climb onto their chairs.

"Are you hungry?" Ali asks. "Yes!" both girls say. "Do you want an egg or some bread?" The older girl says, "Egg, please!" The little one points at the bread. "Bread," she says. "Bread, please," Ali says gently. "Bread, please," she repeats. "Very good!"

The older girl starts eating very fast. "Eat slowly, sweetie," Ali says. "Chew your food. Chew, chew, chew." He makes a funny face while he chews, and she laughs with her mouth full.

Then Ammu brings two cups of warm milk. "Drink your milk," she says. The little one takes her cup, but then she stops. "Hot!" she says. "Yes, it's hot. Blow on it," says Ali. He shows her: "Whoo, whoo." She blows on her milk. "Whoo, whoo." Now the milk is not too hot.

After a few minutes, the older girl's plate is empty. "Do you want some more?" Ali asks. She nods. "Then say, 'More, please.'" "More, please!" she says proudly. Ali gives her a little more egg. "And now say, 'Thank you, Abbu.'" "Thank you, Abbu!"

Then, suddenly, there is a big noise. The little one's cup falls. The milk spills all over the table and onto the floor. Her eyes fill with tears. She looks at Ali. She thinks he is angry.

Ali is not angry. "Oops! It spilled," he says calmly. "That's okay. Let's clean it up." He gives her a cloth. "You wipe here, and I wipe there." Together, they clean the table. The older girl helps too. In one minute, everything is clean again. The little one is smiling now.

"Are you full?" Ali asks the girls. "Yes, I'm full," says the older one. "Good eating!" says Ali. "Now put your plate here." The girls bring their plates to the kitchen. "Wipe your mouth," he says, and gives them a napkin. "Now let's wash your hands."

Ali's wife looks at him and smiles. "You were very patient," she says. "Mistakes are okay," Ali says. "That's how we learn, right?"`,
 phrases:["Are you hungry?","Eat slowly","It's hot. Blow on it.","More, please","That's okay. Let's clean it up."]}},

 story:{title:"The Red Ball",bn:"আব্বু মেয়েদের সাথে বল খেলে, রঙ আর সংখ্যা শেখায়, আর খেলা শেষে সবাই মিলে খেলনা গুছিয়ে রাখে।",
 text:`It is Friday afternoon. Ali has no meetings today, so he has time to play with his daughters. "Girls, let's play!" he says. The girls jump up and down. "Play! Play!"

"Where is your ball?" Ali asks. The older girl runs to her room and comes back with a big red ball. "Here, Abbu!" "Great. Now stand there," Ali says. "Throw the ball to me." She throws the ball. It goes to the left, not to Ali. He runs and catches it. Everyone laughs.

"Okay, ready? Catch!" Ali throws the ball softly. She catches it with both hands. "Yay! I did it!" "Well done!" says Ali. The little one is waiting. She wants the ball too. "It's your turn, baby," Ali says. He rolls the ball to her on the floor. She stops it with her hands and laughs. "Now it's my turn," says the older girl. They take turns again and again.

After the ball game, they sit on the carpet with a box of colorful blocks. Ali picks up one block. "What color is this?" The little one says, "Red!" "Yes! It's red. Good job." He picks up another block. "And this one?" "Blue!" says the older girl. "Show me the yellow one," Ali says. The little one looks and looks, and then she finds it. "This one!" "Wow, you're so smart!"

Then Ali takes a picture book. On one page, there are some apples on a tree. "How many apples are there?" he asks. "Let's count. One, two, three, four, five!" The girls count with him. "Five apples!" says the older girl. The little one only says, "Three!" and everyone claps anyway.

Soon it is almost dinner time. "Okay, girls. Playtime is over," Ali says. "Let's clean up." The girls do not want to stop. "Five more minutes?" asks the older girl. "Okay, two more minutes," says Ali.

When the time is over, Ali brings the toy box. "Put the toys in the box." The older girl starts to put the blocks in. The little one is holding the red ball. She does not want to give it. "Please share with your sister," Ali says. "And help your sister clean up." Slowly, the little one puts the ball in the box.

In five minutes, the room is clean. "Thank you for helping!" Ali says, and he gives them a high five.`,
 phrases:["Throw the ball to me","It's your turn","What color is this?","Let's count","Thank you for helping!"]}},

 story:{title:"Sorry, Sister",bn:"দুই বোনের ঝগড়া হয়, একজন কাঁদে, আব্বু শান্তভাবে অনুভূতি জিজ্ঞেস করে আর সরি-থ্যাংক ইউ বলতে শেখায়।",
 text:`On a rainy afternoon, the girls are playing inside. Ali is working on his laptop in the next room. Suddenly, he hears a loud cry. He closes his laptop and runs to the girls.

The little one is sitting on the floor. She is crying. The older girl is holding a doll. "Why are you crying?" Ali asks softly. The little one points at her sister. "She hit me!" "Are you hurt?" Ali asks. "Let me see." He looks at her arm. It is a little red, but it is not serious. "It's okay. Abbu is here," he says, and he gives her a hug. "Don't cry, baby."

Then he turns to the older girl. He does not shout. He sits down next to her. "What happened, sweetie?" "She took my doll!" she says. "I see. You were angry," Ali says. "That's okay. Everyone gets angry sometimes. But don't hit. Use your words. You can say, 'Please give me my doll.'"

The older girl looks at the floor. "Say sorry to your sister," Ali says. She is quiet for a moment. Then she walks to her little sister. "Sorry," she says. The little one stops crying. Ali smiles. "Good girl. And now," he says to the little one, "you can say, 'Can I play with the doll, please?'"

"Can I play, please?" says the little one. The older girl thinks. Then she gives her the doll. "Here. But be gentle." "Say thank you," Ali says. "Thank you!" says the little one.

Ali is very happy. "Well done, both of you. I'm proud of you." The girls start playing together again. But soon they are running around the living room and shouting.

"Girls," Ali says. "Walk, don't run. And inside voice, please." The girls laugh and start whispering. "Is this an inside voice, Abbu?" whispers the older girl. "Perfect," Ali whispers back.

Later, at dinner, Ali's wife asks, "How was the afternoon?" The older girl says, "We said sorry and thank you." Her mother looks surprised. "In English? Wow! Who taught you?" Both girls point at Ali. He just smiles and says, "Please pass the rice."`,
 phrases:["Why are you crying?","Are you hurt? Let me see.","Use your words","Say sorry","I'm proud of you"]}},

 story:{title:"One More Story",bn:"রাতে আব্বু মেয়েদের ঘুমের জন্য তৈরি করে, গল্প পড়ে, গান গায়, আর ভালোবাসা জানিয়ে শুভ রাত্রি বলে।",
 text:`It is eight thirty at night. The house is quiet now. Ali looks at the clock and says, "Girls, it's bedtime." The older girl says, "Not yet, Abbu! I'm not sleepy." But she is yawning. Ali laughs. "I think you are a little bit sleepy."

"First, put on your pajamas," he says. The girls have pajamas with stars on them. The little one puts her pajama top on backwards. Ali helps her. "Now let's brush your teeth." They go to the bathroom and brush their teeth, up and down, just like every morning. "And go potty before bed," Ali reminds them.

Then they go to their room. "Get into bed," Ali says. The girls jump onto the bed. "Lie down, please." They lie down, but they are still giggling.

"Which book do you want?" Ali asks. The older girl chooses a book about a little bear who cannot sleep. "Let's read a story," says Ali. He sits next to them and starts reading. "Once upon a time, there was a little bear..." When he finishes a page, he says to the little one, "Turn the page." She turns the page with her small hand. She loves this job.

When the story ends, the older girl says, "One more story, please!" Ali shakes his head. "Not tonight. But shall I sing a song?" "Yes!" they both say. Ali sings a soft song. His voice is not perfect, but the girls love it. Slowly, their eyes start to close.

"Close your eyes," he says quietly. "Time to sleep." The little one opens one eye. "Abbu, is it dark?" She is a little scared. "Don't worry. Abbu is here," he says, and he holds her hand. "And the night light is on."

Ali kisses the older girl on the forehead. "I love you so much. Good night, sweetie." "Good night, Abbu," she whispers. He kisses the little one. "Sleep tight. Sweet dreams." "Sweet dreams," she repeats, very softly. "See you in the morning," Ali says.

He turns off the big light and walks to the door. He stops and looks back. Both girls are sleeping. In the living room, his wife is waiting with two cups of tea. "Are they asleep?" she asks. "Yes," Ali says with a smile. "And tonight, they said 'good night' in English."`,
 phrases:["It's bedtime","Get into bed","Which book do you want?","Close your eyes","Sleep tight. Sweet dreams."]}}
);

 story:{title:"The First Call with Sarah",bn:"আলী একজন বেকারি মালিক সারার সাথে প্রথম কলে নিজের পরিচয় দেয়, প্রশ্ন করে প্রয়োজন বোঝে, আর কারণ দেখিয়ে পরামর্শ দেয়।",
 text:`It is Monday evening in Dhaka and Monday morning in London. Ali checks his camera and microphone. In two minutes, he has a call with a new client, Sarah. She owns a small bakery.

The call starts. "Hi, Sarah! Can you hear me okay?" "Yes, perfectly," she says. "Great. Thanks for taking the time to talk today. Hi, I'm Ali, a WordPress developer from Bangladesh. I run a small web agency called BD Webhut. We build fast, mobile-friendly websites. I've worked with WordPress since 2019, and I mostly work with Elementor and Figma. So, how can I help you with your project?"

Sarah smiles. "Well, we need a better website. Our current one is very old." "I see," says Ali. "Could you tell me a bit about your business?" "Sure. We're a family bakery. We make bread, cakes and cookies. We have two shops in London." "That sounds lovely," says Ali. "Who are your main customers?" "Mostly local families and some offices nearby. They order birthday cakes and lunch boxes."

"Do you already have a website?" Ali asks, even though he knows the answer. He wants her to explain it. "Yes, but it's terrible," she laughs. "What would you like to improve?" "Everything! People can't find our menu, and it looks bad on a phone."

Ali opens her website while they are talking. He checks it on his phone too. "Thanks. I'm looking at it now," he says. "Are there any websites you really like?" Sarah sends him two links. Both sites are clean, with big photos and simple menus.

Then Ali gives his ideas. "Okay, here's what I think. I suggest a new design because the current one is hard to use on phones. Most of your customers will visit from their phones. Also, your site loads slowly, so many visitors leave before they see your cakes." Sarah nods. "That makes sense."

"We use a page builder, which means you can edit the pages yourself. For example, you can change the menu prices without calling me." "Oh, I love that," Sarah says.

"I'd start with the homepage because it gets the most visitors. Then we can build the menu page and an order form." Sarah asks, "How much will it cost?" Ali answers politely, "Do you have a budget in mind? Then I can suggest the best option for you." She tells him her budget. It is not big, but it is fair.

"Perfect. Let me summarize what you need: a new mobile-friendly design, a fast homepage, a clear menu page, and an order form. Is that right?" "Exactly right," says Sarah. "I'll send you a detailed quote today," Ali says. "Thank you so much for your time, Sarah." After the call, Ali takes a deep breath and smiles. He did not translate from Bangla in his head. He just talked.`,
 phrases:["I run a small web agency called…","Could you tell me a bit about your business?","…because…","…, so …","Let me summarize what you need"]}},

 story:{title:"Friday Update",bn:"আলী সপ্তাহের শেষে ক্লায়েন্টকে past tense দিয়ে কী কী কাজ হয়েছে জানায়, এরপর কী হবে বলে, আর মতামত চায়।",
 text:`It is Friday afternoon. Ali has worked on Sarah's bakery website all week. Now it is time to send a progress update. He knows a good update is short, clear and friendly. He also knows that finished work needs the past tense.

He opens a voice message and starts to speak. "Hi Sarah, I hope you're having a good week. Here's a quick update on the project.

"First, I finished the homepage yesterday. It has a big photo of your cakes at the top and a clear button to see the menu. Second, I fixed the menu on mobile. Before, it was hard to open on a phone, but now it works perfectly. Third, I optimized the images, so the site is faster now. The homepage loaded in six seconds before, and now it loads in under two seconds. I also added a contact form to the About page, like you asked. Finally, I tested everything on Chrome and Safari, and on my phone and my laptop.

"So, everything is on track. I'm currently working on the shop page, where customers can order birthday cakes. I'll send you a preview link tonight. Could you take a look and let me know your thoughts? Please let me know if you'd like any changes. I'll keep you posted. Have a great weekend!"

He listens to the message once before sending it. Then he notices something. He said "I finish the homepage" in the first try, so he records it again: "I finished the homepage." Past tense for finished work. He sends it.

Ten minutes later, Sarah replies with a voice message. "Thanks, Ali! That sounds great. Quick question: do you need anything from us for the shop page?"

Ali thinks for a moment. He wants to use articles correctly, because he knows this is one of his weak points. He replies slowly and clearly. "Yes, actually. I need a list of your cakes and the prices. I also need a photo of each cake, if possible. One more thing: there is a problem with the payment plugin on your old hosting. Could you send me the login details for the hosting? Then I can fix it before we launch."

Sarah sends the details, and she adds, "The photographer sent us an email this morning with new photos. I'll forward them to you." "Perfect, thank you," Ali says. "I'll upload the new images to the server tonight, and I'll share the link in a minute when the preview is ready."

That evening, Ali reads his messages again. Finished, fixed, optimized, added, tested. A logo, an email, the server, the hosting. Small words, but they make him sound professional.`,
 phrases:["I finished / fixed / added …","Everything is on track","I'm currently working on…","Could you take a look and let me know your thoughts?","I'll keep you posted"]}},

 story:{title:"The Plugin Problem",bn:"লঞ্চের আগে প্লাগিনে সমস্যা হয়; আলী ভদ্রভাবে দেরির কথা জানায়, কারণ ব্যাখ্যা করে, আর অসন্তুষ্ট ক্লায়েন্টকে শান্তভাবে সমাধান দেয়।",
 text:`On Wednesday night, Ali finds a problem. The payment form on Sarah's website is not working. When he tests an order, the page shows an error. He checks again and again. The problem is in one of the plugins. Fixing it will take time, and the launch is on Friday.

On Thursday morning, Sarah sends a message. "Hi Ali! Just checking in. Are we still on track for Friday?" Ali feels nervous. In the past, he sometimes answered too directly, like "It will be ready Saturday, not Friday." Now he knows a better way: thank, apologize, explain, give a new time, and show care.

He replies: "Hi Sarah, thanks for checking in! I'm sorry, but the site won't be ready until Saturday. I found an issue with one of the plugins, and the payment form isn't working correctly yet. I want to make sure everything works perfectly before your customers use it. I'll send it over first thing Saturday morning. Thank you for your patience."

Sarah answers quickly. "No problem. Thanks for being honest." Ali smiles. Being honest and polite works.

On Friday, he fixes the problem. Then he explains it to Sarah in simple words, without too much technical language. "Good news! It's fixed now. The plugin was outdated, so I updated it. I also noticed the site was slow because of the hosting, so I changed a few settings. I've added a backup, just in case."

But on Saturday, Sarah calls him. She does not sound happy. "Ali, I looked at the site and it still looks old. The colors are dark, not the new ones. Honestly, I'm a bit disappointed."

Ali stays calm. He remembers the rule: first sorry, then questions, then a solution. "I'm sorry to hear that," he says. "Could you tell me which part you don't like?" "The homepage. It has the old dark colors." Ali thinks for a second. He knows the new colors are already live. "I understand your concern. I think your browser is showing the old version. Could you clear your cache and check again?"

He explains how to do it, step by step. After a minute, Sarah laughs. "Oh! Now I can see it. It looks beautiful. Sorry, Ali!" "No worries at all. It happens a lot," he says.

Then Sarah has one more request. "Could the cake photos be bigger on mobile?" "Of course," Ali says. "Here's what I suggest. I'll make the photos full-width on phones, and I'll fix it as soon as possible, today if I can. Does that work for you?" "That works perfectly," she says.

After the call, Ali writes down what he learned: stay calm, ask questions, and always offer a plan.`,

 story:{title:"Is There Any Flexibility?",bn:"নতুন ক্লায়েন্ট মার্ক দাম কমাতে চায়; আলী দাম না কমিয়ে কাজের পরিধি বদলে দুজনের জন্য ভালো একটা চুক্তি করে।",
 text:`Mark runs a small fitness studio in Toronto. He wants a website with online booking. Ali sent him a quote yesterday. Today they have a call.

"Hi Mark, thanks for joining. Did you get a chance to look at the quote?" "Yes, I did," says Mark. "Honestly, it's more than we expected. Is there any flexibility?"

In the past, Ali felt nervous when clients talked about money. Sometimes he lowered his price immediately. Now he knows his work has value. He also knows that negotiation is a normal conversation, not a fight.

"Sure, let's talk about it," Ali says. "My price for this project is six hundred dollars. It includes design, development and three months of support. The support is important, because if anything breaks after launch, I fix it for free."

"That sounds good," Mark says, "but our budget is about four hundred." Ali nods. "I understand that the budget is tight. Can I ask you a question? Which parts are most important for you right now?" Mark thinks. "The booking system, for sure. And the class schedule."

"Okay," Ali says. "I can't lower the price for the full project, but I can reduce the scope. We could start with five pages and add more later. The five pages would be the homepage, classes, schedule, booking and contact. The blog and the trainer profiles can come in the second phase."

"What would that cost?" Mark asks. "For the first phase, four hundred and fifty dollars, with the same three months of support." Mark is quiet for a moment. "Four hundred and fifty. Hmm."

Ali adds one more idea. "Also, if you pay in full, I can include the hosting setup for free. Normally I charge fifty dollars for that. That's the best I can do." Mark laughs. "You're a good negotiator, Ali." "I just want to find something that works for both of us," Ali says.

"Okay, deal," says Mark. "Let's do the first phase." Ali smiles. "Great, I'm glad we agree. I'll send you the contract and the invoice today. Once I receive the payment, I'll start. When would you like to have our first meeting?" "How about Thursday?" "Thursday works for me. I'm really looking forward to working with you. Have a great day!"

After the call, Ali writes in his notebook: never just lower the price; change the scope, add value, and stay friendly. He also notices that he spoke for twenty minutes in English without stopping to translate. That feels even better than the deal.`,
 phrases:["It includes …","I understand that the budget is tight","I can't lower the price, but I can …","If you…, I can…","Let's find something that works for both of us"]}},

 story:{title:"The Design Review",bn:"আলী ক্লায়েন্ট টিমের সাথে ভিডিও কলে ছোট আলাপ করে, স্ক্রিন শেয়ার করে ডিজাইন দেখায়, মতামত নোট করে আর সারাংশ বলে।",
 text:`On Thursday evening, Ali has a video meeting with Mark and his team from the fitness studio. It is their first design review. Ali opens his laptop ten minutes early, checks his camera, and opens the design in Figma.

At exactly nine o'clock, Mark joins the call with two people from his team, Lisa and Tom. "Hi everyone! Can you hear me okay?" Ali asks. "Yes, loud and clear," says Mark.

Before the work talk, Ali starts with some small talk. "How was your weekend, Mark?" "It was great, thanks. I went hiking with my kids. How about you?" "It was great too. I spent time with my family. My daughters are learning English with me, actually." "Oh, that's wonderful!" says Lisa. "How's the weather over there?" Ali asks. "Cold! It's snowing," says Tom. Ali laughs. "It's pretty hot here today."

"Okay, let me share my screen," Ali says. He clicks the share button. "Can you see my screen now?" There is a short silence. Then Mark's voice comes back, but it is cutting in and out. "Sorry, you're breaking up," Ali says. "Could you say that again?" Mark turns off his camera, and now the sound is clear. "Yes, we can see it."

"Great. Let's go through the design together. Feel free to stop me if you have any questions." Ali shows the homepage first. He explains the big photo, the class schedule and the booking button. Then he stops and asks, "What do you think so far?"

Lisa speaks first. "I love the photos. But the booking button is a bit small. People need to find it fast." "That's a great point," Ali says. "Let me make a note of that." He writes it down. "Just to confirm, you want the button bigger, and maybe a brighter color?" "Yes, exactly," says Lisa.

Tom asks about the menu. He wants the "Classes" link first, not "About." Ali notes that too. Mark asks if the colors can match their logo better. "Of course," says Ali.

At the end, Ali summarizes. "So, to sum up, I'll update the colors to match your logo, I'll make the booking button bigger and brighter, and I'll change the order of the menu. I'll send you the new version on Monday. Does that work for everyone?" Everyone agrees.

Ali looks at the time. It is very late for him, but it is the afternoon for them. Mark says, "Oh, what time is it there? Sorry to keep you so late." Ali smiles. "No problem at all. Thanks for your time today. Have a great evening!"

After the meeting, Ali feels proud. He asked questions, he confirmed details, and he gave a clear summary. That is what a professional sounds like.`,
 phrases:["Can you hear me okay?","Let me share my screen","Feel free to stop me…","Just to confirm, …?","So, to sum up, …"]}}
);

 story:{title:"A Wedding in Dubai",bn:"এক বিয়ের অনুষ্ঠানে আলী অপরিচিত একজনের সাথে পরিচিত হয়, নিজের কথা বলে, প্রশ্ন করে আলাপ চালিয়ে যায় আর যোগাযোগ রাখার কথা বলে।",
 text:`Ali is in Dubai for his cousin's wedding. The hall is big and full of people. Most of the guests speak English, because they come from many different countries. Ali feels a little shy, but he decides to try.

He gets a cup of tea and stands near a table. A man next to him is also holding a cup of tea. Ali smiles and says, "Hi, I'm Ali. Nice to meet you." The man shakes his hand. "Nice to meet you too. I'm Daniel." "Where are you from, Daniel?" "I'm from Kenya, but I live here in Dubai now. And you?" "I'm from Dhaka, Bangladesh."

"How do you know the host?" Daniel asks. "The groom is my cousin," Ali says. "How about you?" "I work with him. We're in the same office." "Oh, nice," says Ali.

"So, what do you do?" asks Daniel. "I'm a web developer. I build websites. I have a small agency in Dhaka." "Really? That sounds interesting," says Daniel. "I'm an accountant, so I work with numbers all day. Websites sound more fun." Ali laughs. "Sometimes! Sometimes it's very stressful."

"Do you live near here?" Ali asks. "Yes, about twenty minutes away." "How long have you lived here?" "Almost six years now. I came for a job and stayed." "Do you like it?" "I love it. It's very international. Do you have family here too?"

"Not here. My family is in Dhaka. I have two little daughters." "Oh, how old are they?" "They're both very small, under five." Daniel smiles. "They must keep you busy!" "They keep me very busy!" Ali says. "I'm teaching them English at home, actually. Short sentences every day."

"That's a great idea," says Daniel. "What do you like to do in your free time? When the kids are asleep, I mean." Ali laughs. "I enjoy reading and spending time with my family. And you?" "I play football every weekend. And I've started learning to cook." "Cooking? Tell me more about that." "I'm learning to make biryani, but it's never as good as my friend's." "Me too!" says Ali. "I've never tried to make biryani myself. I just eat it."

They both laugh. Then music starts and people move towards the stage. "It was nice talking to you, Daniel," Ali says. "You too. Here, let's keep in touch," Daniel says, and they exchange numbers.

Later, Ali thinks about the conversation. It was not perfect, but it was real. He asked questions, he listened, and he said "Tell me more." That was enough to make a new friend.`,
 phrases:["Nice to meet you","How do you know the host?","Really? That sounds interesting.","Tell me more about that","Let's keep in touch"]}},

 story:{title:"Two Shirts and a Pair of Headphones",bn:"আলী মলে শার্ট কেনে, সাইজ নিয়ে কথা বলে, কার্ডে পেমেন্ট করে, আর নষ্ট হেডফোন ফেরত দিয়ে বদলে নেয়।",
 text:`On Saturday, Ali goes to a big shopping mall. He has two jobs today. First, he needs a new shirt for client meetings. Second, he needs to return a pair of headphones that he bought last week.

He walks into a clothes shop. There are many shirts on the wall. He likes a light blue one. He looks for the price tag, but he cannot find it. A shop assistant comes over. "Hi, can I help you?" "Yes, excuse me, how much is this?" Ali asks. "That one is forty dollars," she says.

"Do you have this in a bigger size?" "Let me check. Yes, here's a large." "Can I try it on?" "Of course." "Where is the fitting room?" "It's just over there, on the right."

In the fitting room, Ali puts on the shirt. He looks in the mirror. The color is nice, but it is a bit tight around the shoulders. He comes out. "It's a bit too tight," he says. "Could I see something similar?" The assistant brings him two more shirts. One is white and one is dark blue. The dark blue one fits perfectly.

"I'll take it," Ali says. Then he sees the white shirt again. "Actually, I'll take the white one too." At the counter, he asks, "Is there a discount on this?" "Yes, if you buy two shirts, you get ten percent off." "Great!" Ali smiles. "Can I pay by card?" "Sure." He pays, and then he asks, "Could I have a bag, please? And could I have the receipt, please?" "Here you go. Have a nice day!"

Next, Ali goes to the electronics shop. He is a little nervous, because returning things can be difficult. He walks to the counter and speaks slowly and clearly. "Hi. I'd like to return these headphones. They don't work properly. The left side has no sound." The man takes the headphones and tests them. "When did you buy them?" "I bought them last week. Here's the receipt."

The man looks at the receipt. "Okay, no problem. Would you like a refund or an exchange?" Ali thinks for a moment. "Can I get an exchange for the same model?" "Yes, of course." The man brings a new box. He opens it and tests the headphones. Both sides work perfectly.

"Thanks for your help," says Ali. "You're welcome. Sorry about that," says the man.

On the way home, Ali stops at a small coffee shop. His coffee costs four dollars and fifty cents. He gives the cashier five dollars and says, "Keep the change." He sits down and drinks his coffee. Two new shirts, working headphones, and no stress. Shopping in English is getting easier.`,
 phrases:["Do you have this in a bigger size?","Can I try it on?","It's a bit too tight","I'd like to return…","Can I get a refund or an exchange?"]}},

 story:{title:"Family Dinner Out",bn:"আলীর পরিবার রেস্টুরেন্টে খেতে যায়; আলী অর্ডার দেয়, ভুল খাবার এলে ভদ্রভাবে বলে, বাচ্চাদের জন্য জিনিস চায় আর বিল দেয়।",
 text:`It is Ali's wife's birthday. To celebrate, the family goes to a nice restaurant in the city. The waiter at the door greets them. "Good evening! How many people?" "A table for four, please," Ali says. "Two adults and two little ones."

The waiter takes them to a table near the window. Ali looks at his daughters. They are too small for the big chairs. "Do you have a high chair?" he asks. "Of course. I'll bring two." "Thank you. And is there a kids' menu?" "Yes, here you go."

"Could we see the menu, please?" The waiter gives them two big menus. There are so many dishes. Ali's wife cannot decide. Ali asks the waiter, "What do you recommend?" "Our chicken curry is very popular. And the grilled fish is excellent today." "Is it spicy?" asks Ali's wife. "The curry is medium. The fish is not spicy at all." "Then I'll have the grilled fish," she says. "And I'll have the chicken curry," says Ali. For the girls, they order small pasta dishes from the kids' menu. "Could we have some water, please? And could we have a small plate for her?" Ali points at the little one.

Twenty minutes pass. Then thirty. The girls are getting hungry and restless. Ali calls the waiter politely. "Excuse me, we're still waiting for our food. Could you check on it, please?" "I'm so sorry. Let me check right away."

A few minutes later, the food arrives. But Ali looks at his plate. It is beef, not chicken. "I'm sorry, but this isn't what I ordered. I ordered the chicken curry." The waiter looks at his notes. "You're right. I apologize. I'll change it immediately."

While they wait, the little one knocks over her juice. It spills across the table. "Oh no," says Ali. "Sorry, she spilled her juice. Could we have some napkins?" The waiter comes quickly with napkins and a new juice. He even makes a funny face, and the little one laughs. "Thank you for being so kind to the kids," says Ali's wife.

Finally, everyone is eating. The chicken curry is perfect. "The food was delicious," Ali says to the waiter later. "Thank you! Would you like dessert?" They share a small chocolate cake and sing "Happy Birthday" quietly.

At the end, Ali says, "Could we have the bill, please?" There is some pasta left, so he asks, "Can I get this to go?" The waiter brings a box. Ali pays and leaves a good tip.

In the car, his wife says, "You spoke so well tonight. You weren't nervous at all." Ali smiles. "I practiced," he says.`,
 phrases:["A table for four, please","What do you recommend?","I'll have…","I'm sorry, but this isn't what I ordered","Could we have the bill, please?"]}},

 story:{title:"A Business Trip to Kuala Lumpur",bn:"আলী ব্যবসার কাজে কুয়ালালামপুর যায়; এয়ারপোর্টে কথা বলে, হোটেলে চেক-ইন করে, এসির সমস্যা জানায় আর পথ জিজ্ঞেস করে মিটিংয়ে পৌঁছায়।",
 text:`Ali is going to Kuala Lumpur for a business meeting. It is his first trip alone in a long time. At the airport in Dhaka, he looks around. "Excuse me, where is the check-in counter for Malaysia Airlines?" he asks a staff member. "Counter fourteen, on your left."

At the counter, the woman checks his passport. "Would you like a window seat or an aisle seat?" "I'd like a window seat, please," Ali says. He loves looking at the clouds.

After security, he walks to gate nine. There are many people waiting. He wants to be sure, so he asks a man sitting there. "Excuse me, is this the gate for the flight to Kuala Lumpur?" "Yes, it is. But the flight is delayed by one hour." Ali checks the screen. The man is right. My flight is delayed, he thinks. He texts his wife: "My flight is delayed. Don't worry." Later he asks the staff, "What time does boarding start?" "At eleven thirty, sir."

When he lands in Kuala Lumpur, he waits for his bag. Everyone takes their bags, but his bag does not come. He goes to the information desk. "Excuse me, I can't find my bag." The woman checks the computer. "Don't worry. It's coming on the next belt." Five minutes later, there it is. Ali feels relieved.

He takes a taxi to the hotel. At the front desk, he says, "Hi, I have a reservation under Ali Akbar." "Welcome, Mr. Akbar. You're in room four two six." "Thank you. What time is check-out?" "Twelve noon." "Is breakfast included?" "Yes, from six to ten, on the first floor." "Great. Could I have a late check-out on Friday? My flight is in the evening." "Let me see. Yes, until two o'clock is fine."

In his room, it is very hot. He tries the air conditioner, but nothing happens. He calls the front desk. "Hello, this is room four two six. The air conditioner isn't working." "I'm sorry, sir. We'll send someone right away." Ten minutes later, the room is cool.

The next morning, Ali needs to go to the client's office near the train station. He asks the receptionist, "Excuse me, how do I get to the train station? Is it far from here?" "Not really. Go straight and turn left at the second street. It's next to the bank." "Can I walk there?" "Yes, easily." "How long does it take?" "About ten minutes."

Ali walks there in the warm morning air. He arrives early for his meeting. He thinks, I asked for help many times today, and every time, it worked.`,
 phrases:["Excuse me, how do I get to…?","Go straight and turn left","I have a reservation under…","… isn't working","My flight is delayed"]}},

 story:{title:"The Doctor's Appointment",bn:"আলী মেয়ের জন্য ফোনে ডাক্তারের অ্যাপয়েন্টমেন্ট নেয়, বুঝতে না পারলে আবার বলতে বলে, সময় বদলায় আর ভুল ঠিক করে।",
 text:`The little one has a cough. It is not serious, but Ali and his wife want a doctor to check her. The children's clinic has an English-speaking receptionist, so Ali decides to call.

He takes a deep breath and dials the number. "Good morning, City Kids Clinic. How can I help you?" "Hello, this is Ali speaking. I'd like to make an appointment for my daughter." "Of course. Is this her first visit?" "No, she came here last year." "What's her name and date of birth?"

The receptionist speaks very fast. Ali catches only half of it. "Sorry, could you speak a little slower?" "Of course. What is your daughter's name, and what is her date of birth?" Ali gives the information. "Thank you. Is Tuesday at ten okay?"

Ali thinks. At ten on Tuesday, he has a call with a client. "Could we make it a bit later?" "Let me see. We have eleven thirty or two fifteen." "Sorry, I didn't catch that. Could you repeat that, please?" "Eleven thirty or two fifteen." "Eleven thirty is perfect. Let me write that down. Tuesday, eleven thirty." "Great. See you then." "See you then. Thank you!"

On Monday evening, the clinic sends a text message. It says: "Reminder: your appointment is on Wednesday at 11:30." Ali reads it twice. Wednesday? He booked Tuesday. He calls the clinic again.

"Hello, this is Ali Akbar. I think there's been a mistake. I booked an appointment for Tuesday at eleven thirty, but the message says Wednesday." "Oh, let me check. You're right, I'm very sorry. It's Tuesday. The message was wrong." "No worries, it happens," Ali says. "Thanks for checking."

On Tuesday morning, there is heavy traffic. At eleven twenty, Ali is still in the car. He calls the clinic. "Hi, this is Ali Akbar. I have an appointment at eleven thirty. I'm running ten minutes late. Is that okay?" "That's fine. Thanks for letting us know."

At the clinic, the doctor checks the little one. "It's just a small cold. Give her warm water and let her rest." Then the doctor says something Ali does not understand: "If the cough persists, come back." "What do you mean, persists?" Ali asks. "If it continues, if it doesn't stop after a week." "Ah, I see. Thank you."

When they leave, Ali says to the receptionist, "Thanks, you've been very helpful." In the car, the little one coughs and says, "Thank you, doctor!" Ali laughs. She is learning too.`,

const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
function wordMatch(target,heard){
  const disp=words(target), tw=disp.map(w=>norm(w).replace(/\s+/g,"")), hw=norm(heard).split(" ").filter(Boolean);
  const eq=(a,b)=>a===b||(a.length>4&&lev(a,b)<=1)||(a.replace(/'/g,"")===b.replace(/'/g,""));
  const m=tw.length,n=hw.length,dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=eq(tw[i],hw[j])?1+dp[i+1][j+1]:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(m).fill(false);let i=0,j=0;
  while(i<m&&j<n){if(eq(tw[i],hw[j])){ok[i]=true;i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
  return {words:disp.map((w,k)=>({w,ok:ok[k]})),score:m?ok.filter(Boolean).length/m:0};
}

  this.stop();const r=new SRC();this.rec=r;r.lang="en-US";r.interimResults=true;r.maxAlternatives=4;r.continuous=false;
  let best={score:-1,text:""};let finished=false;
  const fin=(err)=>{if(finished)return;finished=true;this.on=false;this.rec=null;onDone&&onDone(err,best);};
  r.onresult=e=>{for(let k=e.resultIndex;k<e.results.length;k++){const res=e.results[k];
    for(let a=0;a<res.length;a++){const t=res[a].transcript;const sc=wordMatch(target,t).score;if(sc>best.score||(sc===best.score&&res.isFinal))best={score:sc,text:t};}}
    onInterim&&onInterim(best);};
  r.onerror=e=>fin(e.error||"error");r.onend=()=>fin(null);
  try{r.start();this.on=true;}catch(e){fin("start");}
  setTimeout(()=>{if(this.rec===r)try{r.stop();}catch(e){}},12000);

function emojify(html){
  if(!EMOJI_SET.size)return html;
  const parts=html.split(/(<[^>]*>)/);let skip=0;
  for(let i=0;i<parts.length;i++){const p=parts[i];if(!p)continue;

  return parts.join("");
}

function weekKey(d){d=d?new Date(d):new Date();const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn);return t.toISOString().slice(0,10);}
function weekXP(st){const wk=weekKey();let x=0;for(const [k,v] of Object.entries(st.days||{}))if(weekKey(k+"T12:00:00")===wk)x+=v.xp||0;return x;}

function questsToday(){
  const pool=isKid()?QUESTS.kid:QUESTS.adult.filter(q=>q.id!=="wu"||warmAllowed());
  const seed=+today().replace(/-/g,"");const picks=[];let k=seed;
  while(picks.length<3&&picks.length<pool.length){k=(k*9301+49297)%233280;const q=pool[k%pool.length];if(!picks.includes(q))picks.push(q);}
  const d=day();return picks.map(q=>{const n=typeof q.n==="function"?q.n():q.n;const v=Math.min(n,q.v(d));return {...q,n,v,done:v>=n};});
}

/* ================= confetti ================= */
function confetti(n=60){
  if(RM.matches||!document.body.animate)return;
  const cols=["#4fbf93","#e08a2e","#7c62d4","#d6516b","#3a7fcc","#f2c94c"];const W=innerWidth,H=innerHeight;
  for(let i=0;i<n;i++){const p=document.createElement("i");p.className="confetto";p.style.background=cols[i%cols.length];p.style.left=(W/2)+"px";p.style.top=(H*.35)+"px";
   if(i%3===0)p.style.borderRadius="50%";document.body.append(p);
   const ang=Math.random()*Math.PI*2,sp=120+Math.random()*260,dx=Math.cos(ang)*sp,dy=Math.sin(ang)*sp-160;
   const a=p.animate([{transform:"translate(-50%,-50%) rotate(0)",opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(${Math.random()*540}deg)`,opacity:1,offset:.45},{transform:`translate(calc(-50% + ${dx*1.2}px),calc(-50% + ${dy+H*.6}px)) rotate(${Math.random()*900}deg)`,opacity:0}],{duration:1600+Math.random()*900,easing:"cubic-bezier(.2,.7,.4,1)"});
   a.onfinish=()=>p.remove();}
}

function courseLevel(){
  const tracks=myTracks().map(t=>t[0]);
  const lessons=[];allUnits().filter(u=>tracks.includes(u.track)).forEach(u=>{const lv=unitLevel(u);if(lv==null)return;u.lessons.forEach((l,i)=>{const d=S.done[u.id+":"+i];lessons.push({lv,done:!!d&&(d.acc==null||d.acc>=60)});});});
  const levels=[...new Set(lessons.map(x=>x.lv))].sort((a,b)=>a-b);
  let cur=-1;for(const lv of levels){const at=lessons.filter(x=>x.lv===lv);if(at.length&&at.filter(x=>x.done).length/at.length>=.6)cur=lv;else break;}
  const next=levels.find(lv=>lv>cur);
  const nextAt=next==null?[]:lessons.filter(x=>x.lv===next);
  const pct=nextAt.length?Math.round(nextAt.filter(x=>x.done).length/nextAt.length/.6*100):100;
  return {cur,next,pct:Math.min(100,pct),levels,done:lessons.filter(x=>x.done).length,total:lessons.length};
}

/* ---- vertical swipe on the flash card (mobile touch, mouse drag, trackpad/wheel) ---- */
let CSW=null,CWHEEL=0;
/* the current card is lifted off the deck as a floating copy, so the page itself never re-animates */
function cardSnap(){
  const f=document.querySelector(".cardsview .deck .flip");if(!f||RM.matches||!f.animate)return null;
  const r=f.getBoundingClientRect(),c=f.cloneNode(true);
  c.classList.add("cardghost");c.removeAttribute("data-act");
  Object.assign(c.style,{position:"fixed",left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px",margin:"0",zIndex:"30",pointerEvents:"none",transition:"none",minHeight:"0"});
  return {c,from:f.style.transform||"none"};
}
function cardSwap(dir,snap){
  const f=document.querySelector(".cardsview .deck .flip");
  if(!snap||!f){return;}
  document.body.append(snap.c);const g=snap.c,up=dir==="up";
  setTimeout(()=>g.remove(),1000);
  const E="cubic-bezier(.22,.8,.3,1)";
  if(up){
    g.animate([{transform:snap.from,opacity:1,zIndex:30,offset:0},{transform:"translateY(-62%) rotate(-6deg) scale(1.03)",opacity:1,zIndex:30,offset:.42},{transform:"translateY(-40%) rotate(-3deg) scale(.95)",opacity:1,zIndex:1,offset:.5},{transform:"translateY(22px) scale(.88)",opacity:0,zIndex:1}],{duration:720,easing:E}).onfinish=()=>g.remove();
    f.animate([{transform:"translateY(18px) scale(.93)",filter:"brightness(.96)"},{transform:"translateY(10px) scale(.96)",offset:.4},{transform:"none",filter:"none"}],{duration:620,easing:"cubic-bezier(.3,1.3,.5,1)"});
  }else{
    g.style.zIndex="1";
    g.animate([{transform:snap.from,opacity:1},{transform:"translateY(18px) scale(.93)",opacity:0}],{duration:560,easing:E}).onfinish=()=>g.remove();
    f.animate([{transform:"translateY(-70%) rotate(-5deg) scale(1.02)",opacity:0},{transform:"translateY(-20%) rotate(-2deg)",opacity:1,offset:.45},{transform:"none",opacity:1}],{duration:620,easing:"cubic-bezier(.3,1.25,.5,1)"});
  }
}
function cardSlide(){}
function cardGo(dir){const C=APP.cards;if(!C)return;
  if(dir==="up"){ACT.cardNext();}else{if(!C.i){const f=document.querySelector(".cardsview .deck .flip");const from=f&&f.style.transform||"none";if(f){f.style.transform="";f.animate&&f.animate([{transform:from},{transform:"translateY(14px)"},{transform:"none"}],{duration:380,easing:EZ.out3});}return;}ACT.cardPrev();}
}
document.addEventListener("pointerdown",e=>{
  const d=e.target.closest&&e.target.closest(".cardsview .deck");if(!d||e.target.closest(".cardspk"))return;
  const fl=d.querySelector(".flip");if(!fl)return;CSW={y:e.clientY,x:e.clientX,d:fl,moved:false,id:e.pointerId};
});
document.addEventListener("pointermove",e=>{
  if(!CSW||e.pointerId!==CSW.id)return;const dy=e.clientY-CSW.y,dx=e.clientX-CSW.x;
  if(!CSW.moved&&Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx))CSW.moved=true;
  if(CSW.moved){CSW.d.style.transition="none";CSW.d.style.transform=`translateY(${dy*.6}px) rotate(${dy*.025}deg)`;}
});
const cswEnd=e=>{
  if(!CSW||e.pointerId!==CSW.id)return;const dy=e.clientY-CSW.y,d=CSW.d,moved=CSW.moved;CSW=null;
  if(!moved)return;window._swiped=Date.now();
  if(Math.abs(dy)>60){if(dy>0&&!APP.cards.i){cardGo("down");return;}cardGo(dy<0?"up":"down");}
  else{const from=d.style.transform;d.style.transform="";d.style.transition="";d.animate&&d.animate([{transform:from},{transform:"none"}],{duration:380,easing:"cubic-bezier(.3,1.4,.5,1)"});}
};
document.addEventListener("pointerup",cswEnd);document.addEventListener("pointercancel",cswEnd);
document.addEventListener("wheel",e=>{
  if(!APP.cards||!e.target.closest||!e.target.closest(".cardsview .deck"))return;
  e.preventDefault();const now=Date.now();if(now-CWHEEL<550||Math.abs(e.deltaY)<25)return;CWHEEL=now;cardGo(e.deltaY>0?"up":"down");
},{passive:false});

/* split a word into sound chunks: sh·i·p, c·a·k(e), b·oa·t */
function spChunks(w,names){
  if(names)return w.split("").map((c,k)=>({s:k,n:1,say:LETTER[c]||c}));
  const out=[];let k=0;const magic=/[aeiou][^aeiou]e$/.test(w)&&w.length>=4;
  while(k<w.length){
    if(magic&&k===w.length-1){out.push({s:k,n:1,say:"",silent:true});k++;continue;}
    let hit=null;for(const d of Object.keys(DIG).sort((a,b)=>b.length-a.length)){if(w.startsWith(d,k)){hit=d;break;}}
    if(hit){out.push({s:k,n:hit.length,say:DIG[hit]});k+=hit.length;continue;}
    const c=w[k];const longV=magic&&k===w.length-3&&"aeiou".includes(c);
    out.push({s:k,n:1,say:longV?LETTER[c]:(LSOUND[c]||c),long:longV});k++;

function SP(){const s=S.spell||(S.spell={lv:{},w:{},stars:0,badges:[]});s.recent=s.recent||[];s.said=s.said||0;SPELL.forEach(L=>{s.lv[L.lv]=s.lv[L.lv]||{learned:[],games:0,quiz:false};});return s;}
function spLevel(n){return SPELL.find(x=>x.lv===n);}
function spLvOf(word){const L=SPELL.find(L=>L.words.some(w=>w[0]===word));return L?L.lv:1;}
function spWordRec(word){const L=SPELL.find(L=>L.words.some(w=>w[0]===word));return L&&L.words.find(w=>w[0]===word);}
function spUnlocked(n){return n===1||!!(SP().lv[n-1]&&SP().lv[n-1].quiz);}
function spAcc(){const r=SP().recent;if(r.length<6)return .75;return r.reduce((a,b)=>a+b,0)/r.length;}
function spNext(n){
  const L=spLevel(n),st=SP().lv[n],N=L.words.length,batches=Math.ceil(N/5),k=st.learned.length;
  if(st.games<Math.floor(k/5)||(k===N&&st.games<batches))return {t:"game",batch:st.games};

function spShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  let t=L.types?L.types.slice():n===1?["pic","word","miss"]:n===2?["pic","word","miss","build"]:n===3?["build","miss","pic","word","hear"]:["build","hear","miss","fix","build","hear"];
  if(acc<.6)t=t.concat(n>=3?["pic","word"]:["pic"]);          // finding it hard: more picture/recognition rounds
  if(acc>.85&&n>=3)t=t.filter(x=>x!=="pic"&&x!=="word").concat(["hear"]);  // doing great: more spelling from memory
  if(mic&&n>=2&&!t.includes("say"))t.push("say");

function spMisspell(w){
  const out=new Set(),V="aeiou";let guard=0;
  while(out.size<2&&guard++<40){const a=w.split(""),k=Math.floor(Math.random()*a.length),m=Math.floor(Math.random()*4);
    if(m===0&&k<a.length-1)[a[k],a[k+1]]=[a[k+1],a[k]];else if(m===1&&a.length>2)a.splice(k,1);else if(m===2)a.splice(k,0,a[k]);

async function spAnimate(mode){

  document.querySelectorAll(".sp-modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mode));
  await spWait(fresh?450:150);
  for(const ch of spChunks(w,mode==="name")){
    if(!APP.spell||APP.spell.k!==tok)return;
    const grp=els().slice(ch.s,ch.s+ch.n);grp.forEach(e=>{e.classList.add("on","hl");if(ch.silent)e.classList.add("silent");});SND.play("pop");
    if(ch.say)await spSay(ch.say);else await spWait(500);
    await spWait(160);grp.forEach(e=>e.classList.remove("hl"));

  if(mode==="sound"){await spSay(w,.7);await spWait(200);}
  if(!APP.spell||APP.spell.k!==tok)return;
  els().forEach(e=>e.classList.remove("hl"));box.classList.add("whole");
  await spSay(w);

function spSayRound(){const sp=APP.spell;if(!sp||sp.scr!=="game")return;const r=sp.rounds[sp.i];if(!r)return;
  if(["word","hear","build","say"].includes(r.t))setTimeout(()=>{if(APP.spell===sp&&sp.rounds[sp.i]===r)TTS.say(r.w[0]);},380);
  if(r.t==="sent")setTimeout(()=>{if(APP.spell===sp&&sp.rounds[sp.i]===r)TTS.say(r.w[3]);},380);}
function spRecent(ok){const s=SP();s.recent.push(ok?1:0);if(s.recent.length>20)s.recent.shift();}
function spRight(el){
  const sp=APP.spell,r=sp.rounds[sp.i],s=SP(),w=r.w[0];
  const rec=s.w[w]||(s.w[w]={ok:0,bad:0});rec.ok++;rec.last=today();
  if(!r.tries){sp.stars++;s.stars++;spRecent(true);}
  r.done=true;SND.play("ok");TTS.say(r.t==="sent"?r.w[3]:w);render();kidBurst(el||document.querySelector(".sp-right"));
  Store.save();setTimeout(()=>{if(APP.spell===sp&&sp.rounds[sp.i]===r)spAdvance();},r.t==="sent"?2200:1300);
}
function spWrong(el){
  const sp=APP.spell,r=sp.rounds[sp.i],s=SP(),w=r.w[0];
  if(!r.tries)spRecent(false);r.tries++;const rec=s.w[w]||(s.w[w]={ok:0,bad:0});rec.bad++;SND.play("no");
  if(!r.requeued){r.requeued=true;sp.rounds.push(spMakeRound(spLvOf(w),r.w,r.t));}
  if(el&&el.animate)el.animate([{transform:"none"},{transform:"translateX(-9px) rotate(-4deg)"},{transform:"translateX(9px) rotate(4deg)"},{transform:"translateX(-5px)"},{transform:"none"}],{duration:420});
  Store.save();
}
function spAdvance(){
  const sp=APP.spell;sp.i++;
  if(sp.i<sp.rounds.length){render();spSayRound();return;}
  const s=SP(),st=s.lv[sp.lv];
  if(sp.kind==="game")st.games++;
  let badge=null;
  if(sp.kind==="quiz"){st.quiz=true;st.doneAt=today();const L=spLevel(sp.lv);if(!s.badges.includes(sp.lv)){s.badges.push(sp.lv);badge=L;}addXP(15);}
  else addXP(sp.kind==="game"?5:3);
  if(sp.kind==="daily")s.dailyAt=today();
  Store.save();APP.spell={scr:"result",lv:sp.lv,kind:sp.kind,stars:sp.stars,total:new Set(sp.rounds.map(r=>r.w[0])).size,badge,k:Date.now()};render();
  SND.play("done");confetti(badge?120:60);
}
/* daily review: words learned before, the ones with mistakes or not seen for a while first */
function spReviewWords(max=8){
  const s=SP(),all=[];SPELL.forEach(L=>s.lv[L.lv].learned.forEach(w=>{const rec=spWordRec(w);if(rec)all.push(rec);}));
  const score=w=>{const r=s.w[w[0]]||{ok:0,bad:0};return (r.bad*3)-(r.ok)+(r.last&&r.last!==today()?2:0)+Math.random()*2;};
  return all.sort((a,b)=>score(b)-score(a)).slice(0,max);
}
/* pronunciation: the child says the word, the browser's speech recognition checks it */
function spListen(word,done){
  let fin=false,best=0,heard="";
  HEAR.start(word,{onInterim:b=>{const sc=wordMatch(word,b.text).score;if(sc>=best){best=sc;heard=b.text;}if(best>=.6&&!fin){fin=true;HEAR.stop();done(true,heard,null);}},
    onDone:(err,b)=>{if(fin)return;fin=true;if(b&&b.text){heard=heard||b.text;best=Math.max(best,wordMatch(word,b.text).score);}done(best>=.6,heard,best?null:err);}});
}
function spSaidOk(w){const s=SP(),rec=s.w[w]||(s.w[w]={ok:0,bad:0});rec.said=(rec.said||0)+1;s.said++;}

const SPELL_ACT={
 spellOpen(){SP();APP.spell={scr:"home",k:Date.now()};render();window.scrollTo(0,0);setTimeout(()=>{const c=document.getElementById("sp-cur");if(c&&SP().lv[1].learned.length)c.scrollIntoView({block:"center",behavior:"smooth"});},450);},

 spellLevel(el){const n=+el.dataset.n;if(!spLevel(n))return;if(!spUnlocked(n)){toast("আগের লেভেল শেষ করো 🔒");return;}const nx=spNext(n);if(nx.t==="done"){spStartGame(n,"revise",spShuffle(spLevel(n).words).slice(0,10));return;}spGo(n);},
 spellRevise(el){const n=+el.dataset.n,s=SP(),ws=s.lv[n].learned.map(spWordRec).filter(Boolean);const pick=ws.filter(w=>(s.w[w[0]]||{}).bad).concat(spShuffle(ws)).filter((w,i,a)=>a.indexOf(w)===i).slice(0,8);spStartGame(n,"revise",pick);},
 spellDaily(){const ws=spReviewWords(8);if(!ws.length)return;spStartGame(spLvOf(ws[0][0]),"daily",ws);},
 spellReplay(el){spAnimate(el&&el.dataset&&el.dataset.m);},
 spellLearned(){const sp=APP.spell,L=spLevel(sp.lv),st=SP().lv[sp.lv],w=L.words[sp.i][0];TTS.stop();HEAR.stop();if(!st.learned.includes(w))st.learned.push(w);Store.save();spGo(sp.lv);},
 spellIntroGo(){const f=APP.spell.next;f&&f();},
 spellPick(el){const r=APP.spell.rounds[APP.spell.i];if(r.done)return;const v=el.dataset.v;if(v===r.w[0])spRight(el);else{r.wrong.push(v);spWrong(el);render();if(r.t==="fix")TTS.say(r.w[0]);}},
 spellMiss(el){const sp=APP.spell,r=sp.rounds[sp.i];if(r.done)return;const v=el.dataset.v,w=r.w[0];
   if(v===w[r.gap]){r.filled=(r.filled||[]).concat(r.gap);TTS.say(LETTER[v]||v);const left=(r.gaps||[r.gap]).filter(g=>!r.filled.includes(g));
     if(!left.length){spRight(document.querySelector(".sp-letters .gap"));return;}

function nodeDone(n){return n.type==="lesson"?!!S.done[n.key]:!!S.storyDone[n.u.id]?.read;}
function nodeStates(track){const ns=nodesOf(track);let prevDone=true;let curFound=false;return ns.map(n=>{const done=nodeDone(n);const unlocked=prevDone||n.u.custom;let st=done?"done":unlocked?(curFound?"open":"cur"):"lock";if(st==="cur")curFound=true;prevDone=done;return Object.assign(n,{st});});}

function norm(s,expand){let t=String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s-]/g," ").replace(/-/g," ").replace(/\s+/g," ").trim();if(expand)t=t.split(" ").map(w=>CONTR[w]||w).join(" ");return t;}
function words(s){return String(s).replace(/[“”"]/g,"").split(/\s+/).map(w=>w.replace(/^[^\w']+|[^\w']+$/g,"")).filter(Boolean);}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
const STOP=new Set(["the","a","an","to","and","or","of","in","on","is","are","it","i","you","me","my","your","we","for","at","be","do","with","this","that","so","but","please","now","can","will"]);

/* ================= exercise builder ================= */
function makeExercises(items,pool,isNew){
  if(items[0]&&items[0].track==="kids")return makeKid(items,pool,isNew);
  const ex=[];
  items.forEach((it,i)=>{if(isNew&&!S.srs[it.id])ex.push({t:"intro",it});ex.push({t:i%2?"build":"meaning",it});});
  if(items.length>=3)ex.push({t:"match",items:pick(items,Math.min(5,items.length))});
  const second=HEAR.avail()?["listen","speak","fill","type","build","speak"]:["listen","fill","type","build","speak","listen"];
  shuffle(items).forEach((it,i)=>{let t=second[i%second.length];if(t==="listen"&&!TTS.ok)t="build";if(t==="fill"&&!fillWord(it))t="type";ex.push({t,it});});
  return ex.map(e=>prepare(e,pool));
}
function makeKid(items,pool,isNew){
  const kp=pool.filter(p=>p.track==="kids"&&p.em),ex=[];
  items.forEach(it=>{if(isNew&&!S.srs[it.id])ex.push({t:"kintro",it});ex.push({t:"kpick",it});});
  shuffle(items).slice(0,3).forEach(it=>ex.push({t:"kfind",it}));
  if(HEAR.avail())shuffle(items).slice(0,3).forEach(it=>ex.push({t:"ksay",it}));
  else shuffle(items).slice(0,2).forEach(it=>ex.push({t:"ksay",it}));
  return ex.map(e=>{
    const unit=e.it.id.split(":")[0];const others=kp.filter(o=>o.id!==e.it.id&&o.em!==e.it.em);
    const ordered=[...shuffle(others.filter(o=>o.id.startsWith(unit+":"))),...shuffle(others.filter(o=>!o.id.startsWith(unit+":")))];
    const need=e.t==="kfind"?5:2,uniq=[];for(const o of ordered){if(!uniq.some(u=>u.em===o.em))uniq.push(o);if(uniq.length>=need)break;}
    e.opts=shuffle([e.it,...uniq]);e.wrong=[];return e;});
}
function fillWord(it){const ws=words(it.en);const cand=ws.filter(w=>w.length>=3&&!STOP.has(w.toLowerCase()));return cand.sort((a,b)=>b.length-a.length)[0]||null;}
function prepare(e,pool){
  const others=pool.filter(p=>e.it?p.id!==e.it.id:true);
  if(e.t==="meaning"){const ds=pick(others.filter(o=>o.bn!==e.it.bn),2).map(o=>o.bn);e.opts=shuffle([e.it.bn,...ds]);}
  if(e.t==="build"||e.t==="listen"){const target=words(e.it.en);const tl=new Set(target.map(w=>w.toLowerCase()));const extra=pick([...new Set(others.flatMap(o=>words(o.en)))].filter(w=>!tl.has(w.toLowerCase())),Math.min(3,Math.max(2,Math.round(target.length/3))));e.tiles=shuffle([...target,...extra]);e.sel=[];}
  if(e.t==="fill"){const w=fillWord(e.it);e.word=w;const re=new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b");e.blanked=e.it.en.replace(re,"_____");const ds=pick([...new Set(others.flatMap(o=>words(o.en)))].filter(x=>x.length>=3&&x.toLowerCase()!==w.toLowerCase()&&!STOP.has(x.toLowerCase())),2);e.opts=shuffle([w,...ds]);}
  if(e.t==="match"){e.left=shuffle(e.items.map(x=>({id:x.id,txt:x.en})));e.right=shuffle(e.items.map(x=>({id:x.id,txt:x.bn})));e.gone=[];e.errs=0;}
  return e;
}

  const e=cur();if(!e||L.fb)return;e.hs=e.hs||{tries:0};
  if(HEAR.on){HEAR.stop();e.hs.state=null;render();return;}
  e.hs.state="listen";e.hs.err=null;TTS.stop();render();
  const need=e.t==="ksay"?.5:.75;let done=false,quiet=null,last={text:"",score:0};
  const finish=(err,b)=>{if(done)return;done=true;clearTimeout(quiet);HEAR.stop();if(!L||cur()!==e)return;e.hs.state=null;
    b=b&&b.text?b:last;

    const w=wordMatch(e.it.en,b.text);e.hs.words=w.words;e.hs.score=w.score;e.hs.heard=b.text;
    if(w.score>=need)speakPass();else{e.hs.tries++;skillHit(e.t,false);SND.play("no");render();}};
  HEAR.start(e.it.en,{onInterim:b=>{if(done||cur()!==e)return;const w=wordMatch(e.it.en,b.text);e.hs.words=w.words;last={text:b.text,score:w.score};

      clearTimeout(quiet);quiet=setTimeout(()=>finish(null,last),1400);render();},  // 1.4 s of silence after speech ends the turn

}
function kidChoose(id){
  const e=cur();if(L.fb||e.wrong.includes(id))return;

  const e=cur();let ok=false,show="";
  if(e.t==="meaning"||e.t==="fill"){if(L.answer==null)return;ok=e.t==="meaning"?L.answer===e.it.bn:L.answer.toLowerCase()===e.word.toLowerCase();show=e.t==="meaning"?e.it.bn:e.it.en;}
  if(e.t==="build"||e.t==="listen"){if(!e.sel.length)return;const got=norm(e.sel.map(i=>e.tiles[i]).join(" "),true);ok=got===norm(e.it.en,true);show=e.it.en;}
  if(e.t==="type"){const v=($("#typein")?.value||"").trim();if(!v)return;L.typed=v;const a=norm(v,true),b=norm(e.it.en,true);const d=lev(a,b);ok=d===0||d<=Math.max(1,Math.floor(b.length*.08));show=e.it.en;if(ok&&d>0)L.typo=true;}
  L.t++;day().t++;S.stats.t++;skillHit(e.t,ok);

  if(ok){L.c++;day().c++;S.stats.c++;}else{L.mistakes[e.it.id]=1;if((e.retry||0)<2)L.ex.push(Object.assign(prepare({t:e.t==="listen"&&!TTS.ok?"build":e.t,it:e.it},allItems()),{retry:(e.retry||0)+1}));}

const RM=matchMedia("(prefers-reduced-motion: reduce)");
const EZ={out3:"cubic-bezier(.215,.61,.355,1)",out4:"cubic-bezier(.165,.84,.44,1)",back:"cubic-bezier(.34,1.56,.64,1)",back2:"cubic-bezier(.3,1.9,.5,1)",inOut:"cubic-bezier(.65,0,.35,1)"};

  const k={};if(IND){k.translate=`${x||0}px ${y||0}px`;if(s!=null)k.scale=String(s);if(r!=null)k.rotate=r+"deg";}
  else k.transform=`translate(${x||0}px,${y||0}px)${s!=null?` scale(${s})`:""}${r!=null?` rotate(${r}deg)`:""}`;return k;}

function popIn(els,{from=.6,stagger=50,delay=0,max=12}={}){
  [...els].forEach((el,i)=>anim(el,Object.assign({opacity:0},tf(0,0,from)),Object.assign({opacity:1},tf(0,0,1)),{duration:600,delay:delay+Math.min(i,max)*stagger,easing:EZ.back2}));}
function tilt(els,{stagger=60,delay=0}={}){
  [...els].forEach((el,i)=>anim(el,Object.assign({opacity:0},tf(0,40,.94,i%2?3:-3)),Object.assign({opacity:1},tf(0,0,1,0)),{duration:800,delay:delay+i*stagger,easing:EZ.back}));}

  if(RM.matches)return;
  root.querySelectorAll("[data-count]").forEach((el,i)=>{
    const to=+el.dataset.count;if(!isFinite(to)||to===0)return;const t0=performance.now()+i*60,dur=1300;
    const step=now=>{const p=Math.min(1,Math.max(0,(now-t0)/dur));const e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(step);};

/* ================= DOM morph: patch in place so taps keep state, scroll and transitions ================= */
function sameNode(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName)return false;
  if(a.nodeType!==1)return true;
  if(a.id!==b.id)return false;
  if(a.getAttribute("data-key")!==b.getAttribute("data-key"))return false;
  const fc=/^(INPUT|TEXTAREA|SELECT)$/.test(a.nodeName);
  if(fc&&a.outerHTML!==b.outerHTML)return false; // re-render form controls only when their markup changed
  return true;
}
function patchAttrs(a,b){
  for(const {name} of [...a.attributes])if(!b.hasAttribute(name)&&name!=="data-split")a.removeAttribute(name);
  for(const {name,value} of [...b.attributes])if(a.getAttribute(name)!==value)a.setAttribute(name,value);
  if(a.nodeName==="BUTTON")a.disabled=b.hasAttribute("disabled");
}
function patchChildren(a,b,quiet,fresh){
  const an=[...a.childNodes],bn=[...b.childNodes];
  bn.forEach((y,i)=>{
    const x=an[i];
    if(!x){a.appendChild(y);if(!quiet&&y.nodeType===1)fresh.push(y);return;}
    if(sameNode(x,y)){
      if(x.nodeType===1){
        if(x.dataset.split&&x.textContent.replace(/\s+/g," ").trim()===y.textContent.replace(/\s+/g," ").trim())return; // keep split headline
        patchAttrs(x,y);if(/^(INPUT|TEXTAREA|SELECT)$/.test(x.nodeName))return;patchChildren(x,y,quiet,fresh);
      }else if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;
    }else{a.replaceChild(y,x);if(!quiet&&y.nodeType===1)fresh.push(y);}
  });
  for(let i=an.length-1;i>=bn.length;i--)an[i].remove();
}
function morph(root,html,quiet){
  const t=document.createElement("template");t.innerHTML=html;const fresh=[];
  patchChildren(root,t.content,quiet,fresh);
  fresh.filter(el=>!el.classList.contains("modal")&&!el.closest(".modal")).slice(0,10)
   .forEach((el,i)=>anim(el,Object.assign({opacity:0},tf(0,8,.97)),Object.assign({opacity:1},tf(0,0,1)),{duration:420,delay:i*30,easing:EZ.back}));
}

}

async function chatTurn(text,meta){
  const C=APP.chat;if(text)C.turns.push({r:"me",t:text});C.busy=true;C.err=null;render();
  const tr=C.turns.filter(t=>t.r!=="meta").map(t=>(t.r==="ai"?"PARTNER: ":"LEARNER: ")+t.t).join("\n");
  const req=meta==="hint"?`${myName()} is stuck: give a one-line hint in Bangla with a short English sentence starter. Do not continue the role-play.`:meta==="bangla"?"Explain your last message in simple Bangla, then repeat it in easy English.":"";
  try{const r=await aiJSON(`${CTX()}\nRole-play. You are ${C.s.role}. Respond naturally to what ${myName()} actually said, one short message (1-2 sentences), ask one thing at a time. Do not correct small errors; only if an error blocks meaning, add a quick fix.\n${tr}\n${req?"SPECIAL: "+req:""}\nReply with only JSON {"reply":"...","fix":null or {"original":"","better":"","why_bn":""}}`,"quick");
    if(req)C.turns.push({r:"meta",t:r.reply});else{C.turns.push({r:"ai",t:r.reply,fix:r.fix&&r.fix.original?r.fix:null});if(S.autoplay)TTS.say(r.reply);}
  }catch(e){if(text){C.turns.pop();setTimeout(()=>{const t=$("#chatin");if(t)t.value=text;},0);}C.err=aiErr(e);}
  C.busy=false;render();
}
async function chatEnd(){const C=APP.chat;C.busy=true;render();
  try{C.fb=await aiJSON(`${CTX()}\nGive feedback on ${myName()}'s English in this conversation.\n${C.turns.filter(t=>t.r!=="meta").map(t=>(t.r==="ai"?"PARTNER: ":"LEARNER: ")+t.t).join("\n")}\nReply with only JSON {"summary_bn":"2-3 encouraging sentences in Bangla","corrections":[{"original":"his words","natural":"natural version","why_bn":""}] (max 4),"try_again":"one improved sentence"}. No pronunciation comments.`,"default");addXP(10);Store.save();}
  catch(e){C.err=aiErr(e);}C.busy=false;render();}
