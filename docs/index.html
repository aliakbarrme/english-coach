<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="English Coach: daily English for the whole family. Kids learn with pictures and sound, adults practise work, family and everyday English.">
<meta name="theme-color" content="#eef2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1312" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</head>
<body>
<title>English Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400..600&family=Anek+Bangla:wght@400..700&family=Baloo+Da+2:wght@500..800&display=swap">
<style>/* Design: Tend-style soft SaaS. Geist + Hind Siliguri, teal-on-mist, soft depth, pill controls.
   Motion vocabulary: --ease (expo-ish out), --spring (soft overshoot). */
:root{
  --font:"Geist","Hind Siliguri",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bn:"Hind Siliguri","Noto Sans Bengali","Geist",system-ui,sans-serif;
  --display:var(--font); --body:var(--font);
  --bg:#eef2ef; --glow-a:#d7efe4; --glow-b:#e6eef6;
  --surface:#fbfcfb; --raised:#ffffff; --sunk:#10231f0b; --well:#10231f0e;
  --ink:#10231f; --muted:#586a65; --faint:#8a9994; --line:#10231f16; --line-2:#10231f29;
  --primary:#0d5c55; --on-primary:#f1fbf7;
  --side:#0f2d29; --on-side:#dcebe7; --side-dim:#dcebe79e; --side-pill:#c4ecd9; --on-side-pill:#0b2925;
  --shadow:0 1px 2px #10231f0a,0 14px 34px -22px #10231f38;
  --shadow-pop:0 24px 60px -18px #10231f4d,0 2px 6px #10231f14;
  --fam:#d6516b; --cli:#3a7fcc; --eve:#138a7e; --warm:#e08a2e; --story:#7c62d4;
  --good:#1d8656; --bad:#cf4429; --locked:#c6d0cc; --on:#ffffff;
  --fam-d:color-mix(in srgb,var(--fam) 78%,#000); --cli-d:color-mix(in srgb,var(--cli) 78%,#000);
  --eve-d:color-mix(in srgb,var(--eve) 78%,#000); --warm-d:color-mix(in srgb,var(--warm) 72%,#000);
  --story-d:color-mix(in srgb,var(--story) 78%,#000);
  --fam-s:color-mix(in srgb,var(--fam) 13%,var(--surface)); --cli-s:color-mix(in srgb,var(--cli) 13%,var(--surface));
  --eve-s:color-mix(in srgb,var(--eve) 13%,var(--surface)); --warm-s:color-mix(in srgb,var(--warm) 15%,var(--surface));
  --story-s:color-mix(in srgb,var(--story) 13%,var(--surface)); --good-s:color-mix(in srgb,var(--good) 13%,var(--surface));
  --bad-s:color-mix(in srgb,var(--bad) 12%,var(--surface));
  --r-card:22px; --r-tile:16px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1312; --glow-a:#138a7e29; --glow-b:#4c94dc14; --surface:#121d1c; --raised:#1b2a28; --sunk:#ffffff0b; --well:#ffffff0e;
  --ink:#e5efec; --muted:#9db0aa; --faint:#6f817c; --line:#ffffff13; --line-2:#ffffff26;
  --primary:#5cd0b4; --on-primary:#06201c; --side:#0e1918; --on-side:#d6e6e2; --side-dim:#d6e6e28f; --side-pill:#5cd0b4; --on-side-pill:#06201c;
  --shadow:0 1px 0 #ffffff0a inset,0 18px 40px -26px #000c; --shadow-pop:0 24px 60px -18px #000000bf,0 0 0 1px #ffffff14;
  --fam:#ef7c93; --cli:#74b3f0; --eve:#3cc0ad; --warm:#f2aa5f; --story:#a996ee; --good:#5fd09a; --bad:#f07a5f; --locked:#2a3a37; --on:#06201c;
  --fam-d:color-mix(in srgb,var(--fam) 60%,#fff); --cli-d:color-mix(in srgb,var(--cli) 60%,#fff); --eve-d:color-mix(in srgb,var(--eve) 60%,#fff);
  --warm-d:color-mix(in srgb,var(--warm) 60%,#fff); --story-d:color-mix(in srgb,var(--story) 60%,#fff);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1312; --glow-a:#138a7e29; --glow-b:#4c94dc14; --surface:#121d1c; --raised:#1b2a28; --sunk:#ffffff0b; --well:#ffffff0e;
  --ink:#e5efec; --muted:#9db0aa; --faint:#6f817c; --line:#ffffff13; --line-2:#ffffff26;
  --primary:#5cd0b4; --on-primary:#06201c; --side:#0e1918; --on-side:#d6e6e2; --side-dim:#d6e6e28f; --side-pill:#5cd0b4; --on-side-pill:#06201c;
  --shadow:0 1px 0 #ffffff0a inset,0 18px 40px -26px #000c; --shadow-pop:0 24px 60px -18px #000000bf,0 0 0 1px #ffffff14;
  --fam:#ef7c93; --cli:#74b3f0; --eve:#3cc0ad; --warm:#f2aa5f; --story:#a996ee; --good:#5fd09a; --bad:#f07a5f; --locked:#2a3a37; --on:#06201c;
  --fam-d:color-mix(in srgb,var(--fam) 60%,#fff); --cli-d:color-mix(in srgb,var(--cli) 60%,#fff); --eve-d:color-mix(in srgb,var(--eve) 60%,#fff);
  --warm-d:color-mix(in srgb,var(--warm) 60%,#fff); --story-d:color-mix(in srgb,var(--story) 60%,#fff);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;color:var(--ink);font:500 15.5px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-wrap:break-word;
  background:radial-gradient(60vmax 50vmax at 12% -10%,var(--glow-a),transparent 70%),radial-gradient(50vmax 40vmax at 100% 0%,var(--glow-b),transparent 70%),var(--bg);
  background-attachment:fixed;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button,label.btn,summary{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px}
.bn{font-family:var(--bn)}
h1,h2,h3{font-family:var(--font);margin:0;text-wrap:balance;letter-spacing:-.025em}
h1{font-size:clamp(1.75rem,6vw,2.3rem);font-weight:700;line-height:1.08}
h2{font-size:1.28rem;font-weight:700;line-height:1.2} h3{font-size:1.02rem;font-weight:650;line-height:1.3;letter-spacing:-.01em}
p{margin:0}
.num,.timer,.metric b{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.stack{display:flex;flex-direction:column;gap:10px} .stack-lg{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .center{justify-content:center;text-align:center}
.view{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(108px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
details.card summary{list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .35s var(--ease)}
details.card[open] summary::after{transform:rotate(225deg)}
details.card summary::-webkit-details-marker{display:none}
.panel{background:var(--well);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.panel code{font-family:var(--mono);font-size:.85rem;overflow-wrap:anywhere}
.eyebrow{font:600 .74rem/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hello{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.hello .eyebrow{text-transform:none;letter-spacing:0;font-size:.86rem;font-weight:550}
/* split-word headline reveal */
.sw{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.sw>span{display:inline-block;will-change:transform}

/* ---- buttons: pill, soft glow, press-scale ---- */
.btn{--c:var(--primary);--on-c:var(--on-primary);position:relative;border:1px solid transparent;border-radius:999px;min-height:46px;padding:0 20px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c);color:var(--on-c);font:650 .95rem/1.2 var(--font);white-space:nowrap;
  box-shadow:0 10px 22px -12px color-mix(in srgb,var(--c) 85%,transparent);
  transition:transform .35s var(--ease),filter .2s,box-shadow .35s var(--ease),background-color .25s,opacity .25s}
@media (hover:hover){.btn:hover{filter:brightness(1.1);box-shadow:0 14px 26px -12px color-mix(in srgb,var(--c) 90%,transparent)}}
.btn:active{transform:scale(.965);transition-duration:.08s}
.btn svg{width:18px;height:18px;flex:none}
.btn.wide{width:100%}
.btn.ghost{--c:var(--raised);--on-c:var(--ink);border-color:var(--line-2);box-shadow:0 1px 2px #10231f0a}
@media (hover:hover){.btn.ghost:hover{filter:none;background:var(--surface)}}
.btn.good{--c:var(--good);--on-c:#fff} .btn.bad{--c:var(--bad);--on-c:#fff}
.btn.fam{--c:var(--fam);--on-c:#fff} .btn.eve{--c:var(--eve);--on-c:#fff} .btn.warm{--c:var(--warm);--on-c:#fff} .btn.story{--c:var(--story);--on-c:#fff}
:root[data-theme="dark"] .btn:not(.ghost){--on-c:#06201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){--on-c:#06201c}}
.btn.sm{min-height:36px;padding:0 14px;font-size:.85rem}
.btn:disabled{opacity:.42;box-shadow:none;cursor:not-allowed;filter:grayscale(.3)}
.btn:disabled:active{transform:none}
.icon-btn{border:1px solid var(--line-2);background:var(--raised);border-radius:50%;width:42px;height:42px;display:inline-grid;place-items:center;padding:0;flex:none;color:var(--ink);
  box-shadow:0 1px 2px #10231f0a;transition:transform .35s var(--ease),background-color .2s}
.icon-btn:active{transform:scale(.9);transition-duration:.08s}
@media (hover:hover){.icon-btn:hover{background:var(--surface)}}
.icon-btn svg{width:19px;height:19px}
.chip{display:inline-flex;align-items:center;gap:5px;font:650 .76rem/1 var(--font);padding:6px 10px;border-radius:999px;background:var(--well);color:var(--muted);white-space:nowrap;transition:transform .3s var(--ease)}
button.chip:active{transform:scale(.94)}
.tag{font:650 .66rem/1 var(--font);letter-spacing:.06em;text-transform:uppercase}
.tag.m{color:var(--good)} .tag.c{color:var(--story)} .tag.s{color:var(--warm-d)} .tag.n{color:var(--muted)}
.note{padding:12px 14px;border-radius:16px;background:var(--cli-s);font-size:.92rem;border:1px solid color-mix(in srgb,var(--cli) 18%,transparent)}
.warnbox{padding:12px 14px;border-radius:16px;background:var(--bad-s);font-size:.92rem;border:1px solid color-mix(in srgb,var(--bad) 18%,transparent)}
.okbox{padding:12px 14px;border-radius:16px;background:var(--good-s);font-size:.92rem;border:1px solid color-mix(in srgb,var(--good) 18%,transparent)}
.note a,.warnbox a{color:inherit;font-weight:650}
input[type=text],input[type=search],textarea,select{width:100%;border:1px solid var(--line-2);background:var(--raised);border-radius:14px;padding:11px 14px;font-weight:500;
  transition:border-color .2s,box-shadow .3s var(--ease)}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 16%,transparent)}
textarea{min-height:96px;resize:vertical}
label.lbl{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--muted);font-weight:600}
/* switch */
.sw-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.92rem;font-weight:550;cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:46px;height:26px;border-radius:999px;background:var(--line-2);margin:0;cursor:pointer;transition:background-color .3s var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .35s var(--spring)}
.switch:checked{background:var(--primary)} .switch:checked::after{transform:translateX(20px)}

/* ---- top bar ---- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5;margin-inline:-16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:1.05rem}
.brand i{width:34px;height:34px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-style:normal;box-shadow:0 8px 18px -10px var(--primary)}
.brand i svg{width:19px;height:19px}
.stats{display:flex;align-items:center;gap:6px}
.stat{display:flex;align-items:center;gap:5px;font:650 .92rem var(--font);background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 7px;box-shadow:0 1px 2px #10231f0a}
.stat svg{width:20px;height:20px}
.flame{color:var(--warm);display:inline-flex} .flame.off{color:var(--locked)}
.ring{width:24px;height:24px}
.ring circle:last-child{transition:stroke-dasharray .9s var(--ease)}
.warmchip{border:0}
.warmchip.todo{background:var(--warm);color:#fff;box-shadow:0 8px 18px -10px var(--warm)}
.warmchip.ok{background:var(--warm-s);color:var(--warm-d)}

/* ---- track segmented control ---- */
.tracks{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:18px;background:var(--well)}
.seg-pill{position:absolute;top:4px;left:0;height:calc(100% - 8px);border-radius:14px;background:var(--raised);box-shadow:0 2px 8px #10231f1a;transition:transform .5s var(--ease),width .5s var(--ease);pointer-events:none}
.trackbtn{position:relative;z-index:1;border:0;background:transparent;border-radius:14px;padding:8px 6px;font:650 .9rem var(--font);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15;color:var(--muted);transition:color .3s,transform .3s var(--ease)}
.trackbtn:active{transform:scale(.96)}
.trackbtn span{font:500 .72rem var(--bn);opacity:.85}
.trackbtn[aria-pressed="true"]{color:var(--ink)}
.trackbtn[aria-pressed="true"].family b{color:var(--fam)} .trackbtn[aria-pressed="true"].client b{color:var(--cli)} .trackbtn[aria-pressed="true"].everyday b{color:var(--eve)}
.trackbtn b{font-weight:650;transition:color .3s}

/* ---- path ---- */
.unitban{--c:var(--primary);position:relative;overflow:hidden;border-radius:var(--r-card);padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 92%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 80%,#000) 100%);
  box-shadow:0 18px 34px -22px var(--c)}
.unitban::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#ffffff2e,transparent 70%)}
.unitban.family{--c:var(--fam)} .unitban.client{--c:var(--cli)} .unitban.everyday{--c:var(--eve)}
:root[data-theme="dark"] .unitban{color:#06201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .unitban{color:#06201c}}
.unitban .bn{opacity:.9;font-size:.9rem}
.unitban .kick{font:650 .7rem var(--mono);letter-spacing:.06em;opacity:.85}
.path{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:10px 8px}
.nodewrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.node{--c:var(--primary);width:70px;height:70px;border-radius:50%;border:0;display:grid;place-items:center;position:relative;color:#fff;padding:0;
  background:radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--c) 62%,#fff),var(--c) 62%);
  box-shadow:0 14px 26px -12px color-mix(in srgb,var(--c) 80%,transparent),inset 0 -5px 0 #0000001f,inset 0 2px 0 #ffffff40;
  transition:transform .45s var(--spring),box-shadow .3s var(--ease)}
.node:active{transform:scale(.9);transition-duration:.1s}
@media (hover:hover){.node:hover{transform:translateY(-3px) scale(1.03)}}
.node svg{width:28px;height:28px;filter:drop-shadow(0 1px 1px #0002)}
.node.family{--c:var(--fam)} .node.client{--c:var(--cli)} .node.everyday{--c:var(--eve)} .node.storyn{--c:var(--story)}
.node.done{filter:saturate(.8)}
.node.lock{background:var(--well);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line-2)}
.node.cur::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--c) 45%,transparent);animation:halo 2.4s var(--ease) infinite}
@keyframes halo{0%{transform:scale(.92);opacity:1}70%{transform:scale(1.18);opacity:0}100%{opacity:0}}
.node .lbl{position:absolute;top:100%;margin-top:9px;font:600 .72rem var(--font);color:var(--muted);white-space:nowrap}
.node.cur .lbl{color:var(--ink)}
.startpop{background:var(--raised);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;width:min(330px,100%);text-align:left;box-shadow:var(--shadow-pop);transform-origin:50% 0}

/* ---- lesson player ---- */
.player{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);
  background:radial-gradient(60vmax 50vmax at 12% -10%,var(--glow-a),transparent 70%),var(--bg)}
.player .head{display:flex;align-items:center;gap:12px;max-width:660px;width:100%;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.pbar{flex:1;height:12px;border-radius:999px;background:var(--well);overflow:hidden}
.pbar i{display:block;height:100%;min-width:12px;background:linear-gradient(90deg,var(--mint,#4fbf93),var(--good));border-radius:999px;transition:width .7s var(--ease);position:relative}
.pbar i::after{content:"";position:absolute;inset:3px 6px auto;height:3px;border-radius:9px;background:#ffffff59}
.player .body{flex:1;overflow-y:auto;overscroll-behavior:contain;max-width:660px;width:100%;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 190px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.player .foot{position:fixed;left:0;right:0;bottom:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.player .foot .in{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.player .foot.ok{background:var(--good-s);border-color:transparent;animation:sheet .5s var(--ease)}
.player .foot.no{background:var(--bad-s);border-color:transparent;animation:sheet .5s var(--ease),nudge .45s .1s var(--ease)}
@keyframes sheet{from{transform:translateY(60%);opacity:.4}}
@keyframes nudge{20%{translate:-6px 0}45%{translate:5px 0}70%{translate:-3px 0}}
.fbtitle{display:flex;align-items:center;gap:8px;font:700 1.18rem var(--font);letter-spacing:-.02em}
.fbtitle i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal}
.fbtitle i svg{width:17px;height:17px}
.foot.ok .fbtitle{color:var(--good)} .foot.ok .fbtitle i{background:var(--good)}
.foot.no .fbtitle{color:var(--bad)} .foot.no .fbtitle i{background:var(--bad)}
.prompt{font:650 1.32rem/1.32 var(--font);letter-spacing:-.02em}
.speaker{display:flex;gap:10px;align-items:center}
.bigspeak{width:62px;height:62px;border-radius:20px;background:var(--cli);color:#fff;border:0;display:grid;place-items:center;flex:none;
  box-shadow:0 14px 24px -12px var(--cli),inset 0 -4px 0 #0000001f;transition:transform .4s var(--spring)}
.bigspeak:active{transform:scale(.9);transition-duration:.08s}
.bigspeak svg{width:28px;height:28px}
.speaking{animation:speakPulse 1s var(--ease) infinite}
@keyframes speakPulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--cli) 22%,transparent)}}
.answer-line{min-height:62px;border-bottom:1.5px dashed var(--line-2);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:10px}
.tile{border:1px solid var(--line-2);background:var(--raised);border-radius:14px;padding:9px 14px;font:600 1rem var(--font);box-shadow:0 2px 0 var(--line-2),0 6px 14px -10px #10231f40;
  transition:transform .35s var(--spring),opacity .25s,box-shadow .25s}
.tile:active{transform:scale(.92);transition-duration:.08s}
.tile.used{opacity:0;transform:scale(.8);pointer-events:none}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid var(--line-2);background:var(--raised);border-radius:var(--r-tile);padding:14px 16px;text-align:left;font-weight:600;box-shadow:0 1px 2px #10231f0a;
  transition:transform .35s var(--ease),border-color .2s,background-color .25s,box-shadow .3s var(--ease),opacity .3s}
.opt:active{transform:scale(.98);transition-duration:.08s}
@media (hover:hover){.opt:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line-2))}}
.opt[aria-pressed="true"]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--raised));box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 12%,transparent)}
.opt:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{padding:12px;font-size:.95rem;min-height:58px}
.match .opt.gone{opacity:0;transform:scale(.92);pointer-events:none}
.match .opt.err{border-color:var(--bad);background:var(--bad-s);animation:nudge .4s var(--ease)}
.intro{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.intro .en{font:700 1.5rem/1.25 var(--font);letter-spacing:-.025em}
.newtag{font:650 .7rem var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--story);background:var(--story-s);padding:5px 10px;border-radius:999px;align-self:flex-start}
.done-hero{display:grid;place-items:center;width:92px;height:92px;border-radius:50%;margin:0 auto;background:var(--good);color:#fff;box-shadow:0 20px 40px -18px var(--good)}
.done-hero svg{width:44px;height:44px}

/* ---- warm-up ---- */
.timer{font:600 3.6rem/1 var(--mono);letter-spacing:-.04em;text-align:center}
.warmstep{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r-tile);background:var(--surface);box-shadow:var(--shadow)}
.warmstep .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:650 1rem var(--mono);background:var(--warm-s);color:var(--warm-d);transition:background-color .4s,color .4s}
.warmstep.done .num{background:var(--good);color:#fff}
.twister{font:700 1.42rem/1.3 var(--font);letter-spacing:-.02em;text-align:center}
.reps{display:flex;gap:7px;justify-content:center}
.reps i{width:14px;height:14px;border-radius:50%;background:var(--well);box-shadow:inset 0 0 0 1px var(--line-2);transition:background-color .3s,transform .4s var(--spring)}
.reps i.on{background:var(--warm);box-shadow:none;transform:scale(1.15)}
.passage{font:500 1.08rem/1.75 var(--font);white-space:pre-wrap}
.ringtimer{position:relative;width:180px;height:180px;margin:0 auto;display:grid;place-items:center}
.ringtimer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringtimer circle{fill:none;stroke-width:8}
.ringtimer .bgc{stroke:var(--well)} .ringtimer .fgc{stroke:var(--warm);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ringtimer .timer{font-size:2.6rem}

/* ---- story, cards, metrics, lists ---- */
.storytext{font:500 1.06rem/1.85 var(--font);white-space:pre-wrap}
.kidcard{min-height:52vh;border-radius:28px;background:var(--fam-s);border:1px solid color-mix(in srgb,var(--fam) 30%,transparent);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center;padding:24px;box-shadow:var(--shadow)}
.kidcard .en{font:700 clamp(1.8rem,7vw,3rem)/1.18 var(--font);letter-spacing:-.03em}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-tile);box-shadow:var(--shadow);padding:13px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.metric b{font:700 1.55rem var(--font);letter-spacing:-.03em}
.grid14{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.grid14 i{aspect-ratio:1;border-radius:6px;background:var(--well)}
.grid14 i.w{background:var(--warm-s);box-shadow:inset 0 0 0 1.5px var(--warm)} .grid14 i.f{background:var(--warm)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-tile);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);min-width:0;transition:background-color .2s}
.item:last-child{border-bottom:0}
.item .grow{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;line-height:1.5;overflow-wrap:anywhere}
.msg.ai{background:var(--raised);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{background:var(--primary);color:var(--on-primary);align-self:flex-end;border-bottom-right-radius:6px}
.msg.meta{align-self:stretch;max-width:100%;background:var(--story-s);font-size:.92rem}
.chat{display:flex;flex-direction:column;gap:10px}
.fix{display:grid;gap:3px;padding:10px 12px;border-radius:14px;background:var(--raised);border:1px solid var(--line)}
.fix .o{color:var(--bad);text-decoration:line-through} .fix .n{color:var(--good);font-weight:650}
.rec{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 50%,transparent);animation:recpulse 1.4s var(--ease) infinite}
@keyframes recpulse{70%{box-shadow:0 0 0 12px transparent}}
.recbar{display:flex;align-items:center;gap:3px;height:28px}
.recbar i{width:4px;border-radius:4px;background:var(--bad);height:20%;transition:height .08s}
.recbig{width:76px;height:76px;border-radius:50%;border:0;background:var(--bad);color:#fff;display:grid;place-items:center;margin:4px auto;box-shadow:0 16px 30px -14px var(--bad),inset 0 -4px 0 #0000001f;transition:transform .4s var(--spring),border-radius .4s var(--ease)}
.recbig svg{width:32px;height:32px}
.recbig:active{transform:scale(.9);transition-duration:.08s}
.recbig.on{border-radius:24px}
audio{width:100%;height:44px}

/* ---- nav: floating dark bar with sliding pill (rail on desktop) ---- */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;max-width:560px;margin:0 auto;
  background:var(--side);border-radius:24px;padding:6px;box-shadow:0 20px 40px -18px #0f2d2999,0 2px 8px #0f2d2926}
nav.tabs .in{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs .pill{position:absolute;left:0;top:0;border-radius:18px;background:var(--side-pill);transition:transform .55s var(--ease),width .55s var(--ease),height .55s var(--ease);pointer-events:none}
nav.tabs button{position:relative;z-index:1;border:0;background:transparent;border-radius:18px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 .68rem var(--font);color:var(--side-dim);transition:color .35s,transform .3s var(--ease)}
nav.tabs button:active{transform:scale(.92)}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button[aria-current="page"]{color:var(--on-side-pill)}
nav.tabs .navbrand{display:none}
@media (min-width:900px){
  nav.tabs{left:0;top:0;bottom:0;right:auto;width:236px;max-width:none;margin:0;border-radius:0;padding:calc(22px + env(safe-area-inset-top,0px)) 14px 20px;box-shadow:none}
  nav.tabs .navbrand{display:flex;color:var(--on-side);padding:0 8px 22px}
  nav.tabs .navbrand i{background:var(--side-pill);color:var(--on-side-pill)}
  nav.tabs .in{grid-template-columns:1fr;gap:4px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;height:46px;font-size:.92rem;border-radius:14px}
  nav.tabs .pill{border-radius:14px}
  .view{padding-left:calc(236px + 32px);padding-right:32px;max-width:none;width:min(100%,236px + 32px + 680px);margin:0}
  .view>*{max-width:680px;width:100%}
  .topbar{margin-inline:0;padding-inline:0}
  .toast{left:calc(50% + 118px)}
}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.92rem;z-index:50;max-width:calc(100% - 32px);text-align:center;
  translate:-50% 0;box-shadow:var(--shadow-pop)}
.modal{position:fixed;inset:0;background:#08181547;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:40;display:grid;place-items:center;padding:16px;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0}}
.modal>.card{max-width:440px;width:100%;box-shadow:var(--shadow-pop);background:var(--raised);animation:pop .45s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.floatup{position:fixed;z-index:60;pointer-events:none;font:700 .95rem var(--font);color:var(--warm-d);background:var(--raised);padding:5px 11px;border-radius:999px;box-shadow:var(--shadow-pop)}
.webhint{display:flex;gap:10px;align-items:center}
@media (prefers-reduced-motion:reduce){*,::before,::after{transition-duration:0s!important;animation-duration:0s!important;animation-iteration-count:1!important}}
.view>.pbar{flex:none;width:100%}
@media (min-width:900px){.topbar .brand{visibility:hidden}}

/* ===================== v6: profiles, kids, quests, responsive dashboard ===================== */
:root{--bn:"Anek Bangla","Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;--kidf:"Baloo Da 2","Anek Bangla",var(--font);--gold:#e9a23b}
.bn,.kbn,.cbn{font-family:var(--bn);font-weight:450}
body.kid h1,body.kid h2,body.kid .kword,body.kid .unitban h2,body.kid .hello h1{font-family:var(--kidf);letter-spacing:-.01em;font-weight:700}
.dim{opacity:.55}
.mob-only{display:contents}
.sidecol{display:none}
.maincol{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:1180px){
  .view.dash{display:grid;grid-template-columns:minmax(0,1fr) 330px;column-gap:28px;align-items:start;width:min(100%,236px + 32px + 1060px)}
  .view.dash>.topbar,.view.dash>.warnbox{grid-column:1/-1}
  .view.dash>*{max-width:none}
  .mob-only{display:none}
  .sidecol{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
}
/* avatar */
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line-2);font-size:19px;line-height:1;flex:none}
.av.sm{width:28px;height:28px;font-size:15px}
.av.xl{width:72px;height:72px;font-size:40px;box-shadow:inset 0 0 0 1px var(--line),0 12px 24px -16px #10231f66}
.avbtn{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:2px 10px 2px 2px;border-radius:999px;font-weight:650;transition:background-color .2s,transform .3s var(--ease)}
.avbtn:active{transform:scale(.95)}
@media (hover:hover){.avbtn:hover{background:var(--well)}}
.avname{max-width:9ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:380px){.avname{display:none}.stat{padding:4px 8px 4px 6px}.stats{gap:4px}.warmchip{padding:6px 8px}}
/* quests */
.quests{gap:12px}
.quest{display:flex;align-items:center;gap:10px}
.quest .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.qic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--well);font-size:18px;flex:none;transition:background-color .4s}
.quest.done .qic{background:var(--good-s)}
.qbar{display:block;height:8px;border-radius:9px;background:var(--well);overflow:hidden}
.qbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--warm),var(--gold));transition:width .8s var(--ease)}
.quest.done .qbar i{background:var(--good)}
.btn.gold{--c:var(--gold);--on-c:#3a2400;animation:wiggle 2.4s var(--ease) infinite}
@keyframes wiggle{0%,80%,100%{rotate:0deg}85%{rotate:-2deg}90%{rotate:2deg}95%{rotate:-1deg}}
/* badges, league, stickers */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 6px;border-radius:16px;background:var(--well);opacity:.5;filter:grayscale(1)}
.badge span{font-size:28px;line-height:1.1}
.badge b{font-size:.78rem;font-weight:650}
.badge i{font-style:normal;font-size:.68rem;color:var(--muted)}
.badge.on{opacity:1;filter:none;background:color-mix(in srgb,var(--gold) 14%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 35%,transparent)}
.league{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px}
.lrow .grow{flex:1;min-width:0}
.lrow.me{background:color-mix(in srgb,var(--primary) 9%,transparent)}
.lpos{width:24px;text-align:center;font-weight:700}
.stickers{display:flex;flex-wrap:wrap;gap:8px}
.stickers span{font-size:30px;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:var(--well)}
.confetto{position:fixed;width:9px;height:14px;border-radius:2px;z-index:80;pointer-events:none}
/* welcome */
.welcome,.onb,.picker{max-width:560px;margin:0 auto;min-height:100dvh;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.wl-hero{position:relative;display:flex;flex-direction:column;gap:10px;padding-top:4vh}
.wl-hero h1{font-size:clamp(2rem,8vw,2.9rem);font-family:var(--bn);font-weight:650;letter-spacing:-.01em;line-height:1.18}
.wl-mark{width:64px;height:64px;border-radius:20px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 18px 36px -16px var(--primary)}
.wl-mark svg{width:32px;height:32px}
.floaters{position:absolute;left:84px;right:0;top:0;height:76px;pointer-events:none}
.floaters span{position:absolute;font-size:28px;animation:float 6s var(--ease) infinite;opacity:.85}
.floaters span:nth-child(1){right:4%;top:6px}.floaters span:nth-child(2){right:24%;top:30px;animation-delay:-1s}
.floaters span:nth-child(3){right:44%;top:4px;animation-delay:-2s}.floaters span:nth-child(4){right:62%;top:34px;animation-delay:-3s;font-size:22px}
.floaters span:nth-child(5){right:14%;top:48px;animation-delay:-4s;font-size:20px}.floaters span:nth-child(6){right:80%;top:8px;animation-delay:-5s;font-size:20px}
@keyframes float{0%,100%{translate:0 0;rotate:-4deg}50%{translate:0 -12px;rotate:4deg}}
.method{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mstep{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--r-tile);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.mstep .mic{font-size:24px}
.btn.xl{min-height:56px;font-size:1.05rem}
/* onboarding */
.onb-head{display:flex;align-items:center;gap:12px}
.onb-body{flex:1;display:flex;flex-direction:column;gap:14px}
.onb-ic{font-size:44px;line-height:1}
.onb-ic.big{font-size:72px}
.onb-body input[type=text]{font-size:1.15rem;padding:14px 16px}
.onb-foot{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avpick{aspect-ratio:1;border-radius:18px;border:1.5px solid var(--line-2);background:var(--raised);font-size:clamp(22px,6vw,30px);display:grid;place-items:center;padding:0;transition:transform .35s var(--spring),border-color .2s,box-shadow .3s}
.avpick:active{transform:scale(.9)}
.avpick[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 16%,transparent);transform:scale(1.06)}
.opt.big{display:flex;align-items:center;gap:12px;padding:14px 16px}
.opt.big .grow{display:flex;flex-direction:column;gap:2px;flex:1}
.oic{font-size:26px;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--well);flex:none}
.plan{gap:12px}
.chip.trk.kids{background:color-mix(in srgb,var(--gold) 18%,transparent);color:#8a5a00}
.chip.trk.family{background:var(--fam-s);color:var(--fam-d)} .chip.trk.client{background:var(--cli-s);color:var(--cli-d)} .chip.trk.everyday{background:var(--eve-s);color:var(--eve-d)}
/* picker */
.picker{justify-content:center;text-align:center;align-items:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;width:100%}
.pcard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 10px;border-radius:24px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .4s var(--spring),box-shadow .3s}
.pcard:active{transform:scale(.95)}
@media (hover:hover){.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-pop)}}
.pcard.add .av{color:var(--muted);font-size:30px}
/* kids path */
.nem{font-size:30px;line-height:1;filter:drop-shadow(0 2px 2px #0002)}
.nem.dim{filter:grayscale(1);opacity:.45}
.unitban.kids{--c:var(--gold)}
.node.kids{--c:var(--gold)}
.trackbtn[aria-pressed="true"].kids b{color:#b77712}
body.kid .node{width:80px;height:80px}
body.kid .node .lbl{font-size:.8rem}
/* kid exercises */
.kidstage{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:6px}
.kemoji{font-size:clamp(96px,30vw,150px);line-height:1;border:0;background:none;padding:0;animation:bob 2.6s var(--ease) infinite}
@keyframes bob{50%{translate:0 -8px}}
.kword{font:700 clamp(1.8rem,8vw,2.6rem)/1.15 var(--kidf);letter-spacing:-.01em}
.kbn{font-size:1.1rem}
.kq{color:var(--muted);font-weight:550}
.kidspeak{width:86px;height:86px;border-radius:28px}
.kidspeak svg{width:40px;height:40px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px;width:100%;margin:0 auto}
.ktile{aspect-ratio:1;border-radius:24px;border:2px solid var(--line-2);background:var(--raised);font-size:clamp(42px,13vw,72px);display:grid;place-items:center;padding:0;box-shadow:0 4px 0 var(--line-2),0 10px 22px -16px #10231f55;transition:transform .35s var(--spring),border-color .2s,background-color .2s,opacity .3s}
.ktile:active{transform:scale(.9)}
.ktile.err{border-color:var(--bad);background:var(--bad-s);opacity:.45;animation:nudge .4s var(--ease)}
.ktile.right{border-color:var(--good);background:var(--good-s);transform:scale(1.08);box-shadow:0 0 0 6px color-mix(in srgb,var(--good) 20%,transparent)}
.sticker-win{width:120px;height:120px;margin:0 auto;border-radius:36px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,var(--surface));box-shadow:0 20px 40px -20px var(--gold);animation:pop .7s var(--spring)}
.sticker-win span{font-size:72px}
.playgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.playcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border-radius:22px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .4s var(--spring)}
.playcard:active{transform:scale(.94)}
.pem{font-size:48px;line-height:1.1}
.kidcard{font:inherit;color:inherit}
.cardem{font-size:clamp(80px,26vw,140px);line-height:1}
.cbn{font-size:1.15rem}
/* speaking */
.said .ok{color:var(--good)} .said .bad{color:var(--bad);text-decoration:underline wavy color-mix(in srgb,var(--bad) 50%,transparent);text-underline-offset:4px}
.micbig{width:84px;height:84px;border-radius:50%;border:0;margin:6px auto 0;display:grid;place-items:center;color:#fff;background:var(--primary);box-shadow:0 16px 30px -14px var(--primary),inset 0 -4px 0 #0000001f;transition:transform .4s var(--spring),background-color .3s}
.micbig svg{width:36px;height:36px}
.micbig:active{transform:scale(.9)}
.micbig.on{background:var(--bad);animation:recpulse 1.4s var(--ease) infinite}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.85rem;align-self:center;padding:6px}
/* story karaoke */
.storytext p{margin:0 0 .9em}
.storytext p:last-child{margin:0}
.sent{cursor:pointer;border-radius:6px;padding:1px 2px;margin:0 -2px;transition:background-color .25s,color .25s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
@media (hover:hover){.sent:hover{background:var(--well)}}
.sent.cur{background:color-mix(in srgb,var(--story) 22%,transparent);color:var(--ink)}
.kidstory{font-size:1.25rem;line-height:1.7}
.listenbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:sticky;top:8px;z-index:4;padding:8px;margin:-8px;border-radius:20px;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.listenbar .tiny{flex-basis:100%}
html.is-speaking .bigspeak,html.is-speaking .kidspeak{animation:speakPulse 1s var(--ease) infinite}
/* me */
.profhead{flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}
.profhead .grow{flex:1;min-width:160px;display:flex;flex-direction:column;gap:6px}
.profbtns{display:flex;gap:8px}
.lvl{font:700 2rem var(--font)}
/* mobile polish */
@media (max-width:420px){
  .view{gap:14px}
  .card{padding:15px;border-radius:20px}
  .metrics{gap:8px}
  .metric b{font-size:1.35rem}
  .match{gap:8px}
  .prompt{font-size:1.18rem}
  .kgrid{gap:9px}
  .method{gap:8px}
}
@media (min-width:700px) and (max-width:899px){.view{max-width:680px}}

nav.tabs .in{grid-template-columns:repeat(var(--n,5),1fr)}
@media (min-width:900px){nav.tabs .in{grid-template-columns:1fr}}

.player .body>*,.onb-body>*,.view>*,.maincol>*{flex-shrink:0}

COURSE.warmup.passages=[
 {title:"The Power of Small Steps",text:`Many people think that learning a language needs a lot of time. They wait for a free month, a quiet holiday, or a perfect moment. But the perfect moment never comes. The truth is simple: small steps, every day, are more powerful than big steps once a month.

Think about brushing your teeth. You do not brush for two hours on Sunday. You brush for two minutes, twice a day, every day. Speaking practice works in the same way. Ten minutes every morning is better than three hours on the weekend.

When you practice every day, your mouth gets used to new sounds. Your brain finds words faster. Slowly, you stop translating in your head. One day, you will answer a question in English before you even think about it. That day will feel like magic, but it is not magic. It is the result of many small steps.`},
 {title:"A Good Client Message",text:`A good message to a client is short, clear and friendly. It starts with a greeting, like "Hi Sarah, I hope you're well." Then it gives the main information first. If the work is finished, say what you finished, using the past tense: "I finished the homepage and fixed the menu."

If there is a problem, do not hide it. Clients trust people who are honest. Say sorry, explain the reason in simple words, and give a new plan: "I'm sorry, but the site won't be ready until Saturday. I found an issue with a plugin, and I want to make sure everything works perfectly."

Always end with a clear next step. For example, "I'll send you a preview link tonight," or "Could you let me know your thoughts by Friday?" A friendly closing, like "Thank you for your patience," makes the message warm. Clear, honest and polite: that is the voice of a professional.`},
 {title:"Morning in Dhaka",text:`Early in the morning, Dhaka is a different city. The streets are quiet, and the air feels fresh. Before the traffic starts, you can hear birds singing in the trees. A man is selling hot tea at the corner, and a few people are already standing around his small stall.

Slowly, the city wakes up. Rickshaws start to move along the roads. Shopkeepers open their shutters with a loud metal sound. Children in clean uniforms walk to school with their parents, carrying heavy bags.

By nine o'clock, the city is completely awake. Cars, buses and motorbikes fill every road, and the sound of horns is everywhere. People are rushing to their offices. It is noisy and busy, but it is also full of energy. Millions of people, each with their own plans and dreams, are starting a new day together.`},
 {title:"Why We Practice Out Loud",text:`Reading silently and reading out loud are very different. When you read silently, only your eyes and your brain work. When you read out loud, your mouth, your tongue, your lips and your ears work too. Speaking is a physical skill, like riding a bicycle or swimming.

English has sounds that do not exist in Bangla, like the "th" in think, the "v" in video, and the "w" in website. Your mouth needs to learn new positions. At first, these positions feel strange. Your tongue feels slow and heavy. That is normal.

When you practice out loud every day, the muscles in your mouth become stronger and faster. The new sounds become easy. Reading with a pen between your teeth makes your mouth work even harder. When you take the pen out, your words will feel lighter and clearer. That is why we practice out loud.`},
 {title:"The Website That Changed a Bakery",text:`Sarah's bakery made the best chocolate cake in the neighborhood. But very few people knew about it. Her old website was slow and difficult to use on a phone. Customers could not find the menu, and nobody ordered online.

One day, Sarah decided to build a new website. She talked to a developer who asked many questions. Who are your customers? What do they need? What do you want to improve? Together, they made a simple plan: a fast homepage, a clear menu, and an easy order form.

Three months later, everything was different. The new site loaded in two seconds. Beautiful photos showed every cake. Families ordered birthday cakes from their phones in a few clicks. Sarah's online orders grew every week, and she hired two new bakers. A good website did not just look nice. It changed her business.`},
 {title:"Talking With Children",text:`Small children learn languages very quickly. They do not study grammar rules. They listen, they copy, and they play. That is why short, simple sentences are perfect for them. "Good morning!" "Wash your hands." "Are you hungry?" "Let's play!"

The secret is repetition. Children love to hear the same words every day, in the same situations. When you say "Let's brush your teeth" every morning, they soon understand it. After some time, they start saying it too.

Parents do not need perfect English to help. A warm voice, a smile, and a few simple sentences are enough. Use English during daily routines: waking up, eating, bathing and going to bed. Make it fun with songs and games. Never worry about mistakes. When parents and children learn together, the whole family grows more confident, one small sentence at a time.`},
 {title:"Confidence Is a Skill",text:`Many people believe that confidence is something you are born with. Some people have it, and some people do not. But this is not true. Confidence is a skill, and like every skill, you can practice it.

Confident speakers still make mistakes. The difference is that they keep talking. When they forget a word, they explain it in another way. When they do not understand, they say, "Sorry, could you repeat that?" They know that communication is more important than perfection.

You can build confidence step by step. Start with small conversations: ordering coffee, asking for directions, saying hello to a neighbor. Then try longer ones, like a short call with a client. Every conversation is practice. Every mistake is a lesson. After a few months, you will look back and be surprised. The fear will be smaller, and your voice will be stronger.`}
];

 story:{title:"A Sunny Morning",bn:"সকালে আব্বু মেয়েদের ঘুম থেকে তোলে, আম্মুর সাথে কথা বলে আর সবাই মিলে ইংরেজিতে দিন শুরু করে।",
 text:`It is seven o'clock in the morning. The sun is shining through the window. Ali opens his eyes and smiles. Today is a special day, because today the whole family will try to speak English at home.

He walks to the kitchen. His wife is already there. "Good morning, dear," he says. "Good morning," she answers. "Did the kids sleep well?" Ali asks. "Yes, they slept very well. The little one is still sleeping." Ali smiles. "Can you make some tea, please? I'll get the girls ready." "Of course," she says.

Ali goes to the girls' room. The room is quiet. His older daughter is under the blanket. Only her hair is showing. Ali sits on the bed and says softly, "Good morning, sweetie! Wake up, sleepyhead!" She does not move. Ali laughs. "Open your eyes. It's time to get up."

Slowly, she opens one eye. Then she opens the other eye. "Abbu!" she says. "Did you sleep well?" Ali asks. She nods. "Give me a big hug," he says. She jumps up and gives him a big hug.

Now the little one is waking up too. She is rubbing her eyes. "Good morning, baby," Ali says. "Come here." She walks to him slowly, holding her teddy bear. "Let's stretch," Ali says. He puts his arms up. "Arms up high!" The girls copy him. They put their arms up high and laugh. "Higher! Higher!" says the older girl.

"Okay, girls," Ali says. "Hold my hand. Let's go to the bathroom." The little one stops. "Do you need to pee?" he asks. She says, "Yes!" "Okay, let's go," he says.

In the kitchen, the tea is ready. Ali's wife looks at the girls and says, "Good morning, my darlings!" The girls run to her. Ali picks up his cup of tea and says, "You know what? Let's speak English with them today. Short sentences, every day." His wife smiles. "That's a great idea. They learn so fast."

Ali drinks his tea and looks at his family. Small sentences, every morning. That is how they will all learn together.`,
 phrases:["Good morning","Did you sleep well?","Give me a big hug","It's time to get up","Hold my hand"]}},

 story:{title:"The Toothbrush Song",bn:"আব্বু গান গেয়ে মেয়েদের দাঁত ব্রাশ করায়, হাত-মুখ ধোয়ায়, আর ছোট মেয়ে নিজে পটি করতে শেখে।",
 text:`Every morning, the girls do not want to brush their teeth. They want to play. So today, Ali has a new idea. He is going to make a song.

"Girls!" he calls. "Let's brush your teeth!" The older girl shakes her head. "No, Abbu. Later." Ali smiles and starts to sing. "Brush, brush, brush your teeth, up and down, up and down!" The girls start to laugh. They run to the bathroom.

Ali puts a little toothpaste on each toothbrush. "Open your mouth wide," he says. The little one opens her mouth very, very wide. "Wow! Like a lion!" Ali says. "Now brush up and down. Up and down." The older girl brushes very fast. "Slowly, sweetie. Brush the back teeth too." Then he says, "Don't swallow the toothpaste. Spit it out." The girls spit into the sink. "Now rinse your mouth," he says. They take some water and make funny sounds.

"Now, wash your face," Ali says. He turns on the tap. The girls put their hands in the water. "Splash, splash!" says the little one. Water goes everywhere. Ali laughs. "Not on the floor, baby!"

"Now wash your hands with soap," Ali says. He gives them the soap. "Rub, rub, rub!" The girls rub their hands together. They make lots of bubbles. "Look, Abbu! Bubbles!" says the older girl. "Beautiful bubbles," Ali says. "Now rinse them. Turn off the tap, please." The older girl turns off the tap. "Good. Now dry your hands with the towel."

Then the little one pulls Ali's shirt. She looks serious. Ali asks, "Do you need the potty?" She nods. "Okay. Tell me when you need to go, every time, okay?" She sits on the potty. After a minute, she says, "Done!" Ali claps his hands. "Good job! You did it!" She is very proud. "Flush the toilet," he says, and she pushes the button. Whoosh! "Now wash your hands." She washes her hands carefully.

Ali looks at his two daughters. Clean faces, clean teeth, clean hands. "All clean!" he says. The girls shout together, "All clean!" From the kitchen, their mother calls, "Who is singing in there?" The girls sing the toothbrush song again, louder this time. It is going to be a good day.`,
 phrases:["Open your mouth wide","Spit it out","Wash your hands with soap","Good job! You did it!","All clean!"]}},

 story:{title:"The Missing Sock",bn:"মেয়েরা জামা বাছাই করে, চুল বাঁধে, আর সবাই মিলে হারানো মোজা খোঁজে।",
 text:`Today the family is going to visit Grandma. Ali looks out of the window. The sky is grey and the wind is strong. "It's cold today," he says to his wife. "The girls need warm clothes."

"Okay, girls," Ali calls. "Let's get dressed!" The older girl runs to the cupboard. She opens it and looks inside. "Which dress do you want?" Ali asks. "The pink one or the blue one?" She thinks for a long time. "The pink one!" she says. "Good choice," says Ali.

He helps her put it on. "Arms in," he says. She puts her arms in. "Head through." Her head comes out at the top, and her hair is everywhere. They both laugh. "You look beautiful!" Ali says.

The little one does not want to get dressed. She is running around the room. "Come here, baby," Ali says. "Do you want the yellow one?" She stops and looks at the yellow dress. She likes yellow. "Yes!" she says. "Arms in. Head through. All done!"

"Now wear your sweater," Ali says. "It's cold outside." The girls put on their sweaters. Then Ali says, "Let me comb your hair." The older girl sits down. "Hold still, please," he says, because she is moving her head. "Do you want a ponytail?" "Two ponytails!" she says. Ali makes two ponytails. It is not easy, but he does it.

"Now put on your shoes," he says. The little one puts her right shoe on her left foot. "Oops," says Ali. "This is your left foot. This shoe is for the right foot." She changes it. "Good girl!"

Then there is a problem. The older girl has only one sock. "Abbu, where is my other sock?" Ali looks under the bed. No sock. He looks in the cupboard. No sock. "Where are your socks?" he asks the little one. She smiles and does not say anything. Ali knows that smile. "Let's find them together," he says.

They look in the toy box. They look behind the door. Finally, they find the sock inside the little one's teddy bear house. Everybody laughs. "Why is the sock here?" Ali asks. "Teddy was cold!" says the little one.

At last, everyone is ready. Warm clothes, two ponytails, two shoes, and two socks. "Let's go to Grandma's house," says Ali.`,
 phrases:["Which dress do you want?","Arms in, head through","Hold still, please","This is your left foot","Let's find them together"]}},

 text:`The kitchen smells of fresh bread and eggs. Ali's wife puts the plates on the table. "Breakfast is ready!" she calls. Ali brings the girls to the table. "Sit down, please," he says. The girls climb onto their chairs.

"Are you hungry?" Ali asks. "Yes!" both girls say. "Do you want an egg or some bread?" The older girl says, "Egg, please!" The little one points at the bread. "Bread," she says. "Bread, please," Ali says gently. "Bread, please," she repeats. "Very good!"

The older girl starts eating very fast. "Eat slowly, sweetie," Ali says. "Chew your food. Chew, chew, chew." He makes a funny face while he chews, and she laughs with her mouth full.

Then Ammu brings two cups of warm milk. "Drink your milk," she says. The little one takes her cup, but then she stops. "Hot!" she says. "Yes, it's hot. Blow on it," says Ali. He shows her: "Whoo, whoo." She blows on her milk. "Whoo, whoo." Now the milk is not too hot.

After a few minutes, the older girl's plate is empty. "Do you want some more?" Ali asks. She nods. "Then say, 'More, please.'" "More, please!" she says proudly. Ali gives her a little more egg. "And now say, 'Thank you, Abbu.'" "Thank you, Abbu!"

Then, suddenly, there is a big noise. The little one's cup falls. The milk spills all over the table and onto the floor. Her eyes fill with tears. She looks at Ali. She thinks he is angry.

Ali is not angry. "Oops! It spilled," he says calmly. "That's okay. Let's clean it up." He gives her a cloth. "You wipe here, and I wipe there." Together, they clean the table. The older girl helps too. In one minute, everything is clean again. The little one is smiling now.

"Are you full?" Ali asks the girls. "Yes, I'm full," says the older one. "Good eating!" says Ali. "Now put your plate here." The girls bring their plates to the kitchen. "Wipe your mouth," he says, and gives them a napkin. "Now let's wash your hands."

Ali's wife looks at him and smiles. "You were very patient," she says. "Mistakes are okay," Ali says. "That's how we learn, right?"`,
 phrases:["Are you hungry?","Eat slowly","It's hot. Blow on it.","More, please","That's okay. Let's clean it up."]}},

 story:{title:"The Red Ball",bn:"আব্বু মেয়েদের সাথে বল খেলে, রঙ আর সংখ্যা শেখায়, আর খেলা শেষে সবাই মিলে খেলনা গুছিয়ে রাখে।",
 text:`It is Friday afternoon. Ali has no meetings today, so he has time to play with his daughters. "Girls, let's play!" he says. The girls jump up and down. "Play! Play!"

"Where is your ball?" Ali asks. The older girl runs to her room and comes back with a big red ball. "Here, Abbu!" "Great. Now stand there," Ali says. "Throw the ball to me." She throws the ball. It goes to the left, not to Ali. He runs and catches it. Everyone laughs.

"Okay, ready? Catch!" Ali throws the ball softly. She catches it with both hands. "Yay! I did it!" "Well done!" says Ali. The little one is waiting. She wants the ball too. "It's your turn, baby," Ali says. He rolls the ball to her on the floor. She stops it with her hands and laughs. "Now it's my turn," says the older girl. They take turns again and again.

After the ball game, they sit on the carpet with a box of colorful blocks. Ali picks up one block. "What color is this?" The little one says, "Red!" "Yes! It's red. Good job." He picks up another block. "And this one?" "Blue!" says the older girl. "Show me the yellow one," Ali says. The little one looks and looks, and then she finds it. "This one!" "Wow, you're so smart!"

Then Ali takes a picture book. On one page, there are some apples on a tree. "How many apples are there?" he asks. "Let's count. One, two, three, four, five!" The girls count with him. "Five apples!" says the older girl. The little one only says, "Three!" and everyone claps anyway.

Soon it is almost dinner time. "Okay, girls. Playtime is over," Ali says. "Let's clean up." The girls do not want to stop. "Five more minutes?" asks the older girl. "Okay, two more minutes," says Ali.

When the time is over, Ali brings the toy box. "Put the toys in the box." The older girl starts to put the blocks in. The little one is holding the red ball. She does not want to give it. "Please share with your sister," Ali says. "And help your sister clean up." Slowly, the little one puts the ball in the box.

In five minutes, the room is clean. "Thank you for helping!" Ali says, and he gives them a high five.`,
 phrases:["Throw the ball to me","It's your turn","What color is this?","Let's count","Thank you for helping!"]}},

 story:{title:"Sorry, Sister",bn:"দুই বোনের ঝগড়া হয়, একজন কাঁদে, আব্বু শান্তভাবে অনুভূতি জিজ্ঞেস করে আর সরি-থ্যাংক ইউ বলতে শেখায়।",
 text:`On a rainy afternoon, the girls are playing inside. Ali is working on his laptop in the next room. Suddenly, he hears a loud cry. He closes his laptop and runs to the girls.

The little one is sitting on the floor. She is crying. The older girl is holding a doll. "Why are you crying?" Ali asks softly. The little one points at her sister. "She hit me!" "Are you hurt?" Ali asks. "Let me see." He looks at her arm. It is a little red, but it is not serious. "It's okay. Abbu is here," he says, and he gives her a hug. "Don't cry, baby."

Then he turns to the older girl. He does not shout. He sits down next to her. "What happened, sweetie?" "She took my doll!" she says. "I see. You were angry," Ali says. "That's okay. Everyone gets angry sometimes. But don't hit. Use your words. You can say, 'Please give me my doll.'"

The older girl looks at the floor. "Say sorry to your sister," Ali says. She is quiet for a moment. Then she walks to her little sister. "Sorry," she says. The little one stops crying. Ali smiles. "Good girl. And now," he says to the little one, "you can say, 'Can I play with the doll, please?'"

"Can I play, please?" says the little one. The older girl thinks. Then she gives her the doll. "Here. But be gentle." "Say thank you," Ali says. "Thank you!" says the little one.

Ali is very happy. "Well done, both of you. I'm proud of you." The girls start playing together again. But soon they are running around the living room and shouting.

"Girls," Ali says. "Walk, don't run. And inside voice, please." The girls laugh and start whispering. "Is this an inside voice, Abbu?" whispers the older girl. "Perfect," Ali whispers back.

Later, at dinner, Ali's wife asks, "How was the afternoon?" The older girl says, "We said sorry and thank you." Her mother looks surprised. "In English? Wow! Who taught you?" Both girls point at Ali. He just smiles and says, "Please pass the rice."`,
 phrases:["Why are you crying?","Are you hurt? Let me see.","Use your words","Say sorry","I'm proud of you"]}},

 story:{title:"One More Story",bn:"রাতে আব্বু মেয়েদের ঘুমের জন্য তৈরি করে, গল্প পড়ে, গান গায়, আর ভালোবাসা জানিয়ে শুভ রাত্রি বলে।",
 text:`It is eight thirty at night. The house is quiet now. Ali looks at the clock and says, "Girls, it's bedtime." The older girl says, "Not yet, Abbu! I'm not sleepy." But she is yawning. Ali laughs. "I think you are a little bit sleepy."

"First, put on your pajamas," he says. The girls have pajamas with stars on them. The little one puts her pajama top on backwards. Ali helps her. "Now let's brush your teeth." They go to the bathroom and brush their teeth, up and down, just like every morning. "And go potty before bed," Ali reminds them.

Then they go to their room. "Get into bed," Ali says. The girls jump onto the bed. "Lie down, please." They lie down, but they are still giggling.

"Which book do you want?" Ali asks. The older girl chooses a book about a little bear who cannot sleep. "Let's read a story," says Ali. He sits next to them and starts reading. "Once upon a time, there was a little bear..." When he finishes a page, he says to the little one, "Turn the page." She turns the page with her small hand. She loves this job.

When the story ends, the older girl says, "One more story, please!" Ali shakes his head. "Not tonight. But shall I sing a song?" "Yes!" they both say. Ali sings a soft song. His voice is not perfect, but the girls love it. Slowly, their eyes start to close.

"Close your eyes," he says quietly. "Time to sleep." The little one opens one eye. "Abbu, is it dark?" She is a little scared. "Don't worry. Abbu is here," he says, and he holds her hand. "And the night light is on."

Ali kisses the older girl on the forehead. "I love you so much. Good night, sweetie." "Good night, Abbu," she whispers. He kisses the little one. "Sleep tight. Sweet dreams." "Sweet dreams," she repeats, very softly. "See you in the morning," Ali says.

He turns off the big light and walks to the door. He stops and looks back. Both girls are sleeping. In the living room, his wife is waiting with two cups of tea. "Are they asleep?" she asks. "Yes," Ali says with a smile. "And tonight, they said 'good night' in English."`,
 phrases:["It's bedtime","Get into bed","Which book do you want?","Close your eyes","Sleep tight. Sweet dreams."]}}

 story:{title:"The First Call with Sarah",bn:"আলী একজন বেকারি মালিক সারার সাথে প্রথম কলে নিজের পরিচয় দেয়, প্রশ্ন করে প্রয়োজন বোঝে, আর কারণ দেখিয়ে পরামর্শ দেয়।",
 text:`It is Monday evening in Dhaka and Monday morning in London. Ali checks his camera and microphone. In two minutes, he has a call with a new client, Sarah. She owns a small bakery.

The call starts. "Hi, Sarah! Can you hear me okay?" "Yes, perfectly," she says. "Great. Thanks for taking the time to talk today. Hi, I'm Ali, a WordPress developer from Bangladesh. I run a small web agency called BD Webhut. We build fast, mobile-friendly websites. I've worked with WordPress since 2019, and I mostly work with Elementor and Figma. So, how can I help you with your project?"

Sarah smiles. "Well, we need a better website. Our current one is very old." "I see," says Ali. "Could you tell me a bit about your business?" "Sure. We're a family bakery. We make bread, cakes and cookies. We have two shops in London." "That sounds lovely," says Ali. "Who are your main customers?" "Mostly local families and some offices nearby. They order birthday cakes and lunch boxes."

"Do you already have a website?" Ali asks, even though he knows the answer. He wants her to explain it. "Yes, but it's terrible," she laughs. "What would you like to improve?" "Everything! People can't find our menu, and it looks bad on a phone."

Ali opens her website while they are talking. He checks it on his phone too. "Thanks. I'm looking at it now," he says. "Are there any websites you really like?" Sarah sends him two links. Both sites are clean, with big photos and simple menus.

Then Ali gives his ideas. "Okay, here's what I think. I suggest a new design because the current one is hard to use on phones. Most of your customers will visit from their phones. Also, your site loads slowly, so many visitors leave before they see your cakes." Sarah nods. "That makes sense."

"We use a page builder, which means you can edit the pages yourself. For example, you can change the menu prices without calling me." "Oh, I love that," Sarah says.

"I'd start with the homepage because it gets the most visitors. Then we can build the menu page and an order form." Sarah asks, "How much will it cost?" Ali answers politely, "Do you have a budget in mind? Then I can suggest the best option for you." She tells him her budget. It is not big, but it is fair.

"Perfect. Let me summarize what you need: a new mobile-friendly design, a fast homepage, a clear menu page, and an order form. Is that right?" "Exactly right," says Sarah. "I'll send you a detailed quote today," Ali says. "Thank you so much for your time, Sarah." After the call, Ali takes a deep breath and smiles. He did not translate from Bangla in his head. He just talked.`,
 phrases:["I run a small web agency called…","Could you tell me a bit about your business?","…because…","…, so …","Let me summarize what you need"]}},

 story:{title:"Friday Update",bn:"আলী সপ্তাহের শেষে ক্লায়েন্টকে past tense দিয়ে কী কী কাজ হয়েছে জানায়, এরপর কী হবে বলে, আর মতামত চায়।",
 text:`It is Friday afternoon. Ali has worked on Sarah's bakery website all week. Now it is time to send a progress update. He knows a good update is short, clear and friendly. He also knows that finished work needs the past tense.

He opens a voice message and starts to speak. "Hi Sarah, I hope you're having a good week. Here's a quick update on the project.

"First, I finished the homepage yesterday. It has a big photo of your cakes at the top and a clear button to see the menu. Second, I fixed the menu on mobile. Before, it was hard to open on a phone, but now it works perfectly. Third, I optimized the images, so the site is faster now. The homepage loaded in six seconds before, and now it loads in under two seconds. I also added a contact form to the About page, like you asked. Finally, I tested everything on Chrome and Safari, and on my phone and my laptop.

"So, everything is on track. I'm currently working on the shop page, where customers can order birthday cakes. I'll send you a preview link tonight. Could you take a look and let me know your thoughts? Please let me know if you'd like any changes. I'll keep you posted. Have a great weekend!"

He listens to the message once before sending it. Then he notices something. He said "I finish the homepage" in the first try, so he records it again: "I finished the homepage." Past tense for finished work. He sends it.

Ten minutes later, Sarah replies with a voice message. "Thanks, Ali! That sounds great. Quick question: do you need anything from us for the shop page?"

Ali thinks for a moment. He wants to use articles correctly, because he knows this is one of his weak points. He replies slowly and clearly. "Yes, actually. I need a list of your cakes and the prices. I also need a photo of each cake, if possible. One more thing: there is a problem with the payment plugin on your old hosting. Could you send me the login details for the hosting? Then I can fix it before we launch."

Sarah sends the details, and she adds, "The photographer sent us an email this morning with new photos. I'll forward them to you." "Perfect, thank you," Ali says. "I'll upload the new images to the server tonight, and I'll share the link in a minute when the preview is ready."

That evening, Ali reads his messages again. Finished, fixed, optimized, added, tested. A logo, an email, the server, the hosting. Small words, but they make him sound professional.`,
 phrases:["I finished / fixed / added …","Everything is on track","I'm currently working on…","Could you take a look and let me know your thoughts?","I'll keep you posted"]}},

 story:{title:"The Plugin Problem",bn:"লঞ্চের আগে প্লাগিনে সমস্যা হয়; আলী ভদ্রভাবে দেরির কথা জানায়, কারণ ব্যাখ্যা করে, আর অসন্তুষ্ট ক্লায়েন্টকে শান্তভাবে সমাধান দেয়।",
 text:`On Wednesday night, Ali finds a problem. The payment form on Sarah's website is not working. When he tests an order, the page shows an error. He checks again and again. The problem is in one of the plugins. Fixing it will take time, and the launch is on Friday.

On Thursday morning, Sarah sends a message. "Hi Ali! Just checking in. Are we still on track for Friday?" Ali feels nervous. In the past, he sometimes answered too directly, like "It will be ready Saturday, not Friday." Now he knows a better way: thank, apologize, explain, give a new time, and show care.

He replies: "Hi Sarah, thanks for checking in! I'm sorry, but the site won't be ready until Saturday. I found an issue with one of the plugins, and the payment form isn't working correctly yet. I want to make sure everything works perfectly before your customers use it. I'll send it over first thing Saturday morning. Thank you for your patience."

Sarah answers quickly. "No problem. Thanks for being honest." Ali smiles. Being honest and polite works.

On Friday, he fixes the problem. Then he explains it to Sarah in simple words, without too much technical language. "Good news! It's fixed now. The plugin was outdated, so I updated it. I also noticed the site was slow because of the hosting, so I changed a few settings. I've added a backup, just in case."

But on Saturday, Sarah calls him. She does not sound happy. "Ali, I looked at the site and it still looks old. The colors are dark, not the new ones. Honestly, I'm a bit disappointed."

Ali stays calm. He remembers the rule: first sorry, then questions, then a solution. "I'm sorry to hear that," he says. "Could you tell me which part you don't like?" "The homepage. It has the old dark colors." Ali thinks for a second. He knows the new colors are already live. "I understand your concern. I think your browser is showing the old version. Could you clear your cache and check again?"

He explains how to do it, step by step. After a minute, Sarah laughs. "Oh! Now I can see it. It looks beautiful. Sorry, Ali!" "No worries at all. It happens a lot," he says.

Then Sarah has one more request. "Could the cake photos be bigger on mobile?" "Of course," Ali says. "Here's what I suggest. I'll make the photos full-width on phones, and I'll fix it as soon as possible, today if I can. Does that work for you?" "That works perfectly," she says.

After the call, Ali writes down what he learned: stay calm, ask questions, and always offer a plan.`,
 phrases:["Thanks for checking in!","I'm sorry, but … won't be ready until …","The plugin was outdated, so I updated it","Could you tell me which part you don't like?","Here's what I suggest"]}},

 story:{title:"Is There Any Flexibility?",bn:"নতুন ক্লায়েন্ট মার্ক দাম কমাতে চায়; আলী দাম না কমিয়ে কাজের পরিধি বদলে দুজনের জন্য ভালো একটা চুক্তি করে।",
 text:`Mark runs a small fitness studio in Toronto. He wants a website with online booking. Ali sent him a quote yesterday. Today they have a call.

"Hi Mark, thanks for joining. Did you get a chance to look at the quote?" "Yes, I did," says Mark. "Honestly, it's more than we expected. Is there any flexibility?"

In the past, Ali felt nervous when clients talked about money. Sometimes he lowered his price immediately. Now he knows his work has value. He also knows that negotiation is a normal conversation, not a fight.

"Sure, let's talk about it," Ali says. "My price for this project is six hundred dollars. It includes design, development and three months of support. The support is important, because if anything breaks after launch, I fix it for free."

"That sounds good," Mark says, "but our budget is about four hundred." Ali nods. "I understand that the budget is tight. Can I ask you a question? Which parts are most important for you right now?" Mark thinks. "The booking system, for sure. And the class schedule."

"Okay," Ali says. "I can't lower the price for the full project, but I can reduce the scope. We could start with five pages and add more later. The five pages would be the homepage, classes, schedule, booking and contact. The blog and the trainer profiles can come in the second phase."

"What would that cost?" Mark asks. "For the first phase, four hundred and fifty dollars, with the same three months of support." Mark is quiet for a moment. "Four hundred and fifty. Hmm."

Ali adds one more idea. "Also, if you pay in full, I can include the hosting setup for free. Normally I charge fifty dollars for that. That's the best I can do." Mark laughs. "You're a good negotiator, Ali." "I just want to find something that works for both of us," Ali says.

"Okay, deal," says Mark. "Let's do the first phase." Ali smiles. "Great, I'm glad we agree. I'll send you the contract and the invoice today. Once I receive the payment, I'll start. When would you like to have our first meeting?" "How about Thursday?" "Thursday works for me. I'm really looking forward to working with you. Have a great day!"

After the call, Ali writes in his notebook: never just lower the price; change the scope, add value, and stay friendly. He also notices that he spoke for twenty minutes in English without stopping to translate. That feels even better than the deal.`,
 phrases:["It includes …","I understand that the budget is tight","I can't lower the price, but I can …","If you…, I can…","Let's find something that works for both of us"]}},

 story:{title:"The Design Review",bn:"আলী ক্লায়েন্ট টিমের সাথে ভিডিও কলে ছোট আলাপ করে, স্ক্রিন শেয়ার করে ডিজাইন দেখায়, মতামত নোট করে আর সারাংশ বলে।",
 text:`On Thursday evening, Ali has a video meeting with Mark and his team from the fitness studio. It is their first design review. Ali opens his laptop ten minutes early, checks his camera, and opens the design in Figma.

At exactly nine o'clock, Mark joins the call with two people from his team, Lisa and Tom. "Hi everyone! Can you hear me okay?" Ali asks. "Yes, loud and clear," says Mark.

Before the work talk, Ali starts with some small talk. "How was your weekend, Mark?" "It was great, thanks. I went hiking with my kids. How about you?" "It was great too. I spent time with my family. My daughters are learning English with me, actually." "Oh, that's wonderful!" says Lisa. "How's the weather over there?" Ali asks. "Cold! It's snowing," says Tom. Ali laughs. "It's pretty hot here today."

"Okay, let me share my screen," Ali says. He clicks the share button. "Can you see my screen now?" There is a short silence. Then Mark's voice comes back, but it is cutting in and out. "Sorry, you're breaking up," Ali says. "Could you say that again?" Mark turns off his camera, and now the sound is clear. "Yes, we can see it."

"Great. Let's go through the design together. Feel free to stop me if you have any questions." Ali shows the homepage first. He explains the big photo, the class schedule and the booking button. Then he stops and asks, "What do you think so far?"

Lisa speaks first. "I love the photos. But the booking button is a bit small. People need to find it fast." "That's a great point," Ali says. "Let me make a note of that." He writes it down. "Just to confirm, you want the button bigger, and maybe a brighter color?" "Yes, exactly," says Lisa.

Tom asks about the menu. He wants the "Classes" link first, not "About." Ali notes that too. Mark asks if the colors can match their logo better. "Of course," says Ali.

At the end, Ali summarizes. "So, to sum up, I'll update the colors to match your logo, I'll make the booking button bigger and brighter, and I'll change the order of the menu. I'll send you the new version on Monday. Does that work for everyone?" Everyone agrees.

Ali looks at the time. It is very late for him, but it is the afternoon for them. Mark says, "Oh, what time is it there? Sorry to keep you so late." Ali smiles. "No problem at all. Thanks for your time today. Have a great evening!"

After the meeting, Ali feels proud. He asked questions, he confirmed details, and he gave a clear summary. That is what a professional sounds like.`,
 phrases:["Can you hear me okay?","Let me share my screen","Feel free to stop me…","Just to confirm, …?","So, to sum up, …"]}}
);
