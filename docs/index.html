<script>if("serviceWorker" in navigator){
  /* always look for a new version on open and when the app comes back to the front; when it arrives, refresh once (never in the middle of a lesson or game) */
  const had=!!navigator.serviceWorker.controller;let ready=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)ready=true;});
  const busy=()=>{try{return (typeof L!=="undefined"&&L)||(typeof APP!=="undefined"&&APP.spell&&APP.spell.scr==="game")||(typeof APP!=="undefined"&&APP.warm);}catch(e){return false;}};
  setInterval(()=>{if(ready&&!busy()){ready=false;location.reload();}},1500);
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    const check=()=>reg.update().catch(()=>{});check();
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check();});
  }).catch(()=>{}));
}</script>

<style>
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(70vmax 60vmax at 20% 0%,#d7efe4,transparent 70%),radial-gradient(60vmax 50vmax at 100% 100%,#e6eef6,transparent 70%),#eef2ef;font-family:"Geist",ui-sans-serif,system-ui,sans-serif;color:#10231f;transition:opacity .55s cubic-bezier(.2,.8,.2,1),visibility .55s}
:root[data-theme="dark"] #splash{background:radial-gradient(70vmax 60vmax at 20% 0%,#138a7e33,transparent 70%),#0b1312;color:#e5efec}
#splash.out{opacity:0;visibility:hidden}#splash.out .sp-in{transform:scale(1.08);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:14px}
.sp-logo{position:relative;width:104px;height:104px;border-radius:32px;background:linear-gradient(145deg,#137a70,#0d5c55 60%,#0a4a44);display:grid;place-items:center;box-shadow:0 26px 50px -22px #0d5c55,inset 0 2px 0 #ffffff30;animation:spPop .9s cubic-bezier(.34,1.56,.64,1) both}
.sp-logo svg{width:64%;height:64%;overflow:visible}
.sp-bub{transform-origin:12px 12px;animation:spBub .7s .25s cubic-bezier(.34,1.56,.64,1) both}
.sp-b{transform-box:fill-box;transform-origin:50% 50%;animation:spIn .45s cubic-bezier(.34,1.56,.64,1) both,spEq 1s ease-in-out infinite}
.sp-b.b1{animation-delay:.55s,1s}.sp-b.b2{animation-delay:.65s,1.12s}.sp-b.b3{animation-delay:.75s,1.24s}
.sp-ring{position:absolute;inset:-10px;border-radius:40px;border:2px solid #4fbf9366;animation:spRing 1.8s .6s ease-out infinite}
.sp-leaf{position:absolute;top:-8px;right:-6px;width:26px;height:18px;border-radius:0 18px 0 18px;background:linear-gradient(135deg,#7bd36b,#3fa64a);transform:rotate(-20deg) scale(0);animation:spLeaf .6s .9s cubic-bezier(.34,1.56,.64,1) forwards}
.sp-name{font-weight:700;font-size:1.7rem;letter-spacing:-.03em;display:flex;overflow:hidden}
.sp-name span{display:inline-block;transform:translateY(110%);animation:spUp .7s calc(.75s + var(--i)*.035s) cubic-bezier(.165,.84,.44,1) forwards}
.sp-by{font-size:.72rem;letter-spacing:.04em;color:#8a9994;opacity:0;animation:spFade .6s 1.45s forwards;margin-top:-6px}
.sp-tag{font-size:.9rem;color:#586a65;opacity:0;animation:spFade .6s 1.25s forwards}
:root[data-theme="dark"] .sp-tag{color:#9db0aa}
.sp-bar{width:120px;height:4px;border-radius:9px;background:#10231f14;overflow:hidden;opacity:0;animation:spFade .4s 1.1s forwards}
.sp-bar i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,#4fbf93,#0d5c55);animation:spLoad 1.1s ease-in-out infinite}
@keyframes spPop{from{transform:scale(.3) rotate(-12deg);opacity:0}}
@keyframes spBub{from{transform:scale(0)}}
@keyframes spIn{from{transform:scaleY(0)}}
@keyframes spEq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
@keyframes spRing{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes spLeaf{to{transform:rotate(-20deg) scale(1)}}
@keyframes spUp{to{transform:none}}
@keyframes spFade{to{opacity:1}}
@keyframes spLoad{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.sp-native{display:none}
.from-native .sp-native{display:block;position:absolute;left:50%;top:50%;width:min(83vw,430px);height:auto;aspect-ratio:1;translate:-50% -50%;z-index:2;animation:spShrink .75s .05s cubic-bezier(.65,0,.35,1) forwards}
.from-native .sp-logo{animation-delay:.55s}.from-native .sp-bub{animation-delay:.7s}
@keyframes spShrink{to{width:104px;border-radius:32px;translate:-50% calc(-50% - 54px);opacity:0}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-iteration-count:1!important}}

<style>/* Design: Tend-style soft SaaS. Geist + Hind Siliguri, teal-on-mist, soft depth, pill controls.
   Motion vocabulary: --ease (expo-ish out), --spring (soft overshoot). */
:root{
  --font:"Geist","Hind Siliguri",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bn:"Hind Siliguri","Noto Sans Bengali","Geist",system-ui,sans-serif;
  --display:var(--font); --body:var(--font);
  --bg:#eef2ef; --glow-a:#d7efe4; --glow-b:#e6eef6;
  --surface:#fbfcfb; --raised:#ffffff; --sunk:#10231f0b; --well:#10231f0e;
  --ink:#10231f; --muted:#586a65; --faint:#8a9994; --line:#10231f16; --line-2:#10231f29;
  --primary:#0d5c55; --on-primary:#f1fbf7;
  --side:#0f2d29; --on-side:#dcebe7; --side-dim:#dcebe79e; --side-pill:#c4ecd9; --on-side-pill:#0b2925;
  --shadow:0 1px 2px #10231f0a,0 14px 34px -22px #10231f38;
  --shadow-pop:0 24px 60px -18px #10231f4d,0 2px 6px #10231f14;
  --fam:#d6516b; --cli:#3a7fcc; --eve:#138a7e; --warm:#e08a2e; --story:#7c62d4;
  --good:#1d8656; --bad:#cf4429; --locked:#c6d0cc; --on:#ffffff;
  --fam-d:color-mix(in srgb,var(--fam) 78%,#000); --cli-d:color-mix(in srgb,var(--cli) 78%,#000);
  --eve-d:color-mix(in srgb,var(--eve) 78%,#000); --warm-d:color-mix(in srgb,var(--warm) 72%,#000);
  --story-d:color-mix(in srgb,var(--story) 78%,#000);
  --fam-s:color-mix(in srgb,var(--fam) 13%,var(--surface)); --cli-s:color-mix(in srgb,var(--cli) 13%,var(--surface));
  --eve-s:color-mix(in srgb,var(--eve) 13%,var(--surface)); --warm-s:color-mix(in srgb,var(--warm) 15%,var(--surface));
  --story-s:color-mix(in srgb,var(--story) 13%,var(--surface)); --good-s:color-mix(in srgb,var(--good) 13%,var(--surface));
  --bad-s:color-mix(in srgb,var(--bad) 12%,var(--surface));
  --r-card:22px; --r-tile:16px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1312; --glow-a:#138a7e29; --glow-b:#4c94dc14; --surface:#121d1c; --raised:#1b2a28; --sunk:#ffffff0b; --well:#ffffff0e;
  --ink:#e5efec; --muted:#9db0aa; --faint:#6f817c; --line:#ffffff13; --line-2:#ffffff26;
  --primary:#5cd0b4; --on-primary:#06201c; --side:#0e1918; --on-side:#d6e6e2; --side-dim:#d6e6e28f; --side-pill:#5cd0b4; --on-side-pill:#06201c;
  --shadow:0 1px 0 #ffffff0a inset,0 18px 40px -26px #000c; --shadow-pop:0 24px 60px -18px #000000bf,0 0 0 1px #ffffff14;
  --fam:#ef7c93; --cli:#74b3f0; --eve:#3cc0ad; --warm:#f2aa5f; --story:#a996ee; --good:#5fd09a; --bad:#f07a5f; --locked:#2a3a37; --on:#06201c;
  --fam-d:color-mix(in srgb,var(--fam) 60%,#fff); --cli-d:color-mix(in srgb,var(--cli) 60%,#fff); --eve-d:color-mix(in srgb,var(--eve) 60%,#fff);
  --warm-d:color-mix(in srgb,var(--warm) 60%,#fff); --story-d:color-mix(in srgb,var(--story) 60%,#fff);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1312; --glow-a:#138a7e29; --glow-b:#4c94dc14; --surface:#121d1c; --raised:#1b2a28; --sunk:#ffffff0b; --well:#ffffff0e;
  --ink:#e5efec; --muted:#9db0aa; --faint:#6f817c; --line:#ffffff13; --line-2:#ffffff26;
  --primary:#5cd0b4; --on-primary:#06201c; --side:#0e1918; --on-side:#d6e6e2; --side-dim:#d6e6e28f; --side-pill:#5cd0b4; --on-side-pill:#06201c;
  --shadow:0 1px 0 #ffffff0a inset,0 18px 40px -26px #000c; --shadow-pop:0 24px 60px -18px #000000bf,0 0 0 1px #ffffff14;
  --fam:#ef7c93; --cli:#74b3f0; --eve:#3cc0ad; --warm:#f2aa5f; --story:#a996ee; --good:#5fd09a; --bad:#f07a5f; --locked:#2a3a37; --on:#06201c;
  --fam-d:color-mix(in srgb,var(--fam) 60%,#fff); --cli-d:color-mix(in srgb,var(--cli) 60%,#fff); --eve-d:color-mix(in srgb,var(--eve) 60%,#fff);
  --warm-d:color-mix(in srgb,var(--warm) 60%,#fff); --story-d:color-mix(in srgb,var(--story) 60%,#fff);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;color:var(--ink);font:500 15.5px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-wrap:break-word;
  background:radial-gradient(60vmax 50vmax at 12% -10%,var(--glow-a),transparent 70%),radial-gradient(50vmax 40vmax at 100% 0%,var(--glow-b),transparent 70%),var(--bg);
  background-attachment:fixed;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button,label.btn,summary{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px}
.bn{font-family:var(--bn)}
h1,h2,h3{font-family:var(--font);margin:0;text-wrap:balance;letter-spacing:-.025em}
h1{font-size:clamp(1.75rem,6vw,2.3rem);font-weight:700;line-height:1.08}
h2{font-size:1.28rem;font-weight:700;line-height:1.2} h3{font-size:1.02rem;font-weight:650;line-height:1.3;letter-spacing:-.01em}
p{margin:0}
.num,.timer,.metric b{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.stack{display:flex;flex-direction:column;gap:10px} .stack-lg{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .center{justify-content:center;text-align:center}
.view{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(108px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
details.card summary{list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .35s var(--ease)}
details.card[open] summary::after{transform:rotate(225deg)}
details.card summary::-webkit-details-marker{display:none}
.panel{background:var(--well);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.panel code{font-family:var(--mono);font-size:.85rem;overflow-wrap:anywhere}
.eyebrow{font:600 .74rem/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hello{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.hello .eyebrow{text-transform:none;letter-spacing:0;font-size:.86rem;font-weight:550}
/* split-word headline reveal */
.sw{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.sw>span{display:inline-block;will-change:transform}

/* ---- buttons: pill, soft glow, press-scale ---- */
.btn{--c:var(--primary);--on-c:var(--on-primary);position:relative;border:1px solid transparent;border-radius:999px;min-height:46px;padding:0 20px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c);color:var(--on-c);font:650 .95rem/1.2 var(--font);white-space:nowrap;
  box-shadow:0 10px 22px -12px color-mix(in srgb,var(--c) 85%,transparent);
  transition:transform .35s var(--ease),filter .2s,box-shadow .35s var(--ease),background-color .25s,opacity .25s}
@media (hover:hover){.btn:hover{filter:brightness(1.1);box-shadow:0 14px 26px -12px color-mix(in srgb,var(--c) 90%,transparent)}}
.btn:active{transform:scale(.965);transition-duration:.08s}
.btn svg{width:18px;height:18px;flex:none}
.btn.wide{width:100%}
.btn.ghost{--c:var(--raised);--on-c:var(--ink);border-color:var(--line-2);box-shadow:0 1px 2px #10231f0a}
@media (hover:hover){.btn.ghost:hover{filter:none;background:var(--surface)}}
.btn.good{--c:var(--good);--on-c:#fff} .btn.bad{--c:var(--bad);--on-c:#fff}
.btn.fam{--c:var(--fam);--on-c:#fff} .btn.eve{--c:var(--eve);--on-c:#fff} .btn.warm{--c:var(--warm);--on-c:#fff} .btn.story{--c:var(--story);--on-c:#fff}
:root[data-theme="dark"] .btn:not(.ghost){--on-c:#06201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){--on-c:#06201c}}
.btn.sm{min-height:36px;padding:0 14px;font-size:.85rem}
.btn:disabled{opacity:.42;box-shadow:none;cursor:not-allowed;filter:grayscale(.3)}
.btn:disabled:active{transform:none}
.icon-btn{border:1px solid var(--line-2);background:var(--raised);border-radius:50%;width:42px;height:42px;display:inline-grid;place-items:center;padding:0;flex:none;color:var(--ink);
  box-shadow:0 1px 2px #10231f0a;transition:transform .35s var(--ease),background-color .2s}
.icon-btn:active{transform:scale(.9);transition-duration:.08s}
@media (hover:hover){.icon-btn:hover{background:var(--surface)}}
.icon-btn svg{width:19px;height:19px}
.chip{display:inline-flex;align-items:center;gap:5px;font:650 .76rem/1 var(--font);padding:6px 10px;border-radius:999px;background:var(--well);color:var(--muted);white-space:nowrap;transition:transform .3s var(--ease)}
button.chip:active{transform:scale(.94)}
.tag{font:650 .66rem/1 var(--font);letter-spacing:.06em;text-transform:uppercase}
.tag.m{color:var(--good)} .tag.c{color:var(--story)} .tag.s{color:var(--warm-d)} .tag.n{color:var(--muted)}
.note{padding:12px 14px;border-radius:16px;background:var(--cli-s);font-size:.92rem;border:1px solid color-mix(in srgb,var(--cli) 18%,transparent)}
.warnbox{padding:12px 14px;border-radius:16px;background:var(--bad-s);font-size:.92rem;border:1px solid color-mix(in srgb,var(--bad) 18%,transparent)}
.okbox{padding:12px 14px;border-radius:16px;background:var(--good-s);font-size:.92rem;border:1px solid color-mix(in srgb,var(--good) 18%,transparent)}
.note a,.warnbox a{color:inherit;font-weight:650}
input[type=text],input[type=search],textarea,select{width:100%;border:1px solid var(--line-2);background:var(--raised);border-radius:14px;padding:11px 14px;font-weight:500;
  transition:border-color .2s,box-shadow .3s var(--ease)}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 16%,transparent)}
textarea{min-height:96px;resize:vertical}
label.lbl{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--muted);font-weight:600}
/* switch */
.sw-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.92rem;font-weight:550;cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:46px;height:26px;border-radius:999px;background:var(--line-2);margin:0;cursor:pointer;transition:background-color .3s var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .35s var(--spring)}
.switch:checked{background:var(--primary)} .switch:checked::after{transform:translateX(20px)}

/* ---- top bar ---- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5;margin-inline:-16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:1.05rem}
.brand i{width:34px;height:34px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-style:normal;box-shadow:0 8px 18px -10px var(--primary)}
.brand i svg{width:19px;height:19px}
.stats{display:flex;align-items:center;gap:6px}
.stat{display:flex;align-items:center;gap:5px;font:650 .92rem var(--font);background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 7px;box-shadow:0 1px 2px #10231f0a}
.stat svg{width:20px;height:20px}
.flame{color:var(--warm);display:inline-flex} .flame.off{color:var(--locked)}
.ring{width:24px;height:24px}
.ring circle:last-child{transition:stroke-dasharray .9s var(--ease)}
.warmchip{border:0}
.warmchip.todo{background:var(--warm);color:#fff;box-shadow:0 8px 18px -10px var(--warm)}
.warmchip.ok{background:var(--warm-s);color:var(--warm-d)}

/* ---- track segmented control ---- */
.tracks{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:18px;background:var(--well)}
.seg-pill{position:absolute;top:4px;left:0;height:calc(100% - 8px);border-radius:14px;background:var(--raised);box-shadow:0 2px 8px #10231f1a;transition:transform .5s var(--ease),width .5s var(--ease);pointer-events:none}
.trackbtn{position:relative;z-index:1;border:0;background:transparent;border-radius:14px;padding:8px 6px;font:650 .9rem var(--font);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15;color:var(--muted);transition:color .3s,transform .3s var(--ease)}
.trackbtn:active{transform:scale(.96)}
.trackbtn span{font:500 .72rem var(--bn);opacity:.85}
.trackbtn[aria-pressed="true"]{color:var(--ink)}
.trackbtn[aria-pressed="true"].family b{color:var(--fam)} .trackbtn[aria-pressed="true"].client b{color:var(--cli)} .trackbtn[aria-pressed="true"].everyday b{color:var(--eve)}
.trackbtn b{font-weight:650;transition:color .3s}

/* ---- path ---- */
.unitban{--c:var(--primary);position:relative;overflow:hidden;border-radius:var(--r-card);padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 92%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 80%,#000) 100%);
  box-shadow:0 18px 34px -22px var(--c)}
.unitban::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#ffffff2e,transparent 70%)}
.unitban.family{--c:var(--fam)} .unitban.client{--c:var(--cli)} .unitban.everyday{--c:var(--eve)}
:root[data-theme="dark"] .unitban{color:#06201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .unitban{color:#06201c}}
.unitban .bn{opacity:.9;font-size:.9rem}
.unitban .kick{font:650 .7rem var(--mono);letter-spacing:.06em;opacity:.85}
.path{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:10px 8px}
.nodewrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.node{--c:var(--primary);width:70px;height:70px;border-radius:50%;border:0;display:grid;place-items:center;position:relative;color:#fff;padding:0;
  background:radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--c) 62%,#fff),var(--c) 62%);
  box-shadow:0 14px 26px -12px color-mix(in srgb,var(--c) 80%,transparent),inset 0 -5px 0 #0000001f,inset 0 2px 0 #ffffff40;
  transition:transform .45s var(--spring),box-shadow .3s var(--ease)}
.node:active{transform:scale(.9);transition-duration:.1s}
@media (hover:hover){.node:hover{transform:translateY(-3px) scale(1.03)}}
.node svg{width:28px;height:28px;filter:drop-shadow(0 1px 1px #0002)}
.node.family{--c:var(--fam)} .node.client{--c:var(--cli)} .node.everyday{--c:var(--eve)} .node.storyn{--c:var(--story)}
.node.done{filter:saturate(.8)}
.node.lock{background:var(--well);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line-2)}
.node.cur::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--c) 45%,transparent);animation:halo 2.4s var(--ease) infinite}
@keyframes halo{0%{transform:scale(.92);opacity:1}70%{transform:scale(1.18);opacity:0}100%{opacity:0}}
.node .lbl{position:absolute;top:100%;margin-top:9px;font:600 .72rem var(--font);color:var(--muted);white-space:nowrap}
.node.cur .lbl{color:var(--ink)}
.startpop{background:var(--raised);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;width:min(330px,100%);text-align:left;box-shadow:var(--shadow-pop);transform-origin:50% 0}

/* ---- lesson player ---- */
.player{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);
  background:radial-gradient(60vmax 50vmax at 12% -10%,var(--glow-a),transparent 70%),var(--bg)}
.player .head{display:flex;align-items:center;gap:12px;max-width:660px;width:100%;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.pbar{flex:1;height:12px;border-radius:999px;background:var(--well);overflow:hidden}
.pbar i{display:block;height:100%;min-width:12px;background:linear-gradient(90deg,var(--mint,#4fbf93),var(--good));border-radius:999px;transition:width .7s var(--ease);position:relative}
.pbar i::after{content:"";position:absolute;inset:3px 6px auto;height:3px;border-radius:9px;background:#ffffff59}
.player .body{flex:1;overflow-y:auto;overscroll-behavior:contain;max-width:660px;width:100%;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 190px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.player .foot{position:fixed;left:0;right:0;bottom:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.player .foot .in{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.player .foot.ok{background:var(--good-s);border-color:transparent;animation:sheet .5s var(--ease)}
.player .foot.no{background:var(--bad-s);border-color:transparent;animation:sheet .5s var(--ease),nudge .45s .1s var(--ease)}
@keyframes sheet{from{transform:translateY(60%);opacity:.4}}
@keyframes nudge{20%{translate:-6px 0}45%{translate:5px 0}70%{translate:-3px 0}}
.fbtitle{display:flex;align-items:center;gap:8px;font:700 1.18rem var(--font);letter-spacing:-.02em}
.fbtitle i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal}
.fbtitle i svg{width:17px;height:17px}
.foot.ok .fbtitle{color:var(--good)} .foot.ok .fbtitle i{background:var(--good)}
.foot.no .fbtitle{color:var(--bad)} .foot.no .fbtitle i{background:var(--bad)}
.prompt{font:650 1.32rem/1.32 var(--font);letter-spacing:-.02em}
.speaker{display:flex;gap:10px;align-items:center}
.bigspeak{width:62px;height:62px;border-radius:20px;background:var(--cli);color:#fff;border:0;display:grid;place-items:center;flex:none;
  box-shadow:0 14px 24px -12px var(--cli),inset 0 -4px 0 #0000001f;transition:transform .4s var(--spring)}
.bigspeak:active{transform:scale(.9);transition-duration:.08s}
.bigspeak svg{width:28px;height:28px}
.speaking{animation:speakPulse 1s var(--ease) infinite}
@keyframes speakPulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--cli) 22%,transparent)}}
.answer-line{min-height:62px;border-bottom:1.5px dashed var(--line-2);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:10px}
.tile{border:1px solid var(--line-2);background:var(--raised);border-radius:14px;padding:9px 14px;font:600 1rem var(--font);box-shadow:0 2px 0 var(--line-2),0 6px 14px -10px #10231f40;
  transition:transform .35s var(--spring),opacity .25s,box-shadow .25s}
.tile:active{transform:scale(.92);transition-duration:.08s}
.tile.used{opacity:0;transform:scale(.8);pointer-events:none}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid var(--line-2);background:var(--raised);border-radius:var(--r-tile);padding:14px 16px;text-align:left;font-weight:600;box-shadow:0 1px 2px #10231f0a;
  transition:transform .35s var(--ease),border-color .2s,background-color .25s,box-shadow .3s var(--ease),opacity .3s}
.opt:active{transform:scale(.98);transition-duration:.08s}
@media (hover:hover){.opt:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line-2))}}
.opt[aria-pressed="true"]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--raised));box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 12%,transparent)}
.opt:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{padding:12px;font-size:.95rem;min-height:58px}
.match .opt.gone{opacity:0;transform:scale(.92);pointer-events:none}
.match .opt.err{border-color:var(--bad);background:var(--bad-s);animation:nudge .4s var(--ease)}
.intro{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.intro .en{font:700 1.5rem/1.25 var(--font);letter-spacing:-.025em}
.newtag{font:650 .7rem var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--story);background:var(--story-s);padding:5px 10px;border-radius:999px;align-self:flex-start}
.done-hero{display:grid;place-items:center;width:92px;height:92px;border-radius:50%;margin:0 auto;background:var(--good);color:#fff;box-shadow:0 20px 40px -18px var(--good)}
.done-hero svg{width:44px;height:44px}

/* ---- warm-up ---- */
.timer{font:600 3.6rem/1 var(--mono);letter-spacing:-.04em;text-align:center}
.warmstep{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r-tile);background:var(--surface);box-shadow:var(--shadow)}
.warmstep .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:650 1rem var(--mono);background:var(--warm-s);color:var(--warm-d);transition:background-color .4s,color .4s}
.warmstep.done .num{background:var(--good);color:#fff}
.twister{font:700 1.42rem/1.3 var(--font);letter-spacing:-.02em;text-align:center}
.reps{display:flex;gap:7px;justify-content:center}
.reps i{width:14px;height:14px;border-radius:50%;background:var(--well);box-shadow:inset 0 0 0 1px var(--line-2);transition:background-color .3s,transform .4s var(--spring)}
.reps i.on{background:var(--warm);box-shadow:none;transform:scale(1.15)}
.passage{font:500 1.08rem/1.75 var(--font);white-space:pre-wrap}
.ringtimer{position:relative;width:180px;height:180px;margin:0 auto;display:grid;place-items:center}
.ringtimer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringtimer circle{fill:none;stroke-width:8}
.ringtimer .bgc{stroke:var(--well)} .ringtimer .fgc{stroke:var(--warm);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ringtimer .timer{font-size:2.6rem}

/* ---- story, cards, metrics, lists ---- */
.storytext{font:500 1.06rem/1.85 var(--font);white-space:pre-wrap}
.kidcard{min-height:52vh;border-radius:28px;background:var(--fam-s);border:1px solid color-mix(in srgb,var(--fam) 30%,transparent);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center;padding:24px;box-shadow:var(--shadow)}
.kidcard .en{font:700 clamp(1.8rem,7vw,3rem)/1.18 var(--font);letter-spacing:-.03em}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-tile);box-shadow:var(--shadow);padding:13px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.metric b{font:700 1.55rem var(--font);letter-spacing:-.03em}
.grid14{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.grid14 i{aspect-ratio:1;border-radius:6px;background:var(--well)}
.grid14 i.w{background:var(--warm-s);box-shadow:inset 0 0 0 1.5px var(--warm)} .grid14 i.f{background:var(--warm)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-tile);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);min-width:0;transition:background-color .2s}
.item:last-child{border-bottom:0}
.item .grow{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;line-height:1.5;overflow-wrap:anywhere}
.msg.ai{background:var(--raised);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{background:var(--primary);color:var(--on-primary);align-self:flex-end;border-bottom-right-radius:6px}
.msg.meta{align-self:stretch;max-width:100%;background:var(--story-s);font-size:.92rem}
.chat{display:flex;flex-direction:column;gap:10px}
.fix{display:grid;gap:3px;padding:10px 12px;border-radius:14px;background:var(--raised);border:1px solid var(--line)}
.fix .o{color:var(--bad);text-decoration:line-through} .fix .n{color:var(--good);font-weight:650}
.rec{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 50%,transparent);animation:recpulse 1.4s var(--ease) infinite}
@keyframes recpulse{70%{box-shadow:0 0 0 12px transparent}}
.recbar{display:flex;align-items:center;gap:3px;height:28px}
.recbar i{width:4px;border-radius:4px;background:var(--bad);height:20%;transition:height .08s}
.recbig{width:76px;height:76px;border-radius:50%;border:0;background:var(--bad);color:#fff;display:grid;place-items:center;margin:4px auto;box-shadow:0 16px 30px -14px var(--bad),inset 0 -4px 0 #0000001f;transition:transform .4s var(--spring),border-radius .4s var(--ease)}
.recbig svg{width:32px;height:32px}
.recbig:active{transform:scale(.9);transition-duration:.08s}
.recbig.on{border-radius:24px}
audio{width:100%;height:44px}

/* ---- nav: floating dark bar with sliding pill (rail on desktop) ---- */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;max-width:560px;margin:0 auto;
  background:var(--side);border-radius:24px;padding:6px;box-shadow:0 20px 40px -18px #0f2d2999,0 2px 8px #0f2d2926}
nav.tabs .in{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs .pill{position:absolute;left:0;top:0;border-radius:18px;background:var(--side-pill);transition:transform .55s var(--ease),width .55s var(--ease),height .55s var(--ease);pointer-events:none}
nav.tabs button{position:relative;z-index:1;border:0;background:transparent;border-radius:18px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 .68rem var(--font);color:var(--side-dim);transition:color .35s,transform .3s var(--ease)}
nav.tabs button:active{transform:scale(.92)}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button[aria-current="page"]{color:var(--on-side-pill)}
nav.tabs .navbrand{display:none}
@media (min-width:900px){
  nav.tabs{left:0;top:0;bottom:0;right:auto;width:var(--rail);max-width:none;margin:0;border-radius:0;padding:calc(22px + env(safe-area-inset-top,0px)) 14px 20px;box-shadow:none}
  nav.tabs .navbrand{display:flex;color:var(--on-side);padding:0 8px 22px}
  nav.tabs .navbrand i{background:var(--side-pill);color:var(--on-side-pill)}
  nav.tabs .in{grid-template-columns:1fr;gap:4px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;height:46px;font-size:.92rem;border-radius:14px}
  nav.tabs .pill{border-radius:14px}
  .view{padding-left:calc(var(--rail) + 32px);padding-right:32px;max-width:none;width:min(100%,var(--rail) + 32px + 680px);margin:0}
  .view>*{max-width:680px;width:100%}
  .topbar{margin-inline:0;padding-inline:0}
  .toast{left:calc(50% + var(--rail) / 2)}
}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.92rem;z-index:50;max-width:calc(100% - 32px);text-align:center;
  translate:-50% 0;box-shadow:var(--shadow-pop)}
.modal{position:fixed;inset:0;background:#08181547;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:40;display:grid;place-items:center;padding:16px;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0}}
.modal>.card{max-width:440px;width:100%;box-shadow:var(--shadow-pop);background:var(--raised);animation:pop .45s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.floatup{position:fixed;z-index:60;pointer-events:none;font:700 .95rem var(--font);color:var(--warm-d);background:var(--raised);padding:5px 11px;border-radius:999px;box-shadow:var(--shadow-pop)}
.webhint{display:flex;gap:10px;align-items:center}
@media (prefers-reduced-motion:reduce){*,::before,::after{transition-duration:0s!important;animation-duration:0s!important;animation-iteration-count:1!important}}
.view>.pbar{flex:none;width:100%}
@media (min-width:900px){.topbar .brand{visibility:hidden}}

/* ===================== v6: profiles, kids, quests, responsive dashboard ===================== */
:root{--bn:"Anek Bangla","Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;--kidf:"Baloo Da 2","Anek Bangla",var(--font);--gold:#e9a23b}
.bn,.kbn,.cbn{font-family:var(--bn);font-weight:450}
body.kid h1,body.kid h2,body.kid .kword,body.kid .unitban h2,body.kid .hello h1{font-family:var(--kidf);letter-spacing:-.01em;font-weight:700}
.dim{opacity:.55}
.mob-only{display:contents}
.sidecol{display:none}
.maincol{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:1180px){
  .view.dash{display:grid;grid-template-columns:minmax(0,1fr) 330px;column-gap:28px;align-items:start;width:min(100%,var(--rail) + 32px + 1060px)}
  .view.dash>.topbar,.view.dash>.warnbox{grid-column:1/-1}
  .view.dash>*{max-width:none}
  .mob-only{display:none}
  .sidecol{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
}
/* avatar */
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line-2);font-size:19px;line-height:1;flex:none}
.av.sm{width:28px;height:28px;font-size:15px}
.av.xl{width:72px;height:72px;font-size:40px;box-shadow:inset 0 0 0 1px var(--line),0 12px 24px -16px #10231f66}
.avbtn{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:2px 10px 2px 2px;border-radius:999px;font-weight:650;transition:background-color .2s,transform .3s var(--ease)}
.avbtn:active{transform:scale(.95)}
@media (hover:hover){.avbtn:hover{background:var(--well)}}
.avname{max-width:9ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:380px){.avname{display:none}.stat{padding:4px 8px 4px 6px}.stats{gap:4px}.warmchip{padding:6px 8px}}
/* quests */
.quests{gap:12px}
.quest{display:flex;align-items:center;gap:10px}
.quest .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.qic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--well);font-size:18px;flex:none;transition:background-color .4s}
.quest.done .qic{background:var(--good-s)}
.qbar{display:block;height:8px;border-radius:9px;background:var(--well);overflow:hidden}
.qbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--warm),var(--gold));transition:width .8s var(--ease)}
.quest.done .qbar i{background:var(--good)}
.btn.gold{--c:var(--gold);--on-c:#3a2400;animation:wiggle 2.4s var(--ease) infinite}
@keyframes wiggle{0%,80%,100%{rotate:0deg}85%{rotate:-2deg}90%{rotate:2deg}95%{rotate:-1deg}}
/* badges, league, stickers */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 6px;border-radius:16px;background:var(--well);opacity:.5;filter:grayscale(1)}
.badge span{font-size:28px;line-height:1.1}
.badge b{font-size:.78rem;font-weight:650}
.badge i{font-style:normal;font-size:.68rem;color:var(--muted)}
.badge.on{opacity:1;filter:none;background:color-mix(in srgb,var(--gold) 14%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 35%,transparent)}
.league{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px}
.lrow .grow{flex:1;min-width:0}
.lrow.me{background:color-mix(in srgb,var(--primary) 9%,transparent)}
.lpos{width:24px;text-align:center;font-weight:700}
.stickers{display:flex;flex-wrap:wrap;gap:8px}
.stickers span{font-size:30px;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:var(--well)}
.confetto{position:fixed;width:9px;height:14px;border-radius:2px;z-index:80;pointer-events:none}
/* welcome */
.welcome,.onb,.picker{max-width:560px;margin:0 auto;min-height:100dvh;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.wl-hero{position:relative;display:flex;flex-direction:column;gap:10px;padding-top:4vh}
.wl-hero h1{font-size:clamp(2rem,8vw,2.9rem);font-family:var(--bn);font-weight:650;letter-spacing:-.01em;line-height:1.18}
.wl-mark{width:64px;height:64px;border-radius:20px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 18px 36px -16px var(--primary)}
.wl-mark svg{width:32px;height:32px}
.floaters{position:absolute;left:84px;right:0;top:0;height:76px;pointer-events:none}
.floaters span{position:absolute;font-size:28px;animation:float 6s var(--ease) infinite;opacity:.85}
.floaters span:nth-child(1){right:4%;top:6px}.floaters span:nth-child(2){right:24%;top:30px;animation-delay:-1s}
.floaters span:nth-child(3){right:44%;top:4px;animation-delay:-2s}.floaters span:nth-child(4){right:62%;top:34px;animation-delay:-3s;font-size:22px}

/* warm-up frame animation */
.wfr{position:relative;aspect-ratio:1;width:100%;overflow:hidden;background:#ebf0ec;border-radius:inherit}
.wfr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .22s ease-out;user-select:none;-webkit-user-drag:none}
.wfr img.on{opacity:1}
.wfr.sm{width:80px;height:80px;border-radius:20px;border:1px solid var(--line)}
.wfr .dotw{position:absolute;left:39%;top:42%;width:22%;height:22%;animation:spin 2.4s linear infinite}
.wfr .dotw i{position:absolute;left:50%;top:0;width:22%;aspect-ratio:1;border-radius:50%;background:var(--warm);translate:-50% -50%;box-shadow:0 0 0 5px color-mix(in srgb,var(--warm) 35%,transparent),0 0 14px var(--warm)}
.wart-card.photo{border-radius:28px}
/* card bar + modern dropdown */
.cardbar{display:flex;align-items:center;gap:10px}
.cardcount{font:650 1rem var(--mono);min-width:54px}
.dd{position:relative;flex:1;min-width:0;display:flex;justify-content:flex-end}
.ddbtn{display:flex;align-items:center;gap:8px;max-width:100%;border:1px solid var(--line-2);background:var(--raised);border-radius:16px;padding:6px 10px 6px 14px;text-align:left;box-shadow:0 1px 2px #10231f0a;transition:border-color .2s,box-shadow .3s var(--ease),transform .3s var(--ease)}
.ddbtn:active{transform:scale(.97)}
.ddbtn[aria-expanded="true"]{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 14%,transparent)}
.ddbtn .tiny{display:none}
.ddbtn b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddchev{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .35s var(--ease)}
[aria-expanded="true"] .ddchev{transform:rotate(180deg)}
.ddscrim{position:fixed;inset:0;z-index:44}
.ddmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:45;width:min(320px,calc(100vw - 32px));max-height:min(60vh,420px);overflow:auto;padding:6px;border-radius:20px;background:var(--raised);border:1px solid var(--line);box-shadow:var(--shadow-pop);transform-origin:top right;animation:ddin .32s var(--spring)}
@keyframes ddin{from{opacity:0;transform:translateY(-6px) scale(.96)}}
.dditem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:14px;padding:10px;text-align:left;transition:background-color .2s}
@media (hover:hover){.dditem:hover{background:var(--well)}}
.dditem.on{background:color-mix(in srgb,var(--primary) 9%,transparent);color:var(--primary)}
.dditem .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.ddic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--well);font:650 .9rem var(--mono);flex:none}
.ddic .emo{width:22px;height:22px}
/* flip-card deck */
.deck{position:relative;perspective:1400px;margin:8px 0 6px}
.deckback{position:absolute;left:6%;right:6%;top:14px;bottom:-14px;border-radius:28px;background:var(--fam-s);border:1px solid color-mix(in srgb,var(--fam) 22%,transparent);box-shadow:var(--shadow)}
.deckback.b1{left:3%;right:3%;top:7px;bottom:-7px;opacity:.85}
.deckback.b2{opacity:.55}
.flip{position:relative;min-height:min(52vh,460px);transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.25,.4,1);cursor:pointer}
.flip.is-flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;padding:28px;box-shadow:var(--shadow-pop)}
.face.front{background:linear-gradient(160deg,var(--raised),var(--fam-s));border:1px solid color-mix(in srgb,var(--fam) 25%,transparent)}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,color-mix(in srgb,var(--fam) 85%,#fff),var(--fam));color:#fff}
.face .en{font:700 clamp(1.7rem,7vw,2.6rem)/1.18 var(--font);letter-spacing:-.03em}
.face .en.sm{font-size:1rem;font-weight:600;opacity:.85}
.face.back .cbn{font-size:clamp(1.5rem,6vw,2.2rem);font-weight:600;color:#fff}
.face.back .tiny{color:#ffffffcc}
.fliphint{position:absolute;bottom:16px;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--muted);background:var(--well);padding:5px 10px;border-radius:999px}
.face.back .fliphint{color:#fff;background:#ffffff2e}
.cardspk{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;border:0;background:var(--cli);color:#fff;display:grid;place-items:center;box-shadow:0 10px 20px -10px var(--cli);transition:transform .35s var(--spring)}
.cardspk:active{transform:scale(.9)}
.cardspk svg{width:22px;height:22px}
.flip.pic .cardem .emo{width:1.05em;height:1.05em}
.dots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:14px}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line-2);transition:width .35s var(--ease),background-color .3s}
.dots i.done{background:color-mix(in srgb,var(--fam) 45%,var(--line-2))}
.dots i.on{width:22px;background:var(--fam)}
/* collapsible quests */
.quests{padding:0;gap:0;overflow:hidden}
.qhead{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:14px 16px;text-align:left;transition:background-color .2s}
@media (hover:hover){.qhead:hover{background:var(--well)}}
.qhead .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.qhead .grow .tiny{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qring{position:relative;width:42px;height:42px;flex:none;display:grid;place-items:center}
.qring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.qring circle{fill:none;stroke-width:4}
.qring .qr0{stroke:var(--well)}.qring .qr1{stroke:var(--warm);stroke-linecap:round;transition:stroke-dasharray .9s var(--ease)}
.qring .emo{width:20px;height:20px}
.qlist{display:flex;flex-direction:column;gap:12px;padding:2px 16px 16px;animation:qopen .45s var(--ease)}
@keyframes qopen{from{opacity:0;transform:translateY(-6px)}}
.quests .btn.gold{margin:0 16px 16px;width:calc(100% - 32px)}
.trackbtn{padding:12px 6px}
.trackbtn b{font-size:.95rem}
.bmark{background:var(--primary)!important}.bmark svg{width:70%;height:70%}.wl-mark svg{width:60%;height:60%}
nav.tabs .navbrand i.bmark{background:#0d5c55!important}

/* ===================== v10: sidebar header/footer, collapsible rail, photo avatars, theme toggle ===================== */
:root{--rail:236px}
:root.rail-mini{--rail:84px}
.bname{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.bname small{font-size:.68rem;font-weight:500;opacity:.6;letter-spacing:0}
.railbtn{display:none}
.navfoot{display:none}
@media (min-width:900px){
  nav.tabs{display:flex;flex-direction:column;transition:width .45s var(--ease);overflow:hidden}
  nav.tabs .navbrand{align-items:center;gap:10px;padding:0 4px 20px 6px}
  .railbtn{display:grid;place-items:center;margin-left:auto;width:32px;height:32px;flex:none;border-radius:10px;border:1px solid #ffffff1f;background:#ffffff0d;color:var(--on-side);transition:background-color .2s,transform .4s var(--ease)}
  .railbtn:hover{background:#ffffff1f}
  .railbtn svg{width:17px;height:17px}
  .navfoot{display:flex;flex-direction:column;gap:12px;margin-top:auto;padding-top:14px}
  .nf-links{display:flex;flex-direction:column;gap:2px;padding-bottom:12px;border-bottom:1px solid #ffffff14}
  .nf-link{display:flex;align-items:center;gap:12px;height:40px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:var(--side-dim);font:600 .88rem var(--font);text-align:left;white-space:nowrap;transition:background-color .2s,color .2s}
  .nf-link:hover{background:#ffffff0f;color:var(--on-side)}
  .nf-link svg{width:18px;height:18px;flex:none}
  .nf-sw{margin-left:auto;width:30px;height:18px;border-radius:9px;background:#ffffff26;position:relative;flex:none;transition:background-color .3s}
  .nf-sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .35s var(--spring)}
  .nf-sw.on{background:var(--side-pill)}.nf-sw.on::after{transform:translateX(12px)}
  .nf-goal{padding:0 6px;color:var(--on-side);display:flex;flex-direction:column;gap:7px}
  .nf-goal .small{color:var(--side-dim)} .nf-goal b{color:var(--on-side)}
  .nf-bar{display:block;height:5px;border-radius:9px;background:#ffffff1a;overflow:hidden}
  .nf-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#f2aa5f,#e8782a);transition:width .9s var(--ease)}
  .nf-me{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:16px;border:1px solid #ffffff17;background:#ffffff0d;color:var(--on-side);text-align:left;transition:background-color .2s}
  .nf-me:hover{background:#ffffff17}
  .nf-me .grow{flex:1;min-width:0;display:flex;flex-direction:column}
  .nf-me b{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nf-me .tiny{opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nf-me>svg{width:16px;height:16px;flex:none;opacity:.7}
  .nf-me .av{width:36px;height:36px;font-size:20px;background:#ffffff1a;box-shadow:none}
  /* collapsed rail */
  .rail-mini nav.tabs{padding-left:12px;padding-right:12px}
  .rail-mini nav.tabs .navbrand{flex-direction:column;padding:0 0 16px;gap:12px}
  .rail-mini .bname,.rail-mini nav.tabs #tabs button span,.rail-mini .nf-link span,.rail-mini .nf-sw,.rail-mini .nf-goal,.rail-mini .nf-me .grow,.rail-mini .nf-me>svg{display:none}
  .rail-mini .railbtn{margin:0;transform:rotate(180deg)}
  .rail-mini nav.tabs #tabs button{justify-content:center;padding:0}
  .rail-mini .nf-link{justify-content:center;padding:0}
  .rail-mini .nf-me{justify-content:center;padding:6px;border:0;background:transparent}
  .view{transition:padding .45s var(--ease)}
}
/* photo avatars */
.av.photo{overflow:hidden;padding:0;background:var(--well)}
.av.photo img{width:100%;height:100%;object-fit:cover;display:block}
.avedit{position:relative;cursor:pointer;flex:none;border-radius:50%}
.avedit .camb{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);border:2px solid var(--surface);box-shadow:0 4px 10px -4px #10231f66;transition:transform .35s var(--spring)}
.avedit:hover .camb{transform:scale(1.1)}
.avedit .camb svg{width:14px;height:14px}
.photobtn{align-self:flex-start;cursor:pointer}
.photobtn svg{width:18px;height:18px}
.onb-ic .av.xl{width:84px;height:84px}
/* theme button */
.themebtn{width:36px;height:36px}
.themebtn svg{width:17px;height:17px}
@media (max-width:380px){.themebtn{width:32px;height:32px}}
/* help */
.helpsteps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
/* dark-mode polish */
:root[data-theme="dark"] .wfr,:root[data-theme="dark"] .wart-card.photo{background:#1b2a28}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wfr,:root:not([data-theme="light"]) .wart-card.photo{background:#1b2a28}}
:root[data-theme="dark"] .deckback{background:color-mix(in srgb,var(--fam) 20%,var(--surface))}
:root[data-theme="dark"] .face.front{background:linear-gradient(160deg,var(--raised),color-mix(in srgb,var(--fam) 14%,var(--raised)))}
:root[data-theme="dark"] .fliphint{background:#ffffff14}
:root[data-theme="dark"] .player .foot.ok{background:color-mix(in srgb,var(--good) 18%,var(--bg))}
:root[data-theme="dark"] .player .foot.no{background:color-mix(in srgb,var(--bad) 18%,var(--bg))}
:root[data-theme="dark"] .lvhero{background:linear-gradient(135deg,color-mix(in srgb,var(--eve) 16%,var(--surface)),color-mix(in srgb,var(--cli) 12%,var(--surface)))}
:root[data-theme="dark"] .chip.trk.kids{color:#f2c46b}
:root[data-theme="dark"] .ktile{box-shadow:0 4px 0 #ffffff14}
:root[data-theme="dark"] .btn.gold{--on-c:#2a1a00}
:root[data-theme="dark"] .advice{background:color-mix(in srgb,var(--warm) 10%,var(--surface))}



/* ===================== v11: Bangla shaping, sidebar button, segmented pill, dark switch ===================== */
/* Any letter-spacing breaks Bangla conjuncts and vowel signs (e.g. "শিখবে", "অগ্রগতি") in Chrome, so headings use normal spacing */
h1,h2,h3,.eyebrow,.wl-hero h1,.lvbig,.prompt,.fbtitle,.metric b,.cardcount,.trackbtn,.unitban h2,.hello h1,.sp-name,.bname,.tag{letter-spacing:normal}
.eyebrow{text-transform:none;font-weight:650}
.intro .en,.face .en,.kword,.twister{letter-spacing:-.02em}
/* sidebar collapse button (was squeezed to 0x0 by the nav button rule) */
@media (min-width:900px){
  nav.tabs .railbtn{display:grid;place-items:center;width:34px;height:34px;min-width:34px;padding:0;margin-left:auto;flex:none;flex-direction:row;gap:0;border-radius:11px;border:1px solid #ffffff24;background:#ffffff10;color:var(--on-side);font-size:0}
  nav.tabs .railbtn svg{width:18px;height:18px}
  nav.tabs .railbtn:hover{background:#ffffff22}
  .rail-mini nav.tabs .railbtn{margin:0 auto}
  /* real toggle switch for dark mode */
  .nf-sw{width:40px;height:22px;border-radius:999px;background:#ffffff26;box-shadow:inset 0 0 0 1px #ffffff1f}
  .nf-sw::after{top:3px;left:3px;width:16px;height:16px;box-shadow:0 2px 4px #0004}
  .nf-sw.on{background:#5cd0b4}.nf-sw.on::after{transform:translateX(18px)}
  .nf-link[data-act="toggleTheme"]{background:#ffffff08}
}
/* segmented pill sits exactly on the active button (JS adds the offset) */
.seg-pill{top:0;left:0}

/* ===================== v12: premium profile picker ===================== */
.picker2{position:relative;min-height:100dvh;overflow:hidden;color:#eaf6f2;display:flex;flex-direction:column;align-items:center;gap:26px;
  padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(32px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(90vmax 70vmax at 50% -20%,#1d7d70 0%,transparent 60%),radial-gradient(60vmax 50vmax at 100% 110%,#0f4f63 0%,transparent 60%),linear-gradient(180deg,#0c3a35,#081f1d 70%)}
.pk-glow{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(220px 220px at 15% 22%,#4fbf9333,transparent 70%),radial-gradient(260px 260px at 88% 40%,#e8782a22,transparent 70%),
  repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 44px),repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 44px);
  mask-image:radial-gradient(80% 70% at 50% 30%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(80% 70% at 50% 30%,#000 30%,transparent 80%)}
.pk-top{position:relative;display:flex;align-items:center;gap:12px;align-self:center}
.pk-logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#1a8a7d,#0d5c55);box-shadow:0 12px 24px -10px #000a,inset 0 1px 0 #ffffff33}
.pk-logo svg{width:62%;height:62%}
.pk-brand{display:flex;flex-direction:column;font:700 1.08rem/1.15 var(--font);color:#fff}
.pk-brand small{font-weight:500;font-size:.72rem;color:#bfe3d9;opacity:.8}
.pk-head{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4vh}
.pk-hi{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff1f;font:600 .85rem var(--bn);color:#d8f1ea;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pk-head h1{font:700 clamp(2.1rem,9vw,3.2rem)/1.15 var(--bn);color:#fff;letter-spacing:normal;text-shadow:0 8px 30px #0006}
.pk-head p{font:500 .95rem var(--bn);color:#b9d9d0;max-width:30ch}
.pk-grid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:640px}
@media (min-width:700px){.pk-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}}
.pk-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 12px 18px;border-radius:26px;color:#fff;text-align:center;
  background:linear-gradient(160deg,#ffffff1f,#ffffff08 60%);border:1px solid #ffffff26;box-shadow:0 24px 40px -24px #000c,inset 0 1px 0 #ffffff2e;
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);transition:transform .45s var(--spring),box-shadow .35s var(--ease),border-color .3s}
@media (hover:hover){.pk-card:hover{transform:translateY(-6px);border-color:#ffffff4d;box-shadow:0 30px 50px -24px #000e,inset 0 1px 0 #ffffff40}}
.pk-card:active{transform:scale(.96)}
.pk-ring{position:relative;padding:4px;border-radius:50%;background:conic-gradient(from 210deg,#5cd0b4,#2b9fe0,#5cd0b4);box-shadow:0 14px 30px -12px #5cd0b499}
.pk-card.kid .pk-ring{background:conic-gradient(from 210deg,#f2b632,#e8782a,#f06c90,#f2b632);box-shadow:0 14px 30px -12px #f2b63299}
.pk-ring .av.xl{width:86px;height:86px;font-size:46px;border:3px solid #0c3a35;box-shadow:none;background:#ffffff1a}
.pk-name{font:700 1.15rem var(--font);margin-top:8px;color:#fff}
.pk-role{font:600 .78rem var(--font);color:#bfe3d9;opacity:.85}
.pk-stats{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.pk-stats span{font:650 .74rem var(--font);padding:4px 9px;border-radius:999px;background:#00000033;border:1px solid #ffffff1a;color:#f3fbf8}
.pk-stats .emo{width:1.1em;height:1.1em}
.pk-last{position:absolute;top:12px;right:12px;font:600 .66rem var(--bn);padding:3px 8px;border-radius:999px;background:#5cd0b4;color:#06201c}
.pk-card.add{background:transparent;border:1.5px dashed #ffffff40;box-shadow:none;justify-content:center}
@media (hover:hover){.pk-card.add:hover{border-color:#5cd0b4;background:#5cd0b414}}
.pk-plus{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:34px;color:#5cd0b4;background:#5cd0b41a;border:1.5px solid #5cd0b455}
.pk-foot{position:relative;margin-top:auto;font:500 .78rem var(--bn);color:#9cc4b9;text-align:center}

/* ===================== v13: premium picker refinements ===================== */
.picker2{gap:22px;font-family:var(--font)}
.pk-top{gap:10px}
.pk-logo{width:38px;height:38px;border-radius:12px}
.pk-brand{font:650 1rem var(--font);letter-spacing:-.01em;color:#e8f6f1}
.pk-head{margin-top:5vh;gap:12px}
.pk-hi{font:600 .78rem var(--font);text-transform:uppercase;letter-spacing:.14em;color:#9fd9c8;background:transparent;border:0;padding:0;gap:8px}
.pk-hi i{width:7px;height:7px;border-radius:50%;background:#5cd0b4;box-shadow:0 0 0 4px #5cd0b42e,0 0 12px #5cd0b4}
.pk-head h1{font:700 clamp(2.1rem,8.6vw,3.3rem)/1.05 var(--font);letter-spacing:-.035em;max-width:12ch;
  color:#fff;text-shadow:0 10px 40px #5cd0b433}
.pk-head p{font:500 .95rem/1.5 var(--font);color:#9ec3b9}
.pk-card{border:1px solid transparent;border-radius:28px;padding:44px 12px 18px;gap:4px;
  background:linear-gradient(165deg,#173f3a,#0e2a27) padding-box,linear-gradient(150deg,#ffffff4d,#ffffff0a 38%,#ffffff05 62%,#5cd0b466) border-box;
  box-shadow:0 30px 50px -30px #000,inset 0 1px 0 #ffffff1a;overflow:hidden;-webkit-backdrop-filter:none;backdrop-filter:none}
.pk-card.kid{background:linear-gradient(165deg,#1d3d3a,#0f2a27) padding-box,linear-gradient(150deg,#f2b63299,#ffffff0a 38%,#ffffff05 62%,#f06c9077) border-box}
.pk-card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff17 50%,transparent 65%);transform:translateX(-120%);animation:pkShine 1.6s .6s var(--ease) forwards;pointer-events:none}
@keyframes pkShine{to{transform:translateX(120%)}}
.pk-ring{padding:3px;animation:pkSpin 8s linear infinite;background:conic-gradient(from 0deg,#5cd0b4,#2b9fe0,#a996ee,#5cd0b4)}
.pk-card.kid .pk-ring{background:conic-gradient(from 0deg,#f2b632,#e8782a,#f06c90,#f2b632)}
.pk-ring .av.xl{animation:pkSpin 8s linear infinite reverse;width:92px;height:92px;border:4px solid #11302c}
@keyframes pkSpin{to{rotate:360deg}}
.pk-name{font:700 1.2rem var(--font);letter-spacing:-.02em;margin-top:12px}
.pk-role{font:600 .7rem var(--font);text-transform:uppercase;letter-spacing:.12em;color:#8fbfb2}
.pk-stats{gap:0;margin-top:14px;width:100%;border-top:1px solid #ffffff14;padding-top:12px}
.pk-stats span{flex:1;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:1px;font:500 .66rem var(--font);color:#8fbfb2;text-transform:uppercase;letter-spacing:.06em}
.pk-stats span+span{border-left:1px solid #ffffff14}
.pk-stats em{font:700 1.05rem var(--font);font-style:normal;color:#fff;letter-spacing:-.02em;text-transform:none}

@media (prefers-reduced-motion:reduce){.pk-ring,.pk-ring .av.xl,.pk-card::after{animation:none}}

/* ===================== v14: picker background, switch-profile button ===================== */

.picker2{min-height:100vh;min-height:100dvh}
.tb-left{display:flex;align-items:center;gap:6px;min-width:0}

  background:linear-gradient(160deg,var(--raised),var(--surface));box-shadow:0 1px 2px #10231f0f,0 8px 18px -12px #10231f55;transition:transform .35s var(--spring),box-shadow .3s,border-color .2s}

.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--raised);color:var(--ink);font:650 .95rem var(--font);box-shadow:0 1px 2px #10231f14,0 8px 18px -14px #10231f55;transition:transform .3s var(--spring),box-shadow .3s}
.gbtn.wide{width:100%}
.gbtn:active{transform:scale(.97)}
@media (hover:hover){.gbtn:hover{box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 12%,transparent),0 8px 18px -14px #10231f55}}
.gbtn:disabled{opacity:.6}
.orline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line-2)}
.acct .row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.acct .av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.okchip{background:var(--good-s);color:var(--good)}
.pk-top{width:100%;max-width:640px;justify-content:center;position:relative}
.pk-acct{position:absolute;right:0;top:50%;translate:0 -50%;display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff24;color:#dff3ec;font:600 .72rem var(--font)}

.pk-acct.signin{padding:6px 12px 6px 8px;background:#fff;color:#1f2a28;border-color:transparent;cursor:pointer}

/* ===================== v16: login page ===================== */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(28px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));background:var(--raised)}
:root[data-theme="dark"] .login{background:var(--bg)}
.lg-brand{display:flex;align-items:center;gap:12px}
.lg-logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#137a70,#0d5c55);box-shadow:0 14px 26px -14px #0d5c55}
.lg-logo svg{width:62%;height:62%}
.lg-name{font:700 2rem var(--font);letter-spacing:-.035em;color:var(--ink)}
.lg-tag{font:600 1.05rem var(--font);color:var(--muted);margin-bottom:18px}
.lg-card{width:100%;max-width:420px;border:1px solid var(--line-2);border-radius:20px;padding:26px 22px 22px;background:var(--surface);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px -34px #10231f66}
.lg-card h1{text-align:center;font:700 1.6rem var(--font);color:var(--ink)}
.lg-seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:5px;border-radius:16px;background:var(--well);border:1px solid var(--line)}
.lg-seg button{position:relative;z-index:1;border:0;background:none;min-height:44px;border-radius:12px;font:600 .98rem var(--font);color:var(--faint);transition:color .3s}
.lg-seg button[aria-pressed="true"]{color:var(--ink)}
.lg-pill{position:absolute;top:5px;left:5px;width:calc(50% - 5px);height:calc(100% - 10px);border-radius:12px;background:var(--raised);box-shadow:0 2px 8px #10231f1a;transition:transform .45s var(--ease)}
.lg-pill.r{transform:translateX(100%)}
.lg-field{display:flex;flex-direction:column;gap:7px}
.lg-field span{font:700 1rem var(--font);color:var(--ink)}
.lg-field input{min-height:54px;border:1.5px solid var(--line-2);border-radius:12px;padding:0 16px;font:500 1rem var(--font);background:var(--raised)}
.lg-field input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 14%,transparent);outline:none}
.lg-go{min-height:54px;border:0;border-radius:12px;background:#f8c934;color:#1a1500;font:700 1rem var(--font);letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 12px 22px -14px #c99a00;transition:transform .3s var(--spring),filter .2s}
.lg-go span{font-size:1.5rem;line-height:1;margin-top:-3px}
.lg-go:active{transform:scale(.97)}
@media (hover:hover){.lg-go:hover{filter:brightness(1.04)}}
.lg-go:disabled{opacity:.7}
.lg-links{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.lg-links i{color:var(--faint);font-style:normal}
.lg-link{border:0;background:none;color:var(--muted);font:500 .98rem var(--font);text-decoration:underline;text-underline-offset:3px;padding:4px}
.lg-err{padding:10px 12px;border-radius:12px;background:var(--bad-s);color:var(--bad);font-size:.9rem}
.lg-ok{padding:10px 12px;border-radius:12px;background:var(--good-s);color:var(--good);font-size:.9rem}
.lg-foot{margin-top:14px;color:var(--faint);font-size:.82rem}
.pk-logout{position:relative;border:0;background:none;color:#9cc4b9;font:500 .78rem var(--font);text-decoration:underline;text-underline-offset:3px}
/* topbar on phones: never overlap */
.topbar{gap:8px}
.tb-left{flex:none}
.topbar .stats{min-width:0;flex-wrap:nowrap;justify-content:flex-end}
@media (max-width:520px){.topbar .themebtn{display:none}}
@media (max-width:400px){.warmchip.ok{font-size:0;gap:0;padding:7px}.warmchip.ok svg{width:14px;height:14px}.topbar .stat{padding:4px 9px 4px 6px}}
/* kids: pictures made of several emoji (e.g. three ducks) stay inside one square tile */
.kgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.ktile{min-width:0;overflow:hidden;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2%}
.ktile:has(.emo+.emo) .emo{width:30%;height:30%}
.kemoji:has(.emo+.emo),.cardem:has(.emo+.emo){display:flex;flex-wrap:wrap;justify-content:center;max-width:90vw}
.kemoji:has(.emo+.emo) .emo,.cardem:has(.emo+.emo) .emo{width:.55em;height:.55em}
.nem:has(.emo+.emo) .emo,.ddic:has(.emo+.emo) .emo,.pem:has(.emo+.emo) .emo{width:40%;height:40%}

/* v17: path flow (sticky unit header, START bubble, chest, jump button), lesson feel (tile slots, combo, cheer, waveform, dictation, result badges) */
.unitsec{position:relative;margin-bottom:6px}
.unitsec .unitban{position:sticky;top:calc(var(--tbh,62px) + 4px);z-index:4;box-shadow:0 10px 24px -18px #10231f80}
.unitsec.locked .unitban{filter:saturate(.25) brightness(1.02);opacity:.9}
.unitsec.locked .path{opacity:.75}
.nodewrap{position:relative}
.nodewrap.cur::before{content:"START";position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:2;font:800 .78rem var(--font);letter-spacing:.06em;color:var(--primary);
  background:var(--raised);border:2px solid var(--line-2);border-radius:12px;padding:5px 12px;white-space:nowrap;box-shadow:0 6px 14px -8px #10231f55;animation:startbob 1.6s ease-in-out infinite}
.nodewrap.cur::after{content:"";position:absolute;left:50%;top:23px;width:10px;height:10px;background:var(--raised);border-right:2px solid var(--line-2);border-bottom:2px solid var(--line-2);transform:translateX(-50%) rotate(45deg);z-index:2;animation:startbob2 1.6s ease-in-out infinite}
body.kid .nodewrap.cur::before{color:var(--warm-d,#b86a00)}
@keyframes startbob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
@keyframes startbob2{0%,100%{transform:translate(-50%,0) rotate(45deg)}50%{transform:translate(-50%,-6px) rotate(45deg)}}
.nodewrap.cur{padding-top:42px}
/* chest */
.chestwrap{display:flex;flex-direction:column;align-items:center;margin:8px 0 4px}
.chest{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:600 .8rem var(--font);color:var(--muted)}
.chest-ic{width:74px;height:66px;display:grid;place-items:center;font-size:44px;border-radius:22px;background:var(--well);box-shadow:inset 0 -5px 0 #0000000f;transition:transform .4s var(--spring)}
.chest-ic img.emo{width:48px;height:48px}
.chest.lock .chest-ic{filter:grayscale(1);opacity:.6}
.chest.ready .chest-ic{background:linear-gradient(160deg,#ffe28a,#ffb547);box-shadow:0 14px 28px -14px #e08a00,inset 0 -5px 0 #0000001a;animation:chestwiggle 2.2s ease-in-out infinite}
.chest.ready{color:var(--warm-d,#b86a00)}
.chest.opened .chest-ic{background:var(--good-s)}
.chest:active .chest-ic{transform:scale(.9)}
@keyframes chestwiggle{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-7deg) scale(1.05)}82%{transform:rotate(7deg) scale(1.05)}89%{transform:rotate(-4deg)}}
/* jump to current lesson */
.jumpcur{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;width:52px;height:52px;border-radius:16px;border:2px solid var(--line-2);
  background:var(--raised);color:var(--primary);display:grid;place-items:center;box-shadow:0 12px 26px -12px #10231f66,inset 0 -4px 0 var(--line);cursor:pointer;animation:jumpin .45s var(--spring)}
.jumpcur[hidden]{display:none}
.jumpcur.up svg{transform:rotate(180deg)}
.jumpcur svg{transition:transform .35s var(--spring)}
.jumpcur:active{transform:scale(.9)}
@media (min-width:900px){.jumpcur{bottom:28px;right:calc(28px + max(0px,(100vw - 1240px)/2))}}
@keyframes jumpin{from{opacity:0;transform:scale(.6) translateY(12px)}to{opacity:1;transform:none}}
/* lesson head: combo */
.player .head{position:relative}
.combo{flex:none;font:800 .85rem var(--font);color:#e8590c;background:#fff1e6;border-radius:999px;padding:4px 10px;animation:combopop .5s var(--spring)}
:root[data-theme="dark"] .combo{background:#3a2210;color:#ffa45c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .combo{background:#3a2210;color:#ffa45c}}
@keyframes combopop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.pbar.hot i{background:linear-gradient(90deg,#ffb347,#ff7a1a)}
.pbar.hot i::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 20%,#ffffff70 45%,transparent 70%);background-size:200% 100%;animation:pshine 1.6s linear infinite}
@keyframes pshine{from{background-position:150% 0}to{background-position:-50% 0}}
.hardtag{align-self:flex-start;font:700 .75rem var(--font);color:#b4235a;background:#ffe4ee;border-radius:999px;padding:4px 10px;margin-bottom:4px}
:root[data-theme="dark"] .hardtag{background:#3d1424;color:#ff8fb6}
/* tiles leave a grey slot */
.bank .tile.used{opacity:1;transform:none;background:var(--well);color:transparent;border-color:transparent;box-shadow:none}
.tile{will-change:transform}
/* waveform inside mic / dictation */
.wave{display:inline-flex;align-items:center;gap:3px;height:28px}
.wave i{width:4px;height:8px;border-radius:4px;background:currentColor;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}.wave i:nth-child(6){animation-delay:.6s}.wave i:nth-child(7){animation-delay:.72s}
@keyframes wv{0%,100%{height:6px}50%{height:26px}}
.micbig.on{color:#fff}
.dictbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line-2);background:var(--raised);color:var(--primary);border-radius:14px;padding:9px 14px;font:650 .9rem var(--font);cursor:pointer;box-shadow:0 2px 0 var(--line-2)}
.dictbtn svg{width:18px;height:18px}
.dictbtn .wave{height:18px}.dictbtn .wave i{width:3px}
@keyframes wv2{0%,100%{height:4px}50%{height:16px}}
.dictbtn .wave i{animation-name:wv2}
.dictbtn.on{background:var(--primary);color:#fff;border-color:transparent}
/* mid-lesson cheer */
.body.cheer{justify-content:center;align-items:center;gap:22px;text-align:center}
.cheer-hero{position:relative;width:150px;height:150px;display:grid;place-items:center}
.cheer-em{font-size:96px;line-height:1;animation:cheerbob 2s ease-in-out infinite;position:relative;z-index:1}
.cheer-em img.emo{width:120px;height:120px}
.cheer-ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--warm) 35%,transparent),transparent 68%);animation:cheerglow 2s ease-in-out infinite}
@keyframes cheerbob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes cheerglow{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.1);opacity:1}}
.bubble{position:relative;max-width:340px;background:var(--raised);border:2px solid var(--line-2);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;animation:combopop .55s .15s var(--spring) backwards}
.bubble::before{content:"";position:absolute;left:50%;top:-9px;width:16px;height:16px;background:var(--raised);border-left:2px solid var(--line-2);border-top:2px solid var(--line-2);transform:translateX(-50%) rotate(45deg)}
.bubble b{font-size:1.25rem}
/* result badges */
.rbadges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:420px;margin:0 auto}
.rb{--c:#f0a500;min-width:0;border:2.5px solid var(--c);border-radius:18px;overflow:hidden;background:var(--raised);display:flex;flex-direction:column;opacity:0;animation:rbin .6s var(--spring) forwards}
.rb .rbt{background:var(--c);color:#fff;font:800 .68rem var(--font);letter-spacing:.06em;padding:5px 8px}
.rb b i{font-style:normal}
.rb b{padding:12px 6px 14px;font-size:1.3rem;color:var(--c);display:flex;align-items:center;justify-content:center;gap:6px}
.rb b img.emo{width:22px;height:22px}
.rb.xp{--c:#f0a500;animation-delay:.35s}.rb.acc{--c:#2fb86b;animation-delay:.6s}.rb.tm{--c:#3b8ef0;animation-delay:.85s}
@keyframes rbin{from{opacity:0;transform:translateY(18px) scale(.7)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rb{opacity:1;animation:none}.nodewrap.cur::before,.nodewrap.cur::after,.chest.ready .chest-ic,.cheer-em,.cheer-ring{animation:none}}

/* done screen: content scrolls, Continue stays in the footer */
.player .body.donebody{justify-content:safe center;align-items:center;text-align:center;gap:14px;padding-top:max(28px,env(safe-area-inset-top,0px));padding-bottom:120px}
.donebody .sticker-win{flex:none;width:104px;height:104px;border-radius:30px}
.donebody .sticker-win span{font-size:62px}
.donebody h1{margin:0}
.rb .rbt{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.rb b{font-size:1.1rem}.rb .rbt{font-size:.6rem}}
.revise{width:100%;max-width:460px;display:flex;flex-direction:column;gap:8px}
.revchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.revchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-2);background:var(--raised);border-radius:999px;padding:7px 13px 7px 10px;font:600 .95rem var(--font);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line-2)}
.revchip svg{width:16px;height:16px;color:var(--primary)}
.revchip:active{transform:scale(.94)}

/* ===== Duolingo-style tactile motion, in our look ===== */
/* 3D pressable path nodes: a solid lip that squashes when pressed */
.node{box-shadow:0 7px 0 color-mix(in srgb,var(--c) 70%,#000 30%),0 18px 26px -14px color-mix(in srgb,var(--c) 80%,transparent),inset 0 2px 0 #ffffff40;transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 70%,#000 30%),0 6px 12px -8px color-mix(in srgb,var(--c) 80%,transparent),inset 0 2px 0 #ffffff40;transition-duration:.06s}
.node.lock{box-shadow:0 7px 0 var(--line-2),inset 0 0 0 1px var(--line-2)}
.node.lock:active{box-shadow:0 1px 0 var(--line-2)}
@media (hover:hover){.node:not(.lock):hover{filter:brightness(1.06)}.node:hover svg,.node:hover .nem{animation:iconwig .5s var(--ease)}}
@keyframes iconwig{0%,100%{transform:none}30%{transform:rotate(-10deg) scale(1.1)}65%{transform:rotate(8deg) scale(1.05)}}
.node.cur{animation:curbreath 2.6s ease-in-out infinite}
.node.cur:active{animation:none}
@keyframes curbreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.node.done svg{animation:donepop 4s ease-in-out infinite}
.nodewrap:nth-child(3n) .node.done svg{animation-delay:1.3s}.nodewrap:nth-child(3n+1) .node.done svg{animation-delay:2.6s}
@keyframes donepop{0%,88%,100%{transform:none}92%{transform:scale(1.25) rotate(-8deg)}96%{transform:scale(.95)}}
/* buttons in lessons press down too */
.player .foot .btn.good,.player .foot .btn.bad,.lg-go{box-shadow:0 5px 0 #0000004d;transition:transform .12s,box-shadow .12s}
.player .foot .btn.good:active,.player .foot .btn.bad:active,.lg-go:active{transform:translateY(4px);box-shadow:0 1px 0 #0000004d}
.tile{box-shadow:0 3px 0 var(--line-2)}
.tile:active{transform:translateY(3px);box-shadow:0 0 0 var(--line-2)}
/* path buddies */
.path{position:relative}
.palrow{height:0;width:100%;display:flex;justify-content:center;position:relative;z-index:1}
.pathpal{position:relative;top:-10px;transform:translateX(var(--x));border:0;background:none;padding:0;cursor:pointer;width:96px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.palbody{font-size:70px;line-height:1;display:block;animation:palfloat 3.2s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 100%}
.palbody img.emo{width:84px;height:84px;filter:drop-shadow(0 12px 14px #10231f30)}
.pathpal.r .palbody{animation-name:palfloatR}
.palshadow{width:56px;height:10px;border-radius:50%;background:#10231f22;margin-top:4px;animation:palshadow 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes palfloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes palfloatR{0%,100%{transform:translateY(0) rotate(3deg)}50%{transform:translateY(-10px) rotate(-3deg)}}
@keyframes palshadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.75);opacity:.6}}
.unitsec.locked .pathpal{filter:grayscale(.9);opacity:.6}
@media (max-width:360px){.pathpal{width:80px}.palbody img.emo{width:66px;height:66px}}
/* sidebar / nav icons */

/* streak flame flickers when lit */
.flame:not(.off) svg{animation:flick 1.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.08,.95) rotate(-4deg)}50%{transform:scale(.96,1.06) rotate(3deg)}75%{transform:scale(1.05,.97) rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){.node.cur,.node.done svg,.palbody,.palshadow,.flame svg{animation:none!important}}

  animation:popdrop .42s var(--spring);transform-origin:calc(50% + var(--ax,0px)) -10px}
.startpop::before{content:"";position:absolute;top:-8px;left:calc(50% + var(--ax,0px));width:18px;height:18px;background:color-mix(in srgb,var(--c) 88%,#fff);border-radius:3px;transform:translateX(-50%) rotate(45deg)}
.startpop.kids{--c:var(--gold)}.startpop.family{--c:var(--fam)}.startpop.client{--c:var(--cli)}.startpop.everyday{--c:var(--eve)}.startpop.storyp{--c:var(--story)}

@keyframes popdrop{0%{opacity:0;transform:scale(.6) translateY(-14px)}100%{opacity:1;transform:none}}

/* v18: modern playful buttons for everyone + a colourful, funny kids mode */

/* ---------- buttons: chunky, tactile, a little bouncy ---------- */
.btn{--lip:color-mix(in srgb,var(--c) 68%,#000 32%);border-radius:16px;min-height:50px;font-weight:750;letter-spacing:.01em;
  box-shadow:0 4px 0 var(--lip),0 12px 22px -14px color-mix(in srgb,var(--c) 90%,transparent),inset 0 1px 0 #ffffff38;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 88%,#fff),var(--c) 60%);

@media (hover:hover){.btn:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 5px 0 var(--lip),0 16px 26px -14px color-mix(in srgb,var(--c) 90%,transparent),inset 0 1px 0 #ffffff38}}
.btn:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 var(--lip),0 4px 10px -8px color-mix(in srgb,var(--c) 90%,transparent),inset 0 1px 0 #ffffff38;transition-duration:.06s}

@media (hover:hover){.btn.ghost:not(:disabled):hover{box-shadow:0 4px 0 var(--lip);background:var(--raised)}}
.btn.ghost:not(:disabled):active{box-shadow:0 0 0 var(--lip)}

@media (hover:hover){.btn:not(:disabled):hover svg{transform:scale(1.15) rotate(-6deg)}}
.icon-btn{transition:transform .25s var(--spring)}
.icon-btn:active{transform:scale(.86)}

/* rainbow path: each lesson its own candy colour */
