/* ================= environment ================= */
const WEB_URL="/*__WEB_URL__*/";
const ENV={claude:!!window.claude, ai:null, aiState:"off", micOk:!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder&&window.isSecureContext)};
if(ENV.claude) ENV.micOk=false; // artifact pages cannot use the microphone

/*__VOICE__*/
const fill=s=>String(s).replace(/\{d1\}/g,S.names.d1||"sweetie").replace(/\{d2\}/g,S.names.d2||"baby");
const fillBn=s=>String(s).replace(/\{d1\}/g,S.names.d1||"সোনা").replace(/\{d2\}/g,S.names.d2||"বাবু");

/* ================= state & storage ================= */
function defaultState(){return {v:4,names:{d1:"",d2:""},goal:30,warmReq:true,warmMode:"full",rate:.9,autoplay:true,sound:true,onboarded:true,
  xp:0,days:{},done:{},storyDone:{},srs:{},recs:[],stats:{c:0,t:0},warmCount:0,badges:[],stickers:[],best:0,perfect:0,speakTotal:0,created:new Date().toISOString()};}
let S=defaultState(), CUSTOM={}, MARKS={}, ASSESS=null;
const aliProfile=()=>({id:"ali",name:"Ali",avatar:"🧑🏽‍💻",age:"adult",goals:["family","client","everyday"],created:new Date().toISOString()});
const Store={
 mode:"local", db:null, uid:null, chain:Promise.resolve(), timer:null, failed:false,
 docName(){return PID==="ali"?"duo":"duo_"+PID;},
 base(){return this.db.doc(`data/users/${this.uid}/${this.docName()}`);},
 lsGet(k){try{return JSON.parse(localStorage.getItem("aec4:"+k)||"null");}catch(e){return null;}},
 lsSet(k,v){try{localStorage.setItem("aec4:"+k,JSON.stringify(v));return true;}catch(e){return false;}},
 pk(k){return "p:"+PID+":"+k;},
 async init(){
   if(ENV.claude){
     claude.use("sample").then(s=>{ENV.ai=s;ENV.aiState=s?"ready":"off";render();});
     const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
     const id=user?await user.id():null;
     if(db&&id){this.mode="cloud";this.db=db;this.uid=id;}
   }
 },
 async loadProfiles(){
   if(this.mode==="cloud"){
     const [pd,as]=await Promise.all([this.db.doc(`data/users/${this.uid}/profiles`).get(),this.db.doc(`data/users/${this.uid}/assessment`).get()]);
     if(as.exists&&as.data().status==="done")ASSESS=clone(as.data().result);
     if(pd.exists){PROFILES=clone(pd.data().list||[]);PID=pd.data().active||null;}
     else{const old=await this.db.doc(`data/users/${this.uid}/duo`).get();if(old.exists){PROFILES=[aliProfile()];PID="ali";await this.saveProfiles();}}
   }else{
     PROFILES=this.lsGet("profiles")||[];PID=this.lsGet("active");
     if(!PROFILES.length){let old=null;try{old=localStorage.getItem("aec3:state");}catch(e){}
       if(old){PROFILES=[aliProfile()];PID="ali";try{["state","units","marks"].forEach(k=>{const v=localStorage.getItem("aec3:"+k);if(v)localStorage.setItem("aec4:p:ali:"+k,v);});}catch(e){}this.saveProfiles();}}
   }
   if(PID&&!prof())PID=null;
 },
 saveProfiles(){
   this.lsSet("active",PID);
   if(this.mode==="cloud")return this.db.doc(`data/users/${this.uid}/profiles`).set({list:clone(PROFILES),active:PID}).catch(()=>{});
   this.lsSet("profiles",PROFILES);return Promise.resolve();
 },
 async load(){
   S=defaultState();CUSTOM={};MARKS={};if(!PID)return;
   if(this.mode==="cloud"){
     const [st,units,marks]=await Promise.all([this.base().get(),this.base().collection("units").get(),this.base().collection("marks").get()]);
     if(st.exists)S=Object.assign(defaultState(),clone(st.data()));
     units.docs.forEach(d=>CUSTOM[d.id]=clone(d.data()));
     marks.docs.forEach(d=>MARKS[d.id]=clone(d.data()));
   }else{
     const st=this.lsGet(this.pk("state"));if(st)S=Object.assign(defaultState(),st);
     CUSTOM=this.lsGet(this.pk("units"))||{};MARKS=this.lsGet(this.pk("marks"))||{};
   }
   if(!warmAllowed())S.warmReq=false;
 },
 save(){clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),500);},
 flush(){
   if(!PID)return this.chain;
   clearTimeout(this.timer);
   S.best=Math.max(S.best||0,streak());
   const p=prof();if(p){p.wk=p.wk||{};p.wk[weekKey()]=weekXP(S);p.xp=S.xp;p.streak=streak();p.last=today();}
   S.updatedAt=Date.now();const body=clone(S),key=this.pk("state"),base=this.mode==="cloud"?this.base():null;
   this.chain=this.chain.then(async()=>{
     if(base)await base.set(body);
     else if(!this.lsSet(key,body))throw {code:"local_full"};
     await this.saveProfiles();
     if(this.mode!=="cloud")CLOUD.queue();
     if(this.failed){this.failed=false;render();}
   }).catch(()=>{this.failed=true;render();});
   return this.chain;
 },
 async saveUnit(u){CUSTOM[u.id]=u;if(this.mode==="cloud")await this.base().collection("units").doc(u.id).set(clone(u));else this.lsSet(this.pk("units"),CUSTOM);},
 async delUnit(id){delete CUSTOM[id];if(this.mode==="cloud")await this.base().collection("units").doc(id).delete();else this.lsSet(this.pk("units"),CUSTOM);},
 async delProfile(id){
   if(this.mode==="cloud"){try{await this.db.doc(`data/users/${this.uid}/${id==="ali"?"duo":"duo_"+id}`).delete();}catch(e){}}
   else try{["state","units","marks"].forEach(k=>localStorage.removeItem("aec4:p:"+id+":"+k));}catch(e){}
 }
};
function day(d){d=d||today();return S.days[d]||(S.days[d]={xp:0,warm:false,warmMin:0,lessons:0,practice:0,c:0,t:0,speak:0,story:0,cards:0});}
function addXP(n){S.xp+=n;day().xp+=n;}
function streak(){let n=0;let d=new Date();const ok=k=>{const r=S.days[k];return r&&(r.lessons+r.practice)>0;};if(!ok(dstr(d)))d.setDate(d.getDate()-1);while(ok(dstr(d))){n++;d.setDate(d.getDate()-1);}return n;}
function warmToday(){return !!S.days[today()]?.warm;}

function allUnits(){return [...COURSE.units,...Object.values(CUSTOM).sort((a,b)=>(a.created||"").localeCompare(b.created||""))];}
function unitById(id){return allUnits().find(u=>u.id===id);}
function nodesOf(track){const out=[];allUnits().filter(u=>u.track===track).forEach(u=>{u.lessons.forEach((l,i)=>out.push({type:"lesson",u,li:i,key:u.id+":"+i}));out.push({type:"story",u,key:u.id+":story"});});return out;}
function nodeDone(n){return n.type==="lesson"?!!S.done[n.key]:!!S.storyDone[n.u.id]?.read;}
function nodeStates(track){const ns=nodesOf(track);let prevDone=true;let curFound=false;return ns.map(n=>{const done=nodeDone(n);const unlocked=prevDone||n.u.custom;let st=done?"done":unlocked?(curFound?"open":"cur"):"lock";if(st==="cur")curFound=true;prevDone=done;return Object.assign(n,{st});});}
function lessonItems(u,li){return u.lessons[li].items.map((it,i)=>({id:u.id+":"+li+":"+i,en:fill(it[0]),bn:fillBn(it[1]),em:it[2]||"",track:u.track}));}
function allItems(){const out=[];allUnits().forEach(u=>u.lessons.forEach((l,li)=>out.push(...lessonItems(u,li))));return out;}
function itemById(id){const [uid,li,i]=id.split(":");const u=unitById(uid);if(!u||!u.lessons[li])return null;return lessonItems(u,+li)[+i]||null;}

function srsUpdate(id,ok){const r=S.srs[id]||(S.srs[id]={box:0,r:0,w:0});r.last=today();if(ok){r.box=Math.min(r.box+1,IV.length-1);r.r++;}else{r.box=0;r.w++;}r.due=addDays(IV[r.box]);}

const CONTR={"i'm":"i am","it's":"it is","don't":"do not","can't":"cannot","won't":"will not","i'll":"i will","you're":"you are","let's":"let us","that's":"that is","there's":"there is","i've":"i have","i'd":"i would","we're":"we are","isn't":"is not","doesn't":"does not","didn't":"did not","what's":"what is","here's":"here is","they're":"they are","you'd":"you would","how's":"how is","we'll":"we will","she's":"she is","he's":"he is","aren't":"are not","wasn't":"was not","weren't":"were not","couldn't":"could not","shouldn't":"should not","wouldn't":"would not","haven't":"have not","hasn't":"has not","you've":"you have","we've":"we have","they've":"they have","you'll":"you will","it'll":"it will","she'll":"she will","they'll":"they will","i'd":"i would","we'd":"we would","who's":"who is","where's":"where is"};
function norm(s,expand){let t=String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s-]/g," ").replace(/-/g," ").replace(/\s+/g," ").trim();if(expand)t=t.split(" ").map(w=>CONTR[w]||w).join(" ");return t;}
function words(s){return String(s).replace(/[“”"]/g,"").split(/\s+/).map(w=>w.replace(/^[^\w']+|[^\w']+$/g,"")).filter(Boolean);}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
const STOP=new Set(["the","a","an","to","and","or","of","in","on","is","are","it","i","you","me","my","your","we","for","at","be","do","with","this","that","so","but","please","now","can","will"]);

/* ================= exercise builder ================= */
function makeExercises(items,pool,isNew){
  if(items[0]&&items[0].track==="kids")return makeKid(items,pool,isNew);
  const ex=[];
  items.forEach((it,i)=>{if(isNew&&!S.srs[it.id])ex.push({t:"intro",it});ex.push({t:i%2?"build":"meaning",it});});
  if(items.length>=3)ex.push({t:"match",items:pick(items,Math.min(5,items.length))});
  const second=HEAR.avail()?["listen","speak","fill","type","build","speak"]:["listen","fill","type","build","speak","listen"];
  shuffle(items).forEach((it,i)=>{let t=second[i%second.length];if(t==="listen"&&!TTS.ok)t="build";if(t==="fill"&&!fillWord(it))t="type";ex.push({t,it});});
  return ex.map(e=>prepare(e,pool));
}
function makeKid(items,pool,isNew){
  const kp=pool.filter(p=>p.track==="kids"&&p.em),ex=[];
  items.forEach(it=>{if(isNew&&!S.srs[it.id])ex.push({t:"kintro",it});ex.push({t:"kpick",it});});
  shuffle(items).slice(0,3).forEach(it=>ex.push({t:"kfind",it}));
  if(HEAR.avail())shuffle(items).slice(0,3).forEach(it=>ex.push({t:"ksay",it}));
  else shuffle(items).slice(0,2).forEach(it=>ex.push({t:"ksay",it}));
  return ex.map(e=>{
    const unit=e.it.id.split(":")[0];const others=kp.filter(o=>o.id!==e.it.id&&o.em!==e.it.em);
    const ordered=[...shuffle(others.filter(o=>o.id.startsWith(unit+":"))),...shuffle(others.filter(o=>!o.id.startsWith(unit+":")))];
    const need=e.t==="kfind"?5:2,uniq=[];for(const o of ordered){if(!uniq.some(u=>u.em===o.em))uniq.push(o);if(uniq.length>=need)break;}
    e.opts=shuffle([e.it,...uniq]);e.wrong=[];return e;});
}
function fillWord(it){const ws=words(it.en);const cand=ws.filter(w=>w.length>=3&&!STOP.has(w.toLowerCase()));return cand.sort((a,b)=>b.length-a.length)[0]||null;}
function prepare(e,pool){
  const others=pool.filter(p=>e.it?p.id!==e.it.id:true);
  if(e.t==="meaning"){const ds=pick(others.filter(o=>o.bn!==e.it.bn),2).map(o=>o.bn);e.opts=shuffle([e.it.bn,...ds]);}
  if(e.t==="build"||e.t==="listen"){const target=words(e.it.en);const tl=new Set(target.map(w=>w.toLowerCase()));const extra=pick([...new Set(others.flatMap(o=>words(o.en)))].filter(w=>!tl.has(w.toLowerCase())),Math.min(3,Math.max(2,Math.round(target.length/3))));e.tiles=shuffle([...target,...extra]);e.sel=[];}
  if(e.t==="fill"){const w=fillWord(e.it);e.word=w;const re=new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b");e.blanked=e.it.en.replace(re,"_____");const ds=pick([...new Set(others.flatMap(o=>words(o.en)))].filter(x=>x.length>=3&&x.toLowerCase()!==w.toLowerCase()&&!STOP.has(x.toLowerCase())),2);e.opts=shuffle([w,...ds]);}
  if(e.t==="match"){e.left=shuffle(e.items.map(x=>({id:x.id,txt:x.en})));e.right=shuffle(e.items.map(x=>({id:x.id,txt:x.bn})));e.gone=[];e.errs=0;}
  return e;
}

/* ================= lesson session ================= */
let L=null; // active session
function startSession(kind,items,meta){
  const pool=allItems();
  const ex=makeExercises(items,pool.length>=6?pool:items,kind==="lesson");
  L=Object.assign({kind,items,ex,i:0,total:ex.length,answer:null,fb:null,mistakes:{},c:0,t:0,started:Date.now(),done:false},meta||{});
  render();playIfAuto();
}
function cur(){return L.ex[L.i];}
function playIfAuto(){const e=L&&cur();if(!e)return;if(e.it&&(["kintro","kpick","kfind","ksay"].includes(e.t)||(S.autoplay&&["intro","listen","meaning","speak"].includes(e.t))))setTimeout(()=>{if(L&&cur()===e)TTS.say(e.it.en);},350);}
function isSpeakEx(e){return e&&(e.t==="speak"||e.t==="ksay");}
function speakPass(){const e=cur();L.combo=(L.combo||0)+1;L.best=Math.max(L.best||0,L.combo);skillHit(e.t,true);L.t++;L.c++;day().t++;day().c++;S.stats.t++;S.stats.c++;day().speak=(day().speak||0)+1;S.speakTotal=(S.speakTotal||0)+1;L.fb={ok:true,show:"",bn:""};SND.play("ok");render();}
function hearNow(){
  const e=cur();if(!e||L.fb)return;e.hs=e.hs||{tries:0};
  if(HEAR.on){HEAR.stop();e.hs.state=null;render();return;}
  e.hs.state="listen";e.hs.err=null;TTS.stop();render();
  const need=e.t==="ksay"?.5:.75;let done=false,quiet=null,last={text:"",score:0};
  const finish=(err,b)=>{if(done)return;done=true;clearTimeout(quiet);HEAR.stop();if(!L||cur()!==e)return;e.hs.state=null;
    b=b&&b.text?b:last;
    if(!b.text){e.hs.err=hearErr(err||"no-speech");render();return;}
    const w=wordMatch(e.it.en,b.text);e.hs.words=w.words;e.hs.score=w.score;e.hs.heard=b.text;
    if(w.score>=need)speakPass();else{e.hs.tries++;skillHit(e.t,false);SND.play("no");render();}};
  HEAR.start(e.it.en,{onInterim:b=>{if(done||cur()!==e)return;const w=wordMatch(e.it.en,b.text);e.hs.words=w.words;last={text:b.text,score:w.score};
      if(w.score>=need){finish(null,last);return;}           // matched: grade immediately, no waiting for the browser
      clearTimeout(quiet);quiet=setTimeout(()=>finish(null,last),1400);render();},  // 1.4 s of silence after speech ends the turn
    onDone:(err,b)=>finish(err,b)});
}
function kidChoose(id){
  const e=cur();if(L.fb||e.wrong.includes(id))return;
  L.t++;day().t++;S.stats.t++;skillHit(e.t,id===e.it.id);
  L.combo=id===e.it.id?(L.combo||0)+1:0;L.best=Math.max(L.best||0,L.combo);
  if(id===e.it.id){L.c++;day().c++;S.stats.c++;L.fb={ok:true,show:"",bn:""};SND.play("ok");render();kidBurst(document.querySelector(".ktile.right"));const i=L.i;setTimeout(()=>{if(L&&L.i===i&&L.fb)next();},1300);}
  else{e.wrong.push(id);L.mistakes[e.it.id]=1;SND.play("no");render();}
}
function grade(){
  const e=cur();let ok=false,show="";
  if(e.t==="meaning"||e.t==="fill"){if(L.answer==null)return;ok=e.t==="meaning"?L.answer===e.it.bn:L.answer.toLowerCase()===e.word.toLowerCase();show=e.t==="meaning"?e.it.bn:e.it.en;}
  if(e.t==="build"||e.t==="listen"){if(!e.sel.length)return;const got=norm(e.sel.map(i=>e.tiles[i]).join(" "),true);ok=got===norm(e.it.en,true);show=e.it.en;}
  if(e.t==="type"){const v=($("#typein")?.value||"").trim();if(!v)return;L.typed=v;const a=norm(v,true),b=norm(e.it.en,true);const d=lev(a,b);ok=d===0||d<=Math.max(1,Math.floor(b.length*.08));show=e.it.en;if(ok&&d>0)L.typo=true;}
  L.t++;day().t++;S.stats.t++;skillHit(e.t,ok);
  L.combo=ok?(L.combo||0)+1:0;L.best=Math.max(L.best||0,L.combo);
  if(ok){L.c++;day().c++;S.stats.c++;}else{L.mistakes[e.it.id]=1;if((e.retry||0)<2)L.ex.push(Object.assign(prepare({t:e.t==="listen"&&!TTS.ok?"build":e.t,it:e.it},allItems()),{retry:(e.retry||0)+1}));}
  L.fb={ok,show,bn:e.it.bn};render();
  SND.play(ok?"ok":"no");
}
function next(){
  HEAR.stop();L.fb=null;L.answer=null;L.typo=false;L.typed=null;L.dict=false;L.dictErr=null;L.i++;
  if(L.i>=L.ex.length){finishSession();return;}
  maybeCheer();render();if(!L.cheer)playIfAuto();
}
function finishSession(){
  L.items.forEach(it=>srsUpdate(it.id,!L.mistakes[it.id]));
  const perfect=Object.keys(L.mistakes).length===0;
  let xp=L.kind==="lesson"?10+(perfect?5:0):8;
  addXP(xp);
  if(L.kind==="lesson"){S.done[L.key]={at:today(),acc:L.t?Math.round(L.c/L.t*100):null};day().lessons++;}else day().practice++;
  if(Object.keys(L.mistakes).length===0&&L.kind==="lesson")S.perfect=(S.perfect||0)+1;
  if(L.items[0]?.track==="kids"&&L.kind==="lesson"){const em=L.items.map(x=>x.em).filter(Boolean);L.sticker=em[Math.floor(Math.random()*em.length)]||"⭐";S.stickers=(S.stickers||[]).concat(L.sticker);}
  L.done=true;L.xp=xp;L.secs=Math.round((Date.now()-L.started)/1000);addMinutes(Math.min(30,L.secs/60));Store.save();render();SND.play("done");confetti();checkBadges();
}

const REC={mr:null,stream:null,chunks:[],start:0,blob:null,url:null,mime:"",timer:null,state:"idle",forId:null,err:null,an:null,raf:0};
function micErr(e){const n=e&&e.name;
  if(n==="NotAllowedError"||n==="SecurityError")return "মাইক্রোফোনের অনুমতি দেওয়া হয়নি। অ্যাড্রেস বারের বাম পাশে লক/মাইক আইকনে চাপো → Microphone → Allow, তারপর আবার Record চাপো।";
  if(n==="NotFoundError"||n==="OverconstrainedError")return "কোনো মাইক্রোফোন পাওয়া যায়নি। হেডসেট/মাইক লাগানো আছে কিনা দেখো।";
  if(n==="NotReadableError"||n==="AbortError")return "মাইক্রোফোন অন্য অ্যাপ (Zoom, WhatsApp কল) ব্যবহার করছে। সেটা বন্ধ করে আবার চেষ্টা করো।";
  return "মাইক্রোফোন চালু করা গেল না ("+(n||"error")+").";}
function recMeter(){
  cancelAnimationFrame(REC.raf);if(!REC.an)return;const buf=new Uint8Array(REC.an.fftSize);
  const loop=()=>{REC.an.getByteTimeDomainData(buf);let pk=0;for(let i=0;i<buf.length;i++)pk=Math.max(pk,Math.abs(buf[i]-128));
    const lv=Math.min(1,pk/70);const bars=document.querySelectorAll(".recbar i");bars.forEach((b,i)=>{const w=.35+.65*Math.abs(Math.sin(performance.now()/180+i*1.3));b.style.height=Math.max(12,Math.round(lv*w*100))+"%";});
    if(REC.state==="rec")REC.raf=requestAnimationFrame(loop);};
  REC.raf=requestAnimationFrame(loop);}
async function recStart(forId){
  REC.err=null;REC.forId=forId;
  try{
    if(!window.MediaRecorder)throw {name:"NoRecorder"};
    REC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    REC.mime=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||"";
    REC.mr=new MediaRecorder(REC.stream,REC.mime?{mimeType:REC.mime}:{});REC.chunks=[];
    REC.mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data);};
    REC.mr.onstop=()=>{REC.blob=new Blob(REC.chunks,{type:REC.mr.mimeType||REC.mime||"audio/webm"});if(REC.url)URL.revokeObjectURL(REC.url);REC.url=URL.createObjectURL(REC.blob);REC.stream.getTracks().forEach(t=>t.stop());REC.an=null;REC.state="done";REC.secs=Math.round((Date.now()-REC.start)/1000);render();};
    try{const c=SND.ac();if(c){const src=c.createMediaStreamSource(REC.stream);REC.an=c.createAnalyser();REC.an.fftSize=512;src.connect(REC.an);}}catch(e){REC.an=null;}
    REC.mr.start(1000);REC.start=Date.now();REC.state="rec";REC.blob=null;wake(true);
    clearInterval(REC.timer);REC.timer=setInterval(()=>{const el=$("#rectime");if(el)el.textContent=fmt((Date.now()-REC.start)/1000);if(Date.now()-REC.start>9*60*1000)recStop();},250);
  }catch(e){REC.state="idle";REC.err=e&&e.name==="NoRecorder"?"এই ব্রাউজারে রেকর্ডিং হয় না। Chrome বা Safari (iOS 14.3+) ব্যবহার করো।":micErr(e);SND.play("no");}
  render();recMeter();
}
function recStop(){clearInterval(REC.timer);wake(false);if(REC.mr&&REC.mr.state!=="inactive")REC.mr.stop();}
function recExt(){const t=REC.blob?.type||"";return t.includes("mp4")?"m4a":t.includes("ogg")?"ogg":"webm";}
function recFilename(base){return `${myName().replace(/[^\w]+/g,"")||"Me"}_${base}_${today()}.${recExt()}`;}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}

/* ================= AI generation ================= */
async function genUnit(topic,track){
  APP.busy="Notun unit banano hocche: "+topic;render();
  try{
    const kid=track==="family"||track==="kids", pic=track==="kids";
    const r=await aiJSON(`${CTX()}
Create a new learning unit about: "${topic}" for the ${track} track${kid?" (sentences a parent says at home to young children or to their spouse: very short 2-6 word sentences, warm and playful)":track==="client"?" (freelance web developer talking to international clients; practice past tense, articles and polite softening)":" (everyday situations)"}.
Reply with only JSON: {"title":"short unit title","bn":"Bangla title","lessons":[3 lessons {"title":"short","items":[6 ${pic?"triples [\"English word or 2-5 word phrase for a 3-7 year old\",\"Bangla\",\"one matching emoji\"]":"pairs [\"English sentence\",\"natural Bangla translation\"]"}]}],"story":{"title":"","bn":"one-sentence Bangla summary","text":"a ${kid?"warm family":"realistic"} story of about 420 words (5 minutes read aloud), mostly dialogue, using many of the unit's sentences, about ${myName()}${kid?" and family":""}; paragraphs separated by blank lines","phrases":["5 key phrases"]}}`,"default");
    if(!r?.lessons?.length||!r.story?.text)throw {code:"invalid_json"};
    const u={id:"x"+rid(),custom:true,track,title:r.title,bn:r.bn,lessons:r.lessons.slice(0,3).map(l=>({title:l.title,items:l.items.filter(x=>Array.isArray(x)&&x[0]&&x[1]&&(!pic||x[2])).slice(0,8)})),story:r.story,created:new Date().toISOString()};
    await Store.saveUnit(u);APP.busy=null;APP.track=track;APP.tab="learn";toast("নতুন ইউনিট পথে যোগ হয়েছে!");
  }catch(e){APP.busy=null;toast(aiErr(e));}
  render();
}
async function genToday(){
  const keys=Object.entries(S.done).filter(([k,d])=>d.at===today()).map(([k])=>k);
  const sents=keys.flatMap(k=>{const [uid,li]=k.split(":");const u=unitById(uid);return u?lessonItems(u,+li).map(x=>x.en):[];}).slice(0,30);
  APP.busy="আজকের গল্প তৈরি হচ্ছে…";render();
  try{const r=await aiJSON(`${CTX()}
Write today's communication story for ${myName()} to read aloud and record (about 5 minutes: around 420 words). Use as many of these sentences he learned today as naturally possible: ${JSON.stringify(sents)}. Make it a realistic, mostly-dialogue story about ${myName()}'s life (family, clients or daily life, matching the sentences). B1 level, short paragraphs separated by blank lines.
Reply with only JSON {"title":"","bn":"one-sentence Bangla summary","text":"","phrases":["5 key phrases"]}`,"default");
    const id="today-"+today().replace(/-/g,"")+"-"+rid().slice(-3);
    await Store.saveUnit({id,custom:true,track:"story",title:"Today "+today(),bn:"",lessons:[],story:r,created:new Date().toISOString()});
    APP.busy=null;APP.story=id;
  }catch(e){APP.busy=null;toast(aiErr(e));}
  render();
}

 async checkDb(){APP.check.db="Testing…";render();try{if(Store.mode==="cloud"){const ref=Store.db.doc(`data/users/${Store.uid}/probe`);const t=Date.now();await ref.set({t});const s=await ref.get();await ref.delete();APP.check.db=s.exists&&s.data().t===t?"কাজ করছে: cloud-এ লিখে, পড়ে, মুছে পরীক্ষা করেছি।":"Read-back mile ni.";}else{Store.lsSet("probe",{t:1});APP.check.db=Store.lsGet("probe")?"Works (shudhu ei browser e).":"ব্রাউজার স্টোরেজ বন্ধ, অগ্রগতি সেভ হবে না।";}}catch(e){APP.check.db="Failed: "+(e.code||e.name||"error");}render();},

 async exportData(){const data=JSON.stringify({app:"ali-english-coach-duo",v:3,at:new Date().toISOString(),S,CUSTOM},null,1);const name=`english-coach-backup-${today()}.json`;

function confirmQuit(){return true;}
function markSent(i){document.querySelectorAll(".sent.cur").forEach(x=>x.classList.remove("cur"));if(i>=0){const el=document.querySelectorAll(".sent")[i];if(el){el.classList.add("cur");const r=el.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-120)el.scrollIntoView({block:"center",behavior:"smooth"});}}}
async function switchProfile(id){
  TTS.stop();HEAR.stop();if(PID)await Store.flush();PID=id;await Store.saveProfiles();await Store.load();
  APP.picker=false;APP.tab="learn";APP.track=myTracks()[0]?.[0]||"everyday";APP.story=APP.cards=APP.chat=APP.warm=null;L=null;LASTKEY=null;render();window.scrollTo(0,0);
}
async function onbNext(){
  const O=APP.onb,d=O.draft,steps=d.age==="kid"?["name","avatar","age","goal","done"]:["name","avatar","age","goals","goal","warm","done"];
  if(steps[O.step]==="name"){const v=($("#onb-name")?.value||"").trim();if(!v){toast("নাম লেখো");return;}d.name=v.slice(0,20);}
  if(steps[O.step]==="age"&&!d.goal)d.goal=d.age==="kid"?20:30;
  if(O.step<steps.length-1){O.step++;render();return;}
  const goals=d.age==="kid"?["kids"]:(d.goals.length?d.goals:["everyday"]);
  if(O.edit){const p=PROFILES.find(x=>x.id===O.edit);Object.assign(p,{name:d.name,avatar:d.avatar,age:d.age,goals});if(d.photo)p.photo=d.photo;
    S.goal=+d.goal||S.goal;S.warmReq=d.age!=="kid"&&d.warm!=="off";S.warmMode=d.warm==="quick"?"quick":"full";APP.onb=null;await Store.flush();APP.track=myTracks()[0][0];toast("প্রোফাইল আপডেট হয়েছে");render();return;}
  if(PID)await Store.flush();
  const p={id:"p"+rid(),name:d.name,avatar:d.avatar,age:d.age,goals,created:new Date().toISOString()};if(d.photo)p.photo=d.photo;
  PROFILES.push(p);PID=p.id;S=defaultState();CUSTOM={};MARKS={};
  S.goal=+d.goal||30;S.warmReq=d.age!=="kid"&&d.warm!=="off";S.warmMode=d.warm==="quick"?"quick":"full";
  APP.onb=null;APP.tab="learn";APP.track=myTracks()[0][0];await Store.flush();LASTKEY=null;render();confetti();SND.play("done");
}
function matchPick(side,id){
  const e=cur();if(e.gone.includes(id))return;
  if(side==="L")e.selL=id;else e.selR=id;e.flash=e.flashR=null;
  if(e.selL&&e.selR){
    if(e.selL===e.selR){e.gone.push(e.selL);skillHit("match",true);SND.play("pair");}
    else{e.errs++;e.flash=e.selL;e.flashR=e.selR;L.mistakes[e.selL]=1;skillHit("match",false);SND.play("no");}
    e.selL=e.selR=null;
    if(e.gone.length===e.left.length){L.t++;day().t++;S.stats.t++;const ok=e.errs<=1;if(ok){L.c++;day().c++;S.stats.c++;}L.fb={ok,show:ok?"":"কিছু জোড়া ভুল ছিল, রিভিশনে যোগ হলো।",bn:""};}
  }
  render();
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;if(el.classList.contains("modal")&&e.target!==el)return;const f=ACT[el.dataset.act];if(!f)return;
  const snd=el.dataset.act in ACT_SOUND?ACT_SOUND[el.dataset.act]:"tap";if(snd&&!(el.dataset.act==="tab"&&el.dataset.v===APP.tab&&!APP.story&&!APP.cards&&!APP.chat))SND.play(snd);
  f(el,e);});

document.addEventListener("input",e=>{if(e.target.id==="typein"){if(L)L.typed=e.target.value;const b=document.querySelector('[data-act="check"]');if(b)b.disabled=!e.target.value.trim();}});
addEventListener("resize",()=>{renderNav(true);placeSeg(true);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderNav(true);placeSeg(true);});
document.addEventListener("change",e=>{
  if(e.target.id==="cardunit"){openCards(e.target.value);}
  if(e.target.id==="s-theme"){setTheme(e.target.value);render();}
  if(e.target.id==="photoFile"||e.target.id==="onbPhoto"){const f=e.target.files&&e.target.files[0];if(!f)return;
    readPhoto(f).then(data=>{if(e.target.id==="onbPhoto"){APP.onb.draft.photo=data;APP.onb.draft.avatar=APP.onb.draft.avatar||"🙂";}else{prof().photo=data;Store.saveProfiles();toast("প্রোফাইল ছবি সেট হয়েছে");}render();}).catch(()=>toast("এই ছবিটা পড়া গেল না"));}
  const sw={"s-warm":"warmReq","s-auto":"autoplay","s-sound":"sound"}[e.target.id];
  if(sw){S[sw]=e.target.checked;Store.save();SND.play("toggle");}
  if(e.target.id==="importFile"){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.app!=="ali-english-coach-duo")throw 0;APP.confirm={type:"import",data:d};render();}catch(x){toast("এটা এই অ্যাপের backup না।");}};rd.readAsText(f);}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.closest&&e.target.closest(".lg-card")){e.preventDefault();lgSubmit();return;}if(!L||L.done)return;if(e.key==="Enter"&&!e.shiftKey){if(L.fb){e.preventDefault();next();}else if(cur().t!=="match"){e.preventDefault();if(cur().t==="intro"||cur().t==="speak")ACT.skipEx();else grade();}}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)Store.flush();});

/* ================= boot ================= */
(async()=>{
  const boot=async()=>{await Store.init();await Store.loadProfiles();if(PID)await Store.load();};
  try{await Promise.race([boot(),new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),12000))]);}
  catch(e){toast("Cloud লোড হয়নি, এই ডিভাইসে চলছে।");Store.mode="local";try{await Store.loadProfiles();if(PID)await Store.load();}catch(x){}}
  let here=null;try{here=JSON.parse(sessionStorage.getItem("aec4:here")||"null");}catch(e){}
  if(PID){APP.track=myTracks()[0]?.[0]||"everyday";
    if(here&&here.pid===PID&&here.picker){APP.picker=true;}
    else if(here&&here.pid===PID){APP.tab=here.tab||"learn";if(here.track&&myTracks().some(t=>t[0]===here.track))APP.track=here.track;if(here.story&&storyOf(here.story))APP.story=here.story;}
  }
  else if(PROFILES.length)APP.picker=true;else APP.welcome=true;
  if(CLOUD.avail()){try{await CLOUD.load();await Promise.race([CLOUD.ready,new Promise(r=>setTimeout(r,8000))]);}catch(e){LG.err="প্রথমবার লগইনের জন্য ইন্টারনেট লাগবে।";}}
  const sp=document.getElementById("splash"),left=Math.max(0,1700-(Date.now()-(window.__t0||Date.now())));
  await new Promise(r=>setTimeout(r,left));
  if(sp){sp.classList.add("out");setTimeout(()=>sp.remove(),650);}
  render();
  if(TTS.dev)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}catch(e){}
})();
